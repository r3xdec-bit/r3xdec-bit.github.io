<html lang="en"><head>

    :root {
      --color-min: #55a630;
      --color-low: #aacc00;
      --color-med: #ffb703;
      --color-high: #ff2d20;
      --active-color: var(--color-low);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #050505;
      color: #F5F5F5;
      font-family: 'Manrope', sans-serif;
      overflow: hidden;
    }

    /* Gradient Border Wrapper */
    .gradient-border-wrap {
      position: relative;
      width: min(760px, calc(100vw - 32px));
      height: min(760px, calc(100vh - 32px));
      min-height: 680px;
      border-radius: 64px;
      background: linear-gradient(135deg, rgba(170,204,0,0.8) 0%, rgba(255,255,255,0.1) 40%, rgba(255,183,3,0.5) 70%, rgba(251,133,0,0.8) 100%);
      padding: 3px;
      box-shadow: 0 0 60px -20px rgba(170,204,0,0.2), 0 0 80px -20px rgba(251,133,0,0.2);
    }

    .panel-inner {
      position: relative;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      border-radius: 61px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 64px;
    }

    /* Diffused Grainy Glow */
    .bottom-glow {
      position: absolute;
      bottom: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 120%;
      height: 350px;
      background: radial-gradient(ellipse at top, color-mix(in srgb, var(--active-color) 48%, transparent) 0%, color-mix(in srgb, var(--active-color) 22%, transparent) 42%, transparent 72%);
      filter: blur(40px) contrast(1.2);
      transition: background 700ms ease, opacity 700ms ease;
      opacity: 0.8;
      pointer-events: none;
      z-index: 0;
    }
    
    .bottom-glow::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    .gauge-container {
      position: relative;
      width: min(560px, calc(100% - 64px));
      height: 170px;
      margin-top: 72px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .progress-track {
      position: relative;
      display: grid;
      grid-template-columns: repeat(16, minmax(0, 1fr));
      gap: 7px;
      width: 100%;
      padding: 24px 0 30px;
    }

    .progress-cell {
      height: 24px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 5px;
      background: rgba(255,255,255,0.045);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
      transition: background 500ms ease, border-color 500ms ease, box-shadow 500ms ease, transform 500ms ease;
    }

    .progress-cell.is-active {
      background: var(--active-color);
      border-color: color-mix(in srgb, var(--active-color) 80%, white);
      box-shadow: 0 0 12px color-mix(in srgb, var(--active-color) 85%, transparent), inset 0 0 8px rgba(255,255,255,0.28);
      transform: translateY(-1px);
    }

    .needle-line {
      position: absolute;
      top: 12px;
      left: 36%;
      width: 2px;
      height: 48px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 0 8px rgba(255,255,255,0.9), 0 0 16px var(--active-color);
      transition: left 1.1s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 500ms ease;
      z-index: 2;
    }

    .needle-line::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      transform: translateX(-50%);
      box-shadow: 0 0 8px #fff;
    }

    .risk-labels {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      color: rgba(255,255,255,0.56);
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
    }

    .risk-labels span { transition: color 400ms ease, text-shadow 400ms ease; }
    .risk-labels span:nth-child(1) { color: var(--color-min); }
    .risk-labels span:nth-child(2) { color: var(--color-low); }
    .risk-labels span:nth-child(3) { color: var(--color-med); }
    .risk-labels span:nth-child(4) { color: var(--color-high); }

    .percentage-text {
      font-family: 'Inter', sans-serif;
      font-weight: 200;
      letter-spacing: -0.06em;
      font-size: 150px;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 0%, #cccccc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .control-btn {
      transition: all 0.2s ease;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
    }

    .control-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.4);
    }
  </style>

      element.setAttribute('data-rendered', 'true');
      element.setAttribute('data-version', String(definition.version));
      console.log('[SDComponent] Rendered:', componentId, instanceId);

      // Render any nested sd-component children that were just injected
      var nestedElements = element.querySelectorAll('sd-component[componentid], sd-component[ref]');
      if (nestedElements.length > 0) {
        var missingIds = [];
        nestedElements.forEach(function(nested) {
          var nestedId = nested.getAttribute('componentid') || nested.getAttribute('ref');
          if (nestedId && !componentRegistry.has(nestedId)) {
            missingIds.push(nestedId);
          }
        });

        if (missingIds.length > 0) {
          // Fetch missing nested components, then render
          loadComponentsByIds(missingIds).then(function() {
            nestedElements.forEach(function(nested) {
              if (!nested.getAttribute('data-rendered')) {
                renderComponent(nested, depth + 1);
              }
            });
          });
        } else {
          // All nested definitions already loaded — render immediately
          nestedElements.forEach(function(nested) {
            if (!nested.getAttribute('data-rendered')) {
              renderComponent(nested, depth + 1);
            }
          });
        }
      }
    }

    function updateComponentInstances(componentId) {
      var elements = document.querySelectorAll('sd-component[componentid="' + componentId + '"], sd-component[ref="' + componentId + '"]');
      elements.forEach(function(el) { renderComponent(el); });
    }

    function initializeComponents() {
      var elements = document.querySelectorAll('sd-component[componentid], sd-component[ref]');
      elements.forEach(function(el) {
        if (!el.getAttribute('data-rendered')) { renderComponent(el); }
      });
    }

    async function loadComponentsByIds(ids) {
      if (!ids || ids.length === 0) return;
      // Deduplicate and filter already-loaded
      var uniqueIds = ids.filter(function(id, i, arr) {
        return arr.indexOf(id) === i && !componentRegistry.has(id);
      });
      if (uniqueIds.length === 0) return;

      try {
        console.log('[SDComponent] Batch loading components:', uniqueIds);
        var response = await fetch(API_BASE + '/v1/design-drafts/components/batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ componentIds: uniqueIds }),
        });
        if (!response.ok) throw new Error('Batch load failed: ' + response.status);
        var components = await response.json();
        console.log('[SDComponent] Batch loaded', components.length, 'components');
        components.forEach(function(comp) { registerComponent(comp.id, comp); });
      } catch (error) {
        console.error('[SDComponent] Failed to batch load components:', error);
      }
    }

    async function loadComponentsForDraft() {
      if (!DRAFT_ID) {
        console.warn('[SDComponent] No draft ID configured');
        showPage();
        return;
      }
      try {
        console.log('[SDComponent] Loading components for draft:', DRAFT_ID);
        var response = await fetch(API_BASE + '/v1/design-drafts/' + DRAFT_ID + '/components', {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' },
        });
        if (!response.ok) throw new Error('Failed to load components: ' + response.status);
        var components = await response.json();
        console.log('[SDComponent] Loaded', components.length, 'components');
        components.forEach(function(comp) { registerComponent(comp.id, comp); });
        initializeComponents();
        showPage();
      } catch (error) {
        console.error('[SDComponent] Failed to load components:', error);
        showPage();
      }
    }

    function findReferencedComponents() {
      var elements = document.querySelectorAll('sd-component[componentid], sd-component[ref]');
      var ids = new Set();
      elements.forEach(function(el) {
        var ref = el.getAttribute('componentid') || el.getAttribute('ref');
        if (ref) ids.add(ref);
      });
      return Array.from(ids);
    }

    window.__SD_COMPONENTS__ = {
      register: registerComponent,
      render: renderComponent,
      update: updateComponentInstances,
      loadForDraft: loadComponentsForDraft,
      loadByIds: loadComponentsByIds,
      init: initializeComponents,
      findRefs: findReferencedComponents,
      getRegistry: function() { return componentRegistry; },
      getInstances: function() { return instanceRegistry; },
      getDraftId: function() { return DRAFT_ID; },
    };

    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'SD_COMPONENT_UPDATE') {
        var cId = event.data.componentId;
        var def = event.data.definition;
        if (cId && def) { registerComponent(cId, def); updateComponentInstances(cId); }
      }
      if (event.data && event.data.type === 'SD_COMPONENTS_REGISTER') {
        var comps = event.data.components;
        if (Array.isArray(comps)) {
          comps.forEach(function(c) { registerComponent(c.id, c); });
          initializeComponents();
        }
      }
    });

    function bootComponents() {
      // Pre-register components from __SD_COMPONENT_PRELOAD__ (injected by backend for standalone previews)
      if (window.__SD_COMPONENT_PRELOAD__ && Array.isArray(window.__SD_COMPONENT_PRELOAD__)) {
        console.log('[SDComponent] Pre-registering', window.__SD_COMPONENT_PRELOAD__.length, 'preloaded components');
        window.__SD_COMPONENT_PRELOAD__.forEach(function(comp) {
          registerComponent(comp.id, comp);
        });
      }

      var refs = findReferencedComponents();
      var unloaded = refs.filter(function(id) { return !componentRegistry.has(id); });

      if (unloaded.length > 0) {
        if (DRAFT_ID) {
          loadComponentsForDraft();
        } else {
          // No draft ID — try batch loading the missing IDs directly
          loadComponentsByIds(unloaded).then(function() {
            initializeComponents();
            showPage();
          });
        }
      } else if (refs.length > 0) {
        // All components already registered (e.g. from preload) — render immediately
        initializeComponents();
        showPage();
      } else {
        showPage();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootComponents);
    } else {
      bootComponents();
    }

    var observer = new MutationObserver(function(mutations) {
      var hasNew = false;
      mutations.forEach(function(m) {
        m.addedNodes.forEach(function(node) {
          if (node.nodeType === 1) {
            if (node.tagName === 'SD-COMPONENT') { hasNew = true; }
            else if (node.querySelector) {
              if (node.querySelectorAll('sd-component[componentid], sd-component[ref]').length > 0) hasNew = true;
            }
          }
        });
      });
      if (hasNew) {
        var refs = findReferencedComponents();
        var unloaded = refs.filter(function(id) { return !componentRegistry.has(id); });
        if (unloaded.length > 0) {
          loadComponentsByIds(unloaded).then(function() {
            initializeComponents();
          });
        } else {
          initializeComponents();
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    console.log('[SDComponent] Runtime initialized');
  })();
  </script>
</head>
<body>
  <div id="app-root" class="min-h-screen flex items-center justify-center relative bg-black">
    
    <!-- Main Dashboard Card -->
    
  <div class="gradient-border-wrap" style="border-radius: 48px; border-width: 0px;">
      
    <div id="risk-panel" class="panel-inner shadow-2xl" style="background-color: rgb(10, 10, 10); gap: 0px; border-radius: 48px; color: rgb(51, 51, 51); border-width: 1px; border-style: solid; border-color: rgb(163, 212, 130);">
        
        <!-- Bottom Glow Effect -->
        <div class="bottom-glow"></div>

        <!-- Header Section -->
        <div class="text-center space-y-1 relative z-10">
          <p class="text-[15px] tracking-[0.2em] font-light text-white/80 uppercase" style="font-family: &quot;Inter var&quot;; font-size: 24px;">Risk Level</p>
          <h1 id="risk-label" class="text-[46px] font-medium tracking-tight uppercase mt-1" style="color: var(--color-low); text-shadow: rgba(170, 204, 0, 0.4) 0px 0px 20px; width: 241px; height: 97px; font-size: 98px; line-height: 106px; font-family: Inter; font-weight: 700; display: block; visibility: visible; margin: 2px 0px 0px; padding: 0px;">LOW</h1>
        </div>

        <!-- Minimal Gauge Section -->
        <div class="gauge-container" style="height: 106px; width: 681px;">
          <div class="progress-track" aria-label="Risk progress">
            <div id="needle-line" class="needle-line" aria-hidden="true"></div>
            <span class="progress-cell"></span><span class="progress-cell"></span><span class="progress-cell"></span><span class="progress-cell"></span>
            <span class="progress-cell"></span><span class="progress-cell"></span><span class="progress-cell"></span><span class="progress-cell"></span>
            <span class="progress-cell"></span><span class="progress-cell"></span><span class="progress-cell"></span><span class="progress-cell"></span>
            <span class="progress-cell"></span><span class="progress-cell"></span><span class="progress-cell"></span><span class="progress-cell"></span>
          </div>
          <div class="risk-labels" aria-label="Risk levels">
            <span>Minimum</span><span>Low</span><span>Medium</span><span>High</span>
          </div>
        </div>

        <!-- Value Center Overlay -->
        <div class="absolute bottom-[115px] left-0 w-full text-center z-20 flex flex-col items-center">
          <div id="percentage-val" class="percentage-text flex items-baseline justify-center" style="width: 282px; height: 137px;">36<span class="text-[100px] ml-2 font-light" style="font-size: 120px; font-weight: 400;">%</span></div>
          <div class="text-[17px] tracking-[0.25em] font-light text-white/70 uppercase mt-6" style="font-weight: 700; font-size: 18px; line-height: 14px; height: 21px;">Current Risk</div>
        </div>

        <!-- Interactive Controls (Subtle) -->
        <div class="absolute bottom-8 flex flex-wrap justify-center gap-3 z-30 px-4">
          <button onclick="updateRisk('MINIMUM')" class="control-btn px-4 py-1.5 rounded-full text-[10px] font-bold tracking-widest uppercase text-white/40">Min</button>
          <button onclick="updateRisk('LOW')" class="control-btn px-4 py-1.5 rounded-full text-[10px] font-bold tracking-widest uppercase text-white/40">Low</button>
          <button onclick="updateRisk('MEDIUM')" class="control-btn px-4 py-1.5 rounded-full text-[10px] font-bold tracking-widest uppercase text-white/40">Med</button>
          <button onclick="updateRisk('HIGH')" class="control-btn px-4 py-1.5 rounded-full text-[10px] font-bold tracking-widest uppercase text-white/40">High</button>
        </div>

      </div></div></div>

  <script>
    const cells = document.querySelectorAll('.progress-cell');
    const needle = document.getElementById('needle-line');
    const panel = document.getElementById('risk-panel');
    const bottomGlow = document.querySelector('.bottom-glow');
    const percentageLabel = document.getElementById('percentage-val');
    const riskLabel = document.getElementById('risk-label');

    const config = {
      MINIMUM: { label: 'MINIMUM', color: 'var(--color-min)', hex: '#55a630', percent: 12, position: 12 },
      LOW:     { label: 'LOW', color: 'var(--color-low)', hex: '#aacc00', percent: 36, position: 36 },
      MEDIUM:  { label: 'MEDIUM', color: 'var(--color-med)', hex: '#ffb703', percent: 68, position: 68 },
      HIGH:    { label: 'HIGH', color: 'var(--color-high)', hex: '#ff2d20', percent: 92, position: 92 }
    };

    // Generate Gauge Ticks
    function initTicks() {
      const totalTicks = 48;
      const radius = 110;
      const centerX = 140;
      const centerY = 130;
      
      // Gap indices to create 4 distinct sections
      const gaps = [12, 24, 36];
      
      for(let i=0; i <= totalTicks; i++) {
        if (gaps.includes(i)) continue; // Skip tick to create gap

        const angleDeg = -180 + (i * (180 / totalTicks));
        const angleRad = (angleDeg * Math.PI) / 180;
        
        const innerR = radius - 8;
        const outerR = radius + 8;
        
        const x1 = centerX + innerR * Math.cos(angleRad);
        const y1 = centerY + innerR * Math.sin(angleRad);
        const x2 = centerX + outerR * Math.cos(angleRad);
        const y2 = centerY + outerR * Math.sin(angleRad);
        
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1);
        line.setAttribute("y1", y1);
        line.setAttribute("x2", x2);
        line.setAttribute("y2", y2);
        
        // Thicker lines, smaller gaps
        line.setAttribute("stroke-width", "4");
        line.setAttribute("stroke-linecap", "butt");
        
        // Assign colors based on section
        let baseColor = "#333";
        if (i < 12) baseColor = config.MINIMUM.hex;
        else if (i < 24) baseColor = config.LOW.hex;
        else if (i < 36) baseColor = config.MEDIUM.hex;
        else baseColor = config.HIGH.hex;

        line.setAttribute("stroke", baseColor);
        line.setAttribute("data-section-color", baseColor);
        line.classList.add('segment');
        line.id = `tick-${i}`;
        ticksGroup.appendChild(line);
      }
    }

    function updateRisk(state) {
      const data = config[state];
      
      // Update Label
      riskLabel.innerText = data.label;
      riskLabel.style.color = data.color;
      riskLabel.style.textShadow = `0 0 20px ${data.hex}66`;
      
      // Animate Percentage text
      let currentText = percentageLabel.innerText.split('<')[0];
      let currentVal = parseInt(currentText) || 0;
      const targetVal = data.percent;
      const duration = 1000;
      const start = performance.now();
      
      function animate(time) {
        let progress = (time - start) / duration;
        if (progress > 1) progress = 1;
        // Easing
        const easeOutQuart = 1 - Math.pow(1 - progress, 4);
        const val = Math.round(currentVal + (targetVal - currentVal) * easeOutQuart);
        percentageLabel.innerHTML = `${val}<span class="text-[100px] ml-2 font-light">%</span>`;
        if (progress < 1) requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);

      // Synchronize the subtle needle, cells, and active-color glow
      panel.style.setProperty('--active-color', data.hex);
      bottomGlow.style.setProperty('--active-color', data.hex);
      needle.style.left = `${data.position}%`;
      const filledCells = Math.ceil((data.percent / 100) * cells.length);
      cells.forEach((cell, index) => cell.classList.toggle('is-active', index < filledCells));

      // Update Buttons
      document.querySelectorAll('.control-btn').forEach(btn => {
        btn.style.color = 'rgba(255,255,255,0.4)';
        btn.style.borderColor = 'rgba(255,255,255,0.1)';
      });
      const activeButton = document.querySelector(`[onclick="updateRisk('${state}')"]`);
      if (activeButton) {
        activeButton.style.color = '#fff';
        activeButton.style.borderColor = data.hex;
      }
    }

    initTicks();
    
    // Initial state trigger to match image exactly (LOW at 36%)
    setTimeout(() => {
      const initialBtn = document.querySelectorAll('.control-btn')[1];
      initialBtn.click();
    }, 100);

  </script>

</body></html>

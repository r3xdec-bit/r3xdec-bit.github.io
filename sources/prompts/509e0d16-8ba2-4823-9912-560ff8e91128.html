        }
      } else if (refs.length > 0) {
        // All components already registered (e.g. from preload) — render immediately
        initializeComponents();
        showPage();
      } else {
        showPage();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootComponents);
    } else {
      bootComponents();
    }

    var observer = new MutationObserver(function(mutations) {
      var hasNew = false;
      mutations.forEach(function(m) {
        m.addedNodes.forEach(function(node) {
          if (node.nodeType === 1) {
            if (node.tagName === 'SD-COMPONENT') { hasNew = true; }
            else if (node.querySelector) {
              if (node.querySelectorAll('sd-component[componentid], sd-component[ref]').length > 0) hasNew = true;
            }
          }
        });
      });
      if (hasNew) {
        var refs = findReferencedComponents();
        var unloaded = refs.filter(function(id) { return !componentRegistry.has(id); });
        if (unloaded.length > 0) {
          loadComponentsByIds(unloaded).then(function() {
            initializeComponents();
          });
        } else {
          initializeComponents();
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    console.log('[SDComponent] Runtime initialized');
  })();
  </script>
</head>
<body>
    <div class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
        <!-- Custom Cursor -->
        <div id="cursor" class="custom-cursor"></div>

        <!-- Header Controls -->
        <header class="fixed top-12 left-0 right-0 z-50 px-12 flex items-center justify-between">
            <div class="text-[10px] uppercase tracking-[0.3em] text-black/40">
                <p>Vector Particle Engine</p>
            </div>
            <div class="flex flex-col items-end gap-3">
                <div class="flex items-center gap-4">
                    <label for="svg-upload" class="cursor-pointer text-[10px] uppercase tracking-widest text-black/60 hover:text-black transition-colors flex items-center gap-2 border border-black/10 px-4 py-2 rounded-full">
                        <iconify-icon icon="lucide:upload"></iconify-icon>
                        Upload SVG
                    </label>
                    <input id="svg-upload" type="file" accept=".svg" class="hidden" />
                </div>
                <span class="text-[8px] uppercase tracking-widest text-black/30">Upload vector to burst particles</span>
            </div>
        </header>

        <!-- Visual Container -->
        <div class="relative flex flex-col items-center justify-center w-full h-full">
            <div id="svg-render-container" class="max-w-[70vw] max-h-[60vh] flex items-center justify-center transition-opacity duration-300 opacity-100">
                <!-- Default Placeholder SVG (Namskar text style) -->
                <img id="display-svg" src="sd-asset-b982ffc0-dc6d-4852-9992-24650f75a7fb-1786553758150-315ecd5c-Namskar.svg" crossorigin="anonymous" class="w-full h-auto pointer-events-none" alt="Interaction Area" / onerror="this.onerror=null;this.src='https://placehold.co/600x400/1a1a1a/888?text=Image';">
            </div>
            <!-- Invisible trigger area for hover detection -->
            <div id="burst-trigger" class="absolute z-30 cursor-none"></div>
        </div>

        <!-- Particles -->
        <canvas id="particle-canvas"></canvas>

        <!-- Footer -->
        <footer class="fixed bottom-12 left-1/2 -translate-x-1/2 z-50 opacity-30 text-center">
            <div class="h-px w-24 bg-black/20 mx-auto mb-4"></div>
            <p class="text-[10px] uppercase tracking-[0.2em]">Refined Floating Element Interaction</p>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        const displaySvg = document.getElementById('display-svg');
        const trigger = document.getElementById('burst-trigger');
        const cursor = document.getElementById('cursor');
        const fileInput = document.getElementById('svg-upload');
        const svgContainer = document.getElementById('svg-render-container');

        let particles = [];
        let mouse = { x: -1000, y: -1000 };
        let isHovering = false;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        class Particle {
            constructor(x, y, color, type) {
                this.initialX = x;
                this.initialY = y;
                this.originX = x;
                this.originY = y;
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 2.2 + 0.6;
                this.type = type;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.ease = 0.05 + Math.random() * 0.05;
                this.opacity = 1;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 0.5;

                if (this.type === 'dot') {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'ring') {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 1.8, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (this.type === 'cross') {
                    const s = this.size * 1.2;
                    ctx.beginPath();
                    ctx.moveTo(-s, 0); ctx.lineTo(s, 0);
                    ctx.moveTo(0, -s); ctx.lineTo(0, s);
                    ctx.stroke();
                }
                ctx.restore();
            }

            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let force = (220 - distance) / 220;

                if (distance < 220) {
                    let angle = Math.atan2(dy, dx);
                    let targetX = this.x - Math.cos(angle) * force * 18;
                    let targetY = this.y - Math.sin(angle) * force * 18;
                    this.x += (targetX - this.x) * 0.12;
                    this.y += (targetY - this.y) * 0.12;
                    this.opacity = Math.max(0.1, 1 - (distance / 400));
                } else {
                    this.x += (this.originX - this.x) * this.ease;
                    this.y += (this.originY - this.y) * this.ease;
                    this.opacity = 1;
                }

                this.originX += this.vx;
                this.originY += this.vy;
                this.rotation += this.rotationSpeed;

                if (Math.abs(this.originX - this.initialX) > 60) this.vx *= -1;
                if (Math.abs(this.originY - this.initialY) > 60) this.vy *= -1;
            }
        }

        async function initParticles() {
            // Prevent security errors by ensuring we have a local blob or dataURI if it's an external asset
            if (displaySvg.src.startsWith('http') && !displaySvg.src.startsWith(window.location.origin)) {
                try {
                    const response = await fetch(displaySvg.src);
                    const blob = await response.blob();
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        displaySvg.src = reader.result;
                    };
                    reader.readAsDataURL(blob);
                    return; // Re-triggered by onload
                } catch (e) {
                    console.warn("CORS fetch failed, falling back to basic rendering");
                }
            }

            if (!displaySvg.complete) {
                displaySvg.onload = () => initParticles();
                return;
            }

            const rect = displaySvg.getBoundingClientRect();
            
            // Validation: Ensure dimensions are valid (>0) to avoid IndexSizeError
            if (rect.width <= 0 || rect.height <= 0) {
                console.warn("SVG dimensions are invalid (0). Retrying...");
                setTimeout(initParticles, 100);
                return;
            }

            trigger.style.width = rect.width + 'px';
            trigger.style.height = rect.height + 'px';
            trigger.style.left = rect.left + 'px';
            trigger.style.top = rect.top + 'px';

            const tempCanvas = document.createElement('canvas');
            const tCtx = tempCanvas.getContext('2d');
            const scale = 1; 
            
            tempCanvas.width = Math.ceil(rect.width * scale);
            tempCanvas.height = Math.ceil(rect.height * scale);
            
            tCtx.drawImage(displaySvg, 0, 0, tempCanvas.width, tempCanvas.height);
            
            // Secondary check before getImageData
            if (tempCanvas.width === 0 || tempCanvas.height === 0) return;
            
            const imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height).data;

            particles = [];
            const gap = 8;

            for (let y = 0; y < tempCanvas.height; y += gap) {
                for (let x = 0; x < tempCanvas.width; x += gap) {
                    const index = (y * tempCanvas.width + x) * 4;
                    if (imgData[index + 3] > 80) {
                        const r = imgData[index];
                        const g = imgData[index + 1];
                        const b = imgData[index + 2];
                        const color = `rgb(${r},${g},${b})`;
                        
                        const px = rect.left + x;
                        const py = rect.top + y;
                        
                        let type = 'dot';
                        const rand = Math.random();
                        if (rand > 0.97) type = 'ring';
                        else if (rand > 0.94) type = 'cross';

                        particles.push(new Particle(px, py, color, type));
                    }
                }
            }
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    displaySvg.src = event.target.result;
                    displaySvg.onload = () => {
                        initParticles();
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (isHovering) {
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
            }
            requestAnimationFrame(animate);
        }

        trigger.addEventListener('mouseenter', () => {
            isHovering = true;
            svgContainer.style.opacity = '0';
            cursor.style.transform = 'translate(-50%, -50%) scale(0)';
            particles.forEach(p => {
                p.originX = p.initialX;
                p.originY = p.initialY;
                p.x = p.initialX;
                p.y = p.initialY;
            });
        });

        trigger.addEventListener('mouseleave', () => {
            isHovering = false;
            svgContainer.style.opacity = '1';
            cursor.style.transform = 'translate(-50%, -50%) scale(1)';
        });

        initParticles();
        animate();
    </script>
</body></html>

html.hero-on{--ink:#2B3A55;--v2-ink:#121A26;--v2-red:#D63B2F;--v2-label:"Martian Mono",ui-monospace,monospace;--v2-display:Unbounded,system-ui,sans-serif;--l-w:400;--l-st:75%;background:#0A1019}

<style>
/* VANTA Concept One / studio presentation */
:root {
  --font-serif:"Geist Serif",Georgia,serif; --amber:#ff9f71; --amber-line:#de8b62; --text-faint:#a3a7aa;
  --line:rgba(210,217,222,.20); --line-strong:rgba(210,217,222,.36);
}
.header, .header.is-scrolled, .header.is-open {
  top:0; left:0; right:0; padding:0 var(--gutter); height:70px;
  border-radius:0; border-bottom:1px solid var(--line); box-shadow:none;
  background:rgba(12,16,20,.89); backdrop-filter:blur(16px); opacity:1; transform:none;
}
.header:before { display:none }
.header__logo svg { width:118px }
.header__nav { gap:clamp(16px,2.3vw,42px) }
.header__nav a { color:#c4c8cb; font-size:.84rem }
.header__actions .btn { border-radius:3px; height:38px; min-height:38px }
.header__sound { box-shadow:none }
.header__sheet { top:100%; border-radius:0 0 4px 4px; background:#13191c }
.hero { isolation:isolate }
.hero::before { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:linear-gradient(90deg,rgba(10,14,17,.87),rgba(10,14,17,.48) 25%,transparent 50%),linear-gradient(0deg,rgba(10,14,17,.77),transparent 22%) }
.hero__copy { top:46%; transform:translateY(-50%); width:38%; gap:clamp(15px,2.1vh,28px) }
.hero__copy .eyebrow { display:flex; align-items:center; gap:12px; font-size:clamp(10px,.72vw,13px); letter-spacing:.19em; color:#e2dcd6 }
.hero__copy .eyebrow:before { content:""; width:28px; height:3px; background:var(--amber) }
.hero__title { margin:0 0 0 -.045em; font-size:clamp(65px,min(7.65vw,14.6vh),160px); line-height:.87; letter-spacing:-.075em; font-weight:650 }
.hero__title span,.hero__title em { display:block }
.hero__title em { font-family:var(--font-serif);font-style:normal; color:#ffad87; font-size:1.07em; font-weight:400; line-height:1.02; letter-spacing:-.055em }
.hero__copy .lede { max-width:32ch; font-size:clamp(14px,1.08vw,19px); line-height:1.48; color:#c9ced0 }
.hero__cta { gap:clamp(14px,1.5vw,28px); margin:4px 0 0; max-width:100% }
.studio-primary,.studio-link { min-height:44px; font:600 .86rem var(--font-body); touch-action:manipulation }
.studio-primary { display:inline-flex; align-items:center; justify-content:space-between; gap:18px; padding:0 17px; color:#21150f; background:#ffab81; border:1px solid transparent; border-radius:3px; transition:background-color .2s }
.studio-primary span { font-size:1.18em }
.studio-primary:hover { background:#ffd2b9 }
.studio-link { color:#efede9; text-decoration:underline; text-underline-offset:5px; text-decoration-color:#70777a }
.studio-link:hover { text-decoration-color:var(--amber) }
.studio-dock { position:absolute; left:var(--gutter); right:var(--gutter); bottom:clamp(48px,7vh,98px); border-top:1px solid #aeb8be51;
  display:flex; align-items:center; justify-content:space-between; padding-top:clamp(12px,2vh,23px); gap:18px }
.studio-caption { font:500 10px/1.3 var(--font-mono); color:#bdc2c5; letter-spacing:.16em; text-transform:uppercase }
.studio-targets dl { margin-top:9px; display:flex }
.studio-targets dl>div { display:flex; flex-direction:column-reverse; padding:0 clamp(20px,2.8vw,55px); border-left:1px solid var(--line) }
.studio-targets dl>div:first-child { padding-left:0; border:0 }
.studio-targets dt { font-size:11px; color:#c3c7c9 }
.studio-targets dd { font:500 clamp(24px,2.4vw,46px)/1.06 var(--font-display); letter-spacing:-.055em; margin:0 0 5px; font-variant-numeric:tabular-nums }
.studio-targets small { font:400 .44em var(--font-body); color:#d0d4d6; margin-left:5px; letter-spacing:0 }
.studio-finish { align-self:center; min-width:206px }
.studio-picker, .studio-picker>div { display:flex; align-items:center }
.studio-picker { gap:10px; color:#dddeda; font-size:12px; margin-top:4px }
.studio-picker button { width:36px; height:44px; display:grid; place-items:center; position:relative; background:none }
.studio-picker button:before { content:""; width:21px; height:21px; border:1px solid #9b9fa1; background:var(--sample); border-radius:50% }
.studio-picker button[aria-pressed=true]:after { content:""; position:absolute; width:29px; height:29px; border-radius:50%; border:1px solid var(--amber) }
.studio-orbit { position:absolute; right:var(--gutter); bottom:22px; color:#c4c6c4; font-size:9px; letter-spacing:.15em }
.studio-dock button:focus-visible,.hero__cta button:focus-visible { outline:2px solid #ffe2b8; outline-offset:2px }
.headline,.title { letter-spacing:-.055em; font-weight:480 }
.segmented,.segmented__thumb,.segmented button,.chip,.dialog,.pin__label { border-radius:4px }
.index-list button[aria-current] { box-shadow:inset 2px 0 var(--amber) }
@media(max-width:1023px) { .header { height:60px } }
@media(min-width:901px) and (max-height:570px) {
  .hero__copy { top:44%; gap:9px } .hero__title { font-size:min(6.1vw,13vh) }
  .hero__copy .lede { font-size:13px } .studio-dock { bottom:38px;padding-top:9px } .studio-targets dd {font-size:23px}
}
@media(max-width:900px) {
  .hero::before { background:linear-gradient(180deg,#0d1217 1%,#0d1217a8 21%,transparent 43%,transparent 66%,#0d1217cf 91%) }
  .hero__copy { top:calc(60px + clamp(12px,2.7svh,30px)); width:auto; right:var(--gutter); transform:none; gap:9px }
  .hero__title { display:flex; flex-wrap:wrap; align-items:baseline; gap:.15em; font-size:clamp(46px,9.4vw,79px); line-height:1.04 }
  .hero__copy .lede { font-size:14px; max-width:43ch }
  .hero__cta { margin:0; gap:15px } .studio-primary,.studio-link { font-size:.78rem }
  .studio-dock { bottom:18px; padding-top:10px; flex-wrap:wrap; gap:8px }
  .studio-caption { font-size:9px } .studio-orbit { bottom:22%; font-size:8px }
}
@media(max-width:600px) {
  .studio-dock { display:grid; grid-template-columns:1fr; gap:7px; bottom:max(10px,env(safe-area-inset-bottom)) }
  .studio-targets dl { display:grid; grid-template-columns:repeat(3,1fr); margin-top:6px }
  .studio-targets dl>div { padding:0 15px } .studio-targets dd { font-size:26px; margin-bottom:1px }
  .studio-finish { display:flex; align-items:center; gap:8px; border-top:1px solid var(--line); padding-top:2px }
  .studio-picker { margin:0;gap:5px } .studio-finish .studio-caption { margin-right:auto }
  .studio-orbit { bottom:calc(max(10px,env(safe-area-inset-bottom)) + 137px) }
}
@media(max-width:900px) and (max-height:600px) and (orientation:landscape) {
  .header {height:46px} .hero__copy {top:51px; width:41%; gap:3px}
  .hero__title {font-size:clamp(32px,5vw,46px)} .hero__copy .lede {font-size:12px}
  .hero__copy .eyebrow {font-size:8px} .hero__cta {gap:8px} .studio-primary,.studio-link {min-height:34px}
  .studio-dock {bottom:5px; padding-top:5px} .studio-targets dd {font-size:19px} .studio-orbit {display:none}
}
.fallback picture { display:block; width:100%; height:100% }
.fallback img { object-position:65% 50%; opacity:1 }
.fallback__note { top:83px; bottom:auto; right:var(--gutter); font-size:9px; color:#bdc2c5 }
html.still-studio .studio-orbit { display:none }
@media (max-width:900px) { .fallback__note {top:auto; bottom:22%} }

/* Typography and control states */
.headline, .finale__title, .film__title {
  font-family:var(--font-serif); font-weight:400; font-style:normal; letter-spacing:-.038em;
}
.title { font-weight:510; letter-spacing:-.025em }
.eyebrow, .eyebrow--dim { letter-spacing:.17em }
.studio-caption, .swatch__name { font-weight:550; letter-spacing:.11em }
.mono, .specs dd, .studio-targets dd { font-variant-numeric:tabular-nums lining-nums }
.header__nav a[aria-current], .swatch input:checked~.swatch__name { color:var(--bone); font-weight:550 }
.studio-picker button[aria-pressed=true]:after { border-width:2px }
.segmented button[aria-pressed=true], .chip[aria-pressed=true] { font-weight:570 }
.dialog input { border-color:var(--line-strong); caret-color:var(--amber) }
.dialog input:focus-visible, .header a:focus-visible, .header button:focus-visible,
.tabs button:focus-visible, .index-list button:focus-visible, .chip:focus-visible,
.segmented button:focus-visible, .gallery__index button:focus-visible {
  outline:2px solid #ffbd99; outline-offset:2px;
}
@media (hover:hover) {
  .studio-picker button:hover:before { border-color:var(--bone) }
  .studio-link:hover, .footer a:hover { text-decoration:underline; text-underline-offset:.25em }
}

function buildForgedWheel(wheel, dimensions, materials) {
  const blades = [], faceCuts = [], valveParts = [];
  const rim = dimensions.rim, depth = dimensions.W * 0.19;
  const point = (radius, angle, offset, axial) => ie(
    radius * Math.cos(angle) - offset * Math.sin(angle),
    radius * Math.sin(angle) + offset * Math.cos(angle), axial

  for (let index = 0; index < dimensions.spokes; index++) {
    const start = index * 2 * Math.PI / dimensions.spokes + Math.PI / 2;
    for (const branch of [-1, 1]) {
      const stations = [], highlights = [];
      for (let step = 0; step <= 12; step++) {
        const t = step / 12;
        const radius = 0.033 + (rim - 0.049) * t;
        const angle = start + 0.21 * t + branch * (0.028 + 0.27 * t * t);
        const width = 0.0115 - 0.0055 * Math.sin(Math.PI * t);
        const dish = depth * (0.38 - 0.60 * Math.sin(Math.PI * t) + 0.48 * t);
        stations.push([point(radius, angle, -width, -dish), point(radius, angle, -width, dish),
          point(radius, angle, -width * 0.50, dish + 0.003),
          point(radius, angle, width * 0.45, dish + 0.002),
          point(radius, angle, width, dish - 0.0015), point(radius, angle, width, -dish)]);
        for (const side of [-1, 1]) {
          const key = side < 0 ? 0 : 1;

  }
  wheel.add(Y(Re(blades), materials.gunmetal, "forged-split-spokes"));
  wheel.add(Y(Re(faceCuts), materials.aluBright, "machined-spoke-faces"));
  const base = point(rim - 0.015, -0.41, 0, dimensions.W * 0.2);
  const tip = base.clone().add(ie(-0.016, 0.007, 0.005));
  valveParts.push(lt(base, tip, 0.0038, 0.0028, 10));
  wheel.add(Y(Re(valveParts), materials.rubber, "valve-stem"));
}

}

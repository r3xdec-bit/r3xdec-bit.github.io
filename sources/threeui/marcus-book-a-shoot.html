:root{
--paper:#F3F2ED; --ink:#0B0B0C; --muted:#6B6B70; --line:rgba(11,11,12,.12);
--blue:#4E6D88; --blue-soft:#839AAF;
--ease:cubic-bezier(.16,1,.3,1);
--pad:clamp(16px,4vw,64px);
}
*{box-sizing:border-box;margin:0;padding:0}
.btn{display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);font:600 14px/1 Inter,sans-serif;padding:6px 6px 6px 20px;transition:background .3s}
.btn b{width:40px;height:40px;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-weight:400;transition:transform .5s var(--ease)}
.btn:hover b{transform:translateX(4px)}
.btn.light{background:#fff;color:var(--ink)}
.btn.light b{background:var(--ink);color:#fff}
@keyframes mq{to{transform:translateX(-100%)}}

*{box-sizing:border-box}html,body{margin:0}body{min-height:100svh;display:grid;place-content:center;}body{background:#1b1a19}a{text-decoration:none}</style></head><body><a class="btn light" href="#contact" id="book-shoot">Book a shoot <b>→</b></a><script>document.querySelector("a").onclick=e=>{e.preventDefault();document.dispatchEvent(new CustomEvent("book-shoot",{bubbles:true}))}</script></body></html>

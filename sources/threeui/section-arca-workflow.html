const modal=document.querySelector('#video-modal'),openButton=root.querySelector('[aria-label="Play video"]');
modal.hidden=true;modal.setAttribute('aria-hidden','true');
let previousFocus=null,previousOverflow='';
function openFilm(){previousFocus=document.activeElement;previousOverflow=document.body.style.overflow;document.body.style.overflow='hidden';modal.hidden=false;modal.setAttribute('aria-hidden','false');modal.classList.add('modal--open');modal.querySelector('[role="button"]').focus()}
function closeFilm(){modal.hidden=true;modal.setAttribute('aria-hidden','true');modal.classList.remove('modal--open');document.body.style.overflow=previousOverflow;previousFocus?.focus({preventScroll:true})}
root.querySelector('[data-video-open]').addEventListener('click',openFilm,{signal:life.signal});
openButton.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openFilm()}},{signal:life.signal});
for(const close of modal.querySelectorAll('[data-modal-close]')){close.addEventListener('click',closeFilm,{signal:life.signal});close.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();closeFilm()}},{signal:life.signal})}
modal.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeFilm()}if(e.key==='Tab'){e.preventDefault();modal.querySelector('[role="button"]').focus()}},{signal:life.signal});

addEventListener('pagehide',()=>{dead=true;life.abort();cancelAnimationFrame(frame);observers.forEach(o=>o.disconnect());textures.forEach(t=>t.dispose());for(const t of instances){t.scene.traverse(o=>{o.geometry?.dispose();for(const m of [o.material].flat())m?.dispose()});t.renderer.dispose();t.renderer.forceContextLoss()}},{once:true});
let THREE;try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.min.js')}catch{/* Original artwork remains available without WebGL. */}
if(dead)return;
function fovScale(w,h){return Math.max(0,1.8717948717948718-w/h)*.5+1}
function createThree(opts){
 const c=Object.assign({near:.1,far:1000,fov:75,position:[10,10,10],rotation:[0,0,0]},opts.camera),container=opts.container;
 const size={w:Math.max(1,container.clientWidth),h:Math.max(1,container.clientHeight)};
 const fov=()=>('workflow'==='pass'?(FA.smDown?28:30.65):c.fov)*fovScale(size.w,size.h);
 const camera=new THREE.PerspectiveCamera(fov(),size.w/size.h,c.near||.1,c.far);camera.position.fromArray(c.position);camera.rotation.set(...c.rotation);
 const scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.toneMapping=THREE.NoToneMapping;renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));renderer.setSize(size.w,size.h);renderer.domElement.setAttribute('aria-hidden','true');container.append(renderer.domElement);
 const t={container,camera,scene,renderer,size,isRunning:false,start(){this.isRunning=true},resize(){size.w=Math.max(1,container.clientWidth);size.h=Math.max(1,container.clientHeight);camera.aspect=size.w/size.h;camera.fov=fov();camera.updateProjectionMatrix();renderer.setSize(size.w,size.h);schedule()},tick(){if(!this.isRunning||dead)return;const r=container.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight)renderer.render(scene,camera)}};
 renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();showFallback()},{signal:life.signal});
 const ro=new ResizeObserver(()=>t.resize());ro.observe(container);observers.push(ro);instances.push(t);return t;
}
const texLoader=THREE?new THREE.TextureLoader():null;texLoader?.setCrossOrigin('anonymous');
function loadTexture(url){return new Promise((resolve,reject)=>{if(!texLoader){reject(new Error('WebGL unavailable'));return}texLoader.load(url,tex=>{if(dead){tex.dispose();reject(new Error('Section removed'));return}textures.add(tex);resolve(tex)},undefined,reject)})}
function elementMouse(el){const m={x:.5,y:.5};addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();m.x=reduce.matches?.5:clamp((e.clientX-r.left)/r.width,0,1);m.y=reduce.matches?.5:clamp((e.clientY-r.top)/r.height,0,1)},{signal:life.signal,passive:true});reduce.addEventListener('change',()=>{if(reduce.matches)m.x=m.y=.5},{signal:life.signal});return m}
// Preserve the source's responsive letter deformation independently of page state.
const titleMouse=lerped(.5,{lerp:.05});
const groups=[...root.querySelectorAll('[data-title] svg')].map(svg=>[...svg.querySelectorAll('[data-char]')].map(el=>({el,base:Number(el.dataset.scaleY)||1})));
FA.onFrame(dt=>{titleMouse.target=reduce.matches?.5:FA.mouse.x;const x=titleMouse.update(dt),direction=x>.5?1:-1,strength=Math.abs(x-.5)*2;for(const group of groups)group.forEach((c,i)=>{const position=group.length>1?(i+.5)/group.length*2-1+1/group.length:0;c.el.style.transform='scaleY('+clamp(c.base+position*direction*strength*-Math.min(1.5-c.base,.2),.1,1).toFixed(5)+')'})});
const GET_SEEN_VERT = `#ifndef PI
#define PI 3.141592653589
#endif
#define BUBBLE_AMOUNT 0.2
#define BUBBLE_RADIUS 0.9
uniform vec2 mousePos;
uniform float progressStart;
uniform float progressEnd;
uniform float radius;
varying vec2 vUv;
float scaleValue(float value, float valueMin, float valueMax, float targetMin, float targetMax) {
    return clamp(targetMin + (value - valueMin) / (valueMax - valueMin) * (targetMax - targetMin), min(targetMin, targetMax), max(targetMin, targetMax));
}
vec4 bend(vec4 coords, float progressStart, float progressEnd) {
    vec4 bentCoords = coords;
    float yAnimationOffset = 0.25;
    float adjustedProgress = progressStart + (1.0 - coords.y) * yAnimationOffset;
    if (progressStart > 0.5) {
        float endProgressStart = scaleValue(progressStart, 0.5, 1.0, 0.0, 1.0);
        adjustedProgress = progressStart * endProgressStart + adjustedProgress * (1.0 - endProgressStart);
    }
    float angle = (1.0 - adjustedProgress) * PI;
    float zOffset = (2.0 - cos(angle) * 2.0);
    #if USE_MOUSE
        float yOffset = (1.0 - progressStart) * 0.25 + progressEnd * 2.25;
    #else
        float yOffset = (1.0 - progressStart) * 0.55 + progressEnd * 2.25;
    #endif
    bentCoords.y = bentCoords.y * cos(angle) + yOffset;
    bentCoords.z = bentCoords.z * sin(angle) - zOffset;
    return bentCoords;
}
void main() {
    vUv = uv;
    vec4 bentPosition = bend(vec4(position, 1.0), progressStart, progressEnd);
    vec4 pos = modelViewMatrix * bentPosition;
    vec4 posScreen = projectionMatrix * pos;
    vec3 posScreenNormalized = posScreen.xyz / posScreen.w;
    #if USE_MOUSE
        float mouseDistance = length(mousePos.xy - posScreenNormalized.xy);
        float displacementStrength = 1.0 - smoothstep(0.0, BUBBLE_RADIUS, mouseDistance);
        float displacement = displacementStrength * BUBBLE_AMOUNT;
        pos.z += displacement;
    #endif
    gl_Position = projectionMatrix * pos;
}`;
const TEX_FRAG = `varying vec2 vUv;
uniform sampler2D imageTexture;
void main() {
    gl_FragColor = texture2D(imageTexture, vUv);
}`;

async function initGetSeen() {
  const container = document.querySelector('[data-getseen-webgl]');
  if (!container) return;
  const sec = FA.sec['get-seen'];
  const m = elementMouse(container);
  const lx = FA.lerped(0.5, { lerp: 0.2 }), ly = FA.lerped(0.5, { lerp: 0.2 });
  const mousePos = { value: new THREE.Vector2(0.5, 0.5) };
  const progressStart = { value: 0 }, progressEnd = { value: 0 };
  const three = createThree({ container, camera: { fov: 28, near: 0, far: 200, position: [0, -0.048, 2.04], rotation: [0, 0, 0] }, transparent: true });
  const tex = await loadTexture(TEX.getSeen);if(dead)return;
  const mat = new THREE.ShaderMaterial({
    side: THREE.DoubleSide, fragmentShader: TEX_FRAG, vertexShader: GET_SEEN_VERT,
    uniforms: { imageTexture: { value: tex }, mousePos, progressStart, progressEnd },
    defines: { USE_MOUSE: FA.smDown ? 0 : 1 },
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1 / 460 * 540, 20, 20), mat);
  three.scene.add(mesh);
  three.start();
  FA.onFrame((dt, now) => {
    const svh = FA.vh / 100;
    const top = sec.top;
    const o = scale(top / (svh * 100), 0.75, 0, 0, 1), s = scale(top / (svh * 100), 0, -2, 0, 1);
    const a = easeInSine(s), r = easeInOutSine(o - s);
    progressStart.value = scale(r, 0, 1, -0.25, 1);
    progressEnd.value = a;
    if (!FA.smDown) {
      lx.target = m.x; ly.target = m.y; lx.update(dt); ly.update(dt);
      mousePos.value.set(lx.value * 2 - 1, (ly.value * 2 - 1) * -1);
    }
    three.tick(now);
  });
}


try{await initGetSeen();if(!dead){fallback.hidden=true;schedule()}}catch(error){showFallback()}
function tick(now){frame=0;if(dead||document.hidden||!visible)return;const dt=last?Math.min(60,now-last):16;last=now;for(const fn of FA.hooks)fn(dt,now);if(!reduce.matches)frame=requestAnimationFrame(tick)}
function schedule(){if(!frame&&!dead&&!document.hidden&&visible){last=0;frame=requestAnimationFrame(tick)}}
const io=new IntersectionObserver(([entry])=>{visible=entry.isIntersecting;if(visible)schedule();else{cancelAnimationFrame(frame);frame=0}});io.observe(root);observers.push(io);
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0}else schedule()},{signal:life.signal});
reduce.addEventListener('change',()=>{FA.mouse.x=FA.mouse.y=.5;schedule()},{signal:life.signal});
schedule();
})();
</script></body></html>

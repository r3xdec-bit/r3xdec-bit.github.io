<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbital Sphere Command Hero — r3xdec 3D</title>
  <script type="importmap">
  { "imports": { "three": "/vendor/three/three.module.js" } }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #040711; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 28px 40px; pointer-events: none; z-index: 10;
    }
    .nav { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #94a3b8; }
    .nav strong { color: #fff; font-size: 15px; letter-spacing: -0.02em; }
    .hero { max-width: 560px; margin-bottom: 24px; }
    .tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.32); color: #7dd3fc; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-family: ui-monospace, monospace; }
    h1 { margin-top: 16px; font-size: clamp(36px, 5vw, 62px); line-height: 1.04; letter-spacing: -0.03em; font-weight: 600; }
    p { margin-top: 14px; font-size: 15px; line-height: 1.6; color: #94a3b8; max-width: 44ch; }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="nav"><strong>r3xdec // orbital</strong><span>LIVE TELEMETRY · 60FPS</span></div>
    <div class="hero">
      <div class="tag">GLOBAL EDGE MESH · ACTIVE</div>
      <h1>Real-time spatial telemetry at planetary scale.</h1>
      <p>Interactive Three.js geodesic node mesh with synchronized orbital rings and pointer parallax.</p>
    </div>
  </div>
  <script type="module">
    import * as THREE from 'three';

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x040711, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.4, 7.6);

    const group = new THREE.Group();
    group.position.set(1.5, 0.1, 0);
    scene.add(group);

    // Outer geodesic wireframe
    const outer = new THREE.Mesh(
      new THREE.IcosahedronGeometry(2.15, 2),
      new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.34 })
    );
    group.add(outer);

    // Glowing inner plasma core
    const core = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.25, 3),
      new THREE.MeshStandardMaterial({ color: 0x0ea5e9, emissive: 0x1d4ed8, emissiveIntensity: 1.8, roughness: 0.3, wireframe: true })
    );
    group.add(core);
    scene.add(new THREE.PointLight(0x38bdf8, 25, 20));

    // Three orbital rings
    const rings = [2.65, 3.05, 3.45].map((r, i) => {
      const m = new THREE.Mesh(
        new THREE.TorusGeometry(r, 0.014, 12, 120),
        new THREE.MeshBasicMaterial({ color: i === 1 ? 0x818cf8 : 0x38bdf8, transparent: true, opacity: 0.65 })
      );
      m.rotation.set(Math.PI / 2.4 + i * 0.4, i * 0.6, 0);
      group.add(m);
      return m;
    });

    // Vertex nodes
    const vPos = outer.geometry.attributes.position.array;
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vPos), 3));
    group.add(new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0xe0f2fe, size: 0.075 })));

    let tx = 0, ty = 0;
    window.addEventListener('pointermove', e => {
      tx = ((e.clientX / window.innerWidth) - 0.5) * 1.4;
      ty = ((e.clientY / window.innerHeight) - 0.5) * 1.0;
    });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate(ms) {
      const t = ms * 0.001;
      outer.rotation.y = t * 0.25;
      outer.rotation.x = t * 0.1;
      core.rotation.y = -t * 0.45;
      rings.forEach((r, i) => { r.rotation.z = t * (0.35 + i * 0.18) * (i % 2 ? -1 : 1); });
      camera.position.x += (tx - camera.position.x) * 0.05;
      camera.position.y += ((0.4 - ty) - camera.position.y) * 0.05;
      camera.lookAt(0.8, 0, 0);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>

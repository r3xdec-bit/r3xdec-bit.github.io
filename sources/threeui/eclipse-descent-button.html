:root{--ink:#f2f0e9;--muted:#9ca9b2;--gold:#d9af75;--line:rgba(224,232,236,.21);--pad:clamp(24px,4.5vw,88px);--sans:'Manrope',sans-serif;--display:'Space Grotesk',sans-serif;color-scheme:dark}
*{box-sizing:border-box}html{background:#060a10;scrollbar-width:thin;scrollbar-color:#665b4d #080d13}body{margin:0;background:#060a10;color:var(--ink);font-family:var(--sans);font-size:14px;overflow-x:hidden}button{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}button{touch-action:manipulation}.journey-button{display:inline-flex;align-items:center;justify-content:space-between;gap:35px;min-width:240px;border:1px solid #c1ad8b66;padding:19px 21px;font-size:9px;font-weight:600;letter-spacing:1.6px;background:linear-gradient(110deg,#d5b87b0c,transparent);position:relative;transition:background .35s,border-color .35s;isolation:isolate}.journey-button:before,.journey-button:after{content:'';position:absolute;top:-1px;left:-1px;width:7px;height:7px;border-top:1px solid var(--gold);border-left:1px solid var(--gold)}.journey-button:after{top:auto;left:auto;bottom:-1px;right:-1px;transform:rotate(180deg)}.journey-button:hover{background:#d9af7524;border-color:var(--gold)}.button-arrow{font-size:19px;line-height:1;font-weight:400;color:var(--gold)}.solid .button-arrow{color:#181a1c}
@media(min-width:1700px){.journey-button{font-size:11px;min-width:280px;padding:23px}}
@media(max-width:700px){:root{--pad:24px}.journey-button{font-size:8px;min-width:220px;padding:17px 18px}.universe-copy .journey-button{width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}.journey-button{transition:none}}
.beyond-invitation .journey-button{width:100%;min-width:0;background:#183438;color:#f1e7cf;border-color:#183438;padding:20px;font-size:8px;letter-spacing:1.4px}
.beyond-invitation .journey-button:hover{background:#2e5053}.beyond-invitation .button-arrow{color:#e1cca7}
@media(max-width:700px){
  .beyond-invitation .journey-button{padding:18px 19px;font-size:8px;min-height:54px}
}
.reduced-motion .journey-button{transition:none}

html,body{width:100%;min-height:100%;margin:0}body{min-height:100vh;display:grid;place-items:center;overflow:hidden}.component-stage{padding:48px;display:grid;place-items:center}button:focus-visible{outline:2px solid currentColor;outline-offset:6px}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}</style></head><body><!-- Authored by Aksonvady Phomhome on Aura; independent extraction for ThreeUI. --><main class="component-stage"><button class="journey-button magnetic" type="button"><span>BEGIN THE DESCENT</span><span class="button-arrow">↘</span></button></main><script>const $$=s=>[...document.querySelectorAll(s)],reduced=matchMedia('(prefers-reduced-motion:reduce)').matches,touch=matchMedia('(pointer:coarse)').matches;$$('.magnetic').forEach(b=>{b.addEventListener('pointermove',e=>{if(reduced||e.pointerType==='touch')return;const r=b.getBoundingClientRect();gsap.to(b,{x:(e.clientX-r.left-r.width/2)*.1,y:(e.clientY-r.top-r.height/2)*.14,duration:.5,ease:'power3.out'});});b.addEventListener('pointerleave',()=>gsap.to(b,{x:0,y:0,duration:.65,ease:'elastic.out(1,.45)'}));});

,255,255,.7),transparent 62%);opacity:0;transition:opacity .45s}.btn__cap:after{content:"";position:absolute;top:-20%;bottom:-20%;left:-38%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7) 50%,transparent);transform:skew(-20deg);animation:btnSheen 7s cubic-bezier(.65,0,.35,1) 1.6s infinite}@keyframes btnSheen{0%{translate:0 0}24%,to{translate:480% 0}}.btn__label{position:relative;z-index:1;display:inline-flex;align-items:center;overflow:hidden;line-height:1.5;height:1.5em;transition:translate .25s var(--out)}.btn__ch{position:relative;display:inline-block;white-space:pre;color:var(--lc);transition:transform .36s cubic-bezier(.16,1,.3,1) calc(var(--i) * 9ms),color .11s linear calc(var(--i) * 9ms)}.btn__ch:after{content:attr(data-c);position:absolute;left:0;top:100%;color:var(--lc)}.btn__sep{width:4px;height:4px;border-radius:50%;background:var(--lc);opacity:.45;margin:0 10px}.btn__chip{position:relative;z-index:1;flex:none;width:var(--ch);height:var(--ch);border-radius:50%;overflow:hidden;display:grid;place-items:center;color:var(--yellow);background:radial-gradient(120% 90% at 30% 20%,#3a3a43,#0b0b0e 70%);box-shadow:inset 0 0 0 1px #ffffff29,inset 0 1px #ffffff38,0 2px 6px -1px #00000080;transition:translate .25s var(--out)}.btn__trace{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke-linecap:round}.btn__trace .dim{stroke:#ffffff29;stroke-width:1.1}.btn__trace .lit{stroke:var(--yellow);stroke-width:1.4;stroke-linecap:butt;stroke-dasharray:1 2;stroke-dashoffset:1;transition:stroke-dashoffset .5s cubic-bezier(.65,0,.35,1) .12s}.btn__trace .pad{fill:#ffffff0d;stroke:#ffffff38;stroke-width:1.1;transition:fill .14s,stroke .14s}.btn__arrow{position:relative;width:12px;height:12px;display:block;transition:color 0s linear .07s}.btn-big .btn__arrow{width:15px;height:15px}.btn__arrow svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}@keyframes btnArrow{0%{translate:0 0}38%{translate:3.5px 0}to{translate:0 0}}.btn__ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:radial-gradient(closest-side,#ffffffb3,#fff3 55%,#fff0);animation:btnBloom .7s cubic-bezier(.16,1,.3,1) forwards;pointer-events:none}@keyframes btnBloom{0%{transform:scale(.3);opacity:1}to{transform:scale(7);opacity:0}}.btn:hover .btn__bezel{inset:calc(var(--bz) * -.7);box-shadow:inset 0 1px 3px #000000e6,inset 0 0 0 1px #ffffff38,0 12px 24px -6px #1e140580}.btn:hover .btn__cap{translate:0 -1px;box-shadow:inset 0 1px #ffffffe6,inset 0 -2px #00000038,inset 0 0 0 1px #ffffff80,0 10px 22px -10px var(--yellow)}.btn:hover .btn__cap:before{opacity:.6}.btn:hover .btn__ch{transform:translateY(-100%);color:transparent}.btn:hover .btn__trace .lit{stroke-dashoffset:0}.btn:hover .btn__trace .pad{fill:var(--yellow);stroke:var(--yellow)}.btn:hover .btn__arrow{color:#0b0b0e;animation:btnArrow .55s cubic-bezier(.33,1,.68,1) .08s}.btn:hover .btn__label,.btn:hover .btn__chip{translate:0 -1px}.btn:active .btn__cap{transition-duration:.07s;translate:0 2px;box-shadow:inset 0 1px #fff6,inset 0 3px 7px #0000004d,inset 0 0 0 1px #ffffff4d}.btn:active .btn__label,.btn:active .btn__chip{translate:0 2px;transition:translate .07s}@media(prefers-reduced-motion:reduce){.btn__cap:after{display:none}.btn__ch,.btn__ch:after,.btn__trace .lit{transition:none}.btn:hover .btn__arrow{animation:none}}.btn:focus-visible{outline:2px solid var(--blue);outline-offset:calc(var(--bz) + 4px)}.hero .btn{display:flex;width:max-content;margin:0 auto}@property --pk{syntax: "<number>"; inherits: false; initial-value: 0;}:root{--pk: 0;--pbx: -19vw;--pby: 1vh;--pbs: .5}@property --iris{syntax: "<length-percentage>"; inherits: false; initial-value: 0px;}@media(max-width:820px){:root{--pbx: 0vw;--pby: -22vh;--pbs: .58}.btn.btn-play{height:58px;padding:0 34px}button.btn.btn-play{font-size:18px}.btn{--bz: 4px;--ch: 30px;height:40px;padding:0 5px 0 15px;gap:10px;font-size:10px}.btn__sep{margin:0 7px}.btn-big{--bz: 5px;--ch: 42px;height:54px;padding:0 6px 0 22px;gap:14px;font-size:12px}}@media(prefers-reduced-motion:reduce){.btn{transition:none}}

html,body{margin:0;min-height:100%;width:100%}body{min-height:100vh;display:grid;place-items:center}.stage{padding:36px;display:grid;place-items:center}button:focus-visible{outline:2px solid currentColor;outline-offset:5px}</style></head><body><main class="stage"><a class="btn" href="#">Reserve <span class="btn-price">$149</span></a></main><script>// The key button. Every .btn in the page is rebuilt as four layers:
// a dark bezel, a bright cap that sits in it, a label whose letters roll over on hover,
// and a round chip on the end with an arrow in a ring that lights up.
// The idea and the structure come from the MatrixPay forward button (by Aksonvady Phomhome, from ThreeUI),
// redrawn here in this page's colours and type.
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches, touch = matchMedia('(pointer: coarse)').matches;
const ARROW = '<svg viewBox="0 0 16 16"><path d="M2.5 8h10.6M9.2 3.9 13.3 8l-4.1 4.1"/></svg>';
// two half rings round the chip. On hover the light runs along both, from the back to the arrow's tip.
const HALF = ['M5.75 20A14.25 14.25 0 0 1 34.25 20', 'M5.75 20A14.25 14.25 0 0 0 34.25 20'];
const CHIP = `<svg class="btn__trace" viewBox="0 0 40 40"><path class="dim" d="${HALF.join('')}"/>${HALF.map((d) => `<path class="lit" pathLength="1" d="${d}"/>`).join('')}<circle class="pad" cx="20" cy="20" r="8.5"/></svg>`;
const letters = (text, from = 0) => [...text].map((c, i) => { const k = c === ' ' ? ' ' : c; return `<span class="btn__ch" style="--i:${from + i}" data-c="${k}">${k}</span>`; }).join('');

for (const b of document.querySelectorAll('.btn')) {
  const price = b.querySelector('.btn-price')?.textContent.trim() || '';
  const label = [...b.childNodes].filter((n) => n.nodeType === 3).map((n) => n.textContent).join(' ').replace(/\s+/g, ' ').trim();
  b.setAttribute('aria-label', price ? `${label}, ${price}` : label);
  b.classList.add('btn--key');
  b.innerHTML = '<span class="btn__bezel" aria-hidden="true"></span><span class="btn__cap" aria-hidden="true"></span>'
    + `<span class="btn__label" aria-hidden="true">${letters(label)}${price ? `<span class="btn__sep"></span>${letters(price, label.length)}` : ''}</span>`
    + (b.classList.contains('btn-play') ? '' : `<span class="btn__chip" aria-hidden="true">${CHIP}<span class="btn__arrow">${ARROW}</span></span>`);      // the play button is all cap, no arrow
  const cap = b.querySelector('.btn__cap');
  // a bloom of light where you press
  b.addEventListener('pointerdown', (e) => {
    const r = cap.getBoundingClientRect(), i = document.createElement('i');
    i.className = 'btn__ripple'; i.style.left = (e.clientX - r.left) + 'px'; i.style.top = (e.clientY - r.top) + 'px';
    cap.append(i); setTimeout(() => i.remove(), 900);
  });
  // it leans a little toward the pointer, and a soft light follows it across the cap
  b.addEventListener('pointermove', (e) => {
    if (reduced || touch) return;
    const r = b.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    b.style.transition = 'transform 0.15s linear';
    b.style.transform = `translate3d(${Math.max(-6, Math.min(6, dx * 0.2)).toFixed(2)}px, ${Math.max(-4, Math.min(4, dy * 0.3)).toFixed(2)}px, 0)`;
    b.style.setProperty('--mx', (e.clientX - r.left) + 'px'); b.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
  b.addEventListener('pointerleave', () => { b.style.transition = 'transform 0.7s cubic-bezier(0.22, 1, 0.36, 1)'; b.style.transform = ''; });
}

// The quiet links on top roll their letters the same way on hover. The link keeps its plain name for screen readers.
for (const a of document.querySelectorAll('nav.tabs a')) {
  const name = a.textContent.trim();
  a.setAttribute('aria-label', name);
  a.innerHTML = `<span class="tab__roll" aria-hidden="true">${[...name].map((c, i) => `<span class="tab__ch" style="--i:${i}" data-c="${c}">${c}</span>`).join('')}</span>`;
}

document.querySelector('a').addEventListener('click',e=>{e.preventDefault();window.dispatchEvent(new CustomEvent('threeui:activate'))})</script></body></html>

rack\" aria-hidden=\"true\">\u003cspan id=\"boot-progress\">\u003c/span>\u003c/div>\n \u003c/div>\n \u003cbutton class=\"boot-skip\" id=\"boot-skip\" hidden>Enter preview\u003c/button>\n\u003c/div>\n\u003cscript id=\"boot-controller\">\n(()=>{\n const root=document.documentElement,loader=document.getElementById('boot-loader'),orbits=document.getElementById('boot-orbits'),status=document.getElementById('boot-status'),bar=document.getElementById('boot-progress'),skip=document.getElementById('boot-skip');\n const reduced=matchMedia('(prefers-reduced-motion: reduce)');let finished=false,settleTimer,resolveReveal;\n const revealed=new Promise(resolve=>resolveReveal=resolve);\n for(let i=0;i\u003c28;i++){\n  const p=document.createElement('span');p.className='boot-particle';p.append(document.createElement('i'));\n  p.style.cssText=`--angle:${i*137.508}deg;--radius:${40+(i*19%48)}px;--size:${i%7===0?2.5:1.2+(i%3)*.35}px;--alpha:${.22+(i%6)*.11};--duration:${16+i%9*2}s;--delay:${-i*1.7}s;--particle-color:${i%5===0?'#c6b693':'#9ccfc9'}`;orbits.append(p);\n }\n const visibility=()=>loader.classList.toggle('is-paused',document.hidden);\n const cleanup=()=>{clearTimeout(slowTimer);clearTimeout(settleTimer);document.removeEventListener('visibilitychange',visibility);removeEventListener('error',fail);removeEventListener('pagehide',leave);loader.remove();};\n function finish(reason='ready'){\n  if(finished)return;finished=true;clearTimeout(slowTimer);loader.dataset.result=reason;\n  bar.style.setProperty('--load','1');status.textContent=reason==='ready'?'Your legend awaits':'Enter the world';\n  loader.classList.add('is-leaving');root.classList.remove('booting');resolveReveal();\n  settleTimer=setTimeout(cleanup,reduced.matches?0:700);\n }\n function fail(){finish('fallback');}\n function leave(event){if(!event.persisted)cleanup();}\n const slowTimer=setTimeout(()=>{status.textContent='Still gathering the deck';skip.hidden=false;},12000);\n skip.onclick=()=>finish('preview');visibility();document.addEventListener('visibilitychange',visibility);addEventListener('error',fail);addEventListener('pagehide',leave);\n window.HUNTBoot={revealed,finish,fail,progress(loaded,total){if(finished)return;bar.style.setProperty('--load',String(Math.min(.94,loaded/total*.94)));if(loaded===total)status.textContent='Preparing the light';}};\n})();\n\u003c/script>\n\u003ca class=\"skip\" href=\"#collection\">Skip to the cards\u003c/a>\n\u003cdiv class=\"backdrop\" aria-hidden=\"true\">\u003c/div>\u003ccanvas id=\"landscape\" aria-hidden=\"true\">\u003c/canvas>\u003ccanvas id=\"world\" aria-hidden=\"true\">\u003c/canvas>\u003cdiv class=\"vignette\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"progress\" aria-hidden=\"true\">\u003c/div>\n\u003cheader>\u003ca href=\"#top\" class=\"brand\" aria-label=\"The Hunt home\">\u003cimg data-art=\"hunt-crest\" alt=\"\" width=\"65\" height=\"65\">\u003cspan>THE HUNT\u003c/span>\u003c/a>\u003cnav id=\"navigation\" aria-label=\"Main navigation\">\u003ca href=\"#collection\">Cards\u003c/a>\u003ca href=\"#factions\">Factions\u003c/a>\u003ca href=\"#how-to-play\">How to Play\u003c/a>\u003ca href=\"./card-game-prompts.html\">Prompts\u003c/a>\u003c/nav>\u003cbutton class=\"angle-button outline nav-join\" data-join>Join the Hunt\u003c/button>\u003cbutton class=\"menu-toggle\" aria-label=\"Open navigation\" aria-expanded=\"false\" aria-controls=\"navigation\">☰\u003c/button>\u003c/header>\n\u003cdiv id=\"card-targets\" aria-label=\"Featured cards\">\u003c/div>\u003cdiv class=\"card-hint\">HOVER TO REVEAL · CLICK TO INSPECT\u003c/div>\n\u003caside class=\"atmosphere\" aria-label=\"World atmosphere\">\n \u003cbutton class=\"atmosphere-toggle\" id=\"atmosphere-toggle\" aria-expanded=\"false\" aria-controls=\"atmosphere-panel\">\u003cspan aria-hidden=\"true\">✧\u003c/span> Atmosphere \u003cspan id=\"atmosphere-current\">Frostfall\u003c/span>\u003c/button>\n \u003cdiv class=\"atmosphere-panel\" id=\"atmosphere-panel\" hidden>\n  \u003cdiv class=\"atmosphere-heading\">\u003ch2>Set the atmosphere\u003c/h2>\u003cbutton class=\"atmosphere-close\" id=\"atmosphere-close\" aria-label=\"Close atmosphere\">×\u003c/button>\u003c/div>\n  \u003cdiv class=\"atmosphere-presets\" role=\"group\" aria-label=\"Background choices\">\n   \u003cbutton class=\"atmosphere-preset\" data-weather=\"frostfall\" aria-pressed=\"true\">\u003ci aria-hidden=\"true\">❄\u003c/i>\u003cspan>\u003cstrong>Frostfall\u003c/strong>\u003csmall>Silver clouds · drifting snow · icy rays\u003c/small>\u003c/span>\u003c/button>\n   \u003cbutton class=\"atmosphere-preset\" data-weather=\"moonlit\" aria-pressed=\"false\">\u003ci aria-hidden=\"true\">☾\u003c/i>\u003cspan>\u003cstrong>Moonlit Veil\u003c/strong>\u003csmall>Violet mist · moonbeams · floating motes\u003c/small>\u003c/span>\u003c/button>\n   \u003cbutton class=\"atmosphere-preset\" data-weather=\"emberfall\" aria-pressed=\"false\">\u003ci aria-hidden=\"true\">♨\u003c/i>\u003cspan>\u003cstrong>Emberfall\u003c/strong>\u003csmall>Rolling smoke · amber light · embers\u003c/small>\u003c/span>\u003c/button>\n  \u003c/div>\n  \u003cfieldset class=\"atmosphere-layers\">\u003clegend>LAYERS\u003c/legend>\n   \u003clabel>\u003cinput type=\"checkbox\" data-weather-layer=\"clouds\" checked>Clouds\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" data-weather-layer=\"smoke\" checked>Smoke\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" data-weather-layer=\"rays\" checked>Light rays\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" data-weather-layer=\"snow\" checked>Falling snow\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" data-weather-layer=\"particles\" checked>Particles\u003c/label>\n  \u003c/fieldset>\u003cp class=\"atmosphere-note\">Choose a world, then make it your own.\u003c/p>\n \u003c/div>\n\u003c/aside>\n\u003cmain id=\"top\">\n\u003csection class=\"hero\" aria-labelledby=\"hero-title\">\u003cdiv class=\"hero-copy\">\u003cdiv class=\"rune-divider\" aria-hidden=\"true\">\u003cimg data-art=\"hunt-crest\" alt=\"\">\u003c/div>\u003ch1 id=\"hero-title\">\u003cspan>Build Your\u003c/span>\u003cspan>Legend\u003c/span>\u003c/h1>\u003cp>Command tactical factions, battle fearsome monsters,\u003cbr>and outplay rival champions in a living, evolving world.\u003c/p>\u003cdiv class=\"hero-actions\">\u003cbutton class=\"angle-button\" data-join>\u003cimg class=\"button-sigil\" data-art=\"hunt-crest\" alt=\"\">Enter the Hunt\u003c/button>\u003ca class=\"text-link\" href=\"#collection\">Explore Cards \u003cspan class=\"arrow\" aria-hidden=\"true\">›\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"fallback-cards\" aria-label=\"Featured card artwork\">\u003cimg data-art=\"frost-mage\" alt=\"Frost Mage\">\u003cimg data-art=\"silver-hunter\" alt=\"Silver Hunter\">\u003cimg data-art=\"forest-behemoth\" alt=\"Forest Behemoth\">\u003cimg data-art=\"war-captain\" alt=\"War Captain\">\u003c/div>\u003cdiv class=\"hero-bottom\">\u003cdiv class=\"faction-strip\">\u003ca class=\"faction-link\" href=\"#factions\" data-faction-link=\"0\">\u003cimg class=\"faction-icon\" data-art=\"faction-northern\" alt=\"\" width=\"52\" height=\"58\">Northern Realms\u003c/a>\u003ca class=\"faction-link\" href=\"#factions\" data-faction-link=\"1\">\u003cimg class=\"faction-icon wild\" data-art=\"faction-wild\" alt=\"\" width=\"52\" height=\"58\">Wild Courts\u003c/a>\u003ca class=\"faction-link\" href=\"#factions\" data-faction-link=\"2\">\u003cimg class=\"faction-icon ashen\" data-art=\"faction-ashen\" alt=\"\" width=\"52\" height=\"58\">Ashen Legion\u003c/a>\u003c/div>\u003cp class=\"tagline\">Forge your deck. Change the tide.\u003c/p>\u003cdiv class=\"rune-divider\" aria-hidden=\"true\">\u003cspan>◇\u003c/span>\u003c/div>\u003c/div>\u003ca class=\"scroll-cue\" href=\"#collection\">SCROLL TO DISCOVER\u003c/a>\u003c/section>\n\u003csection class=\"collection\" id=\"collection\" aria-labelledby=\"collection-title\">\u003cdiv class=\"collection-sticky\">\u003cspan class=\"chapter-number\">I / THE COLLECTION\u003c/span>\u003cdiv class=\"section-copy\">\u003cdiv class=\"eyebrow\">Every card tells a story\u003c/div>\u003ch2 id=\"collection-title\">Not just collected.\u003cbr> \u003cem>Wielded.\u003c/em>\u003c/h2>\u003cp>Steel, spell, and ancient power. Discover the extraordinary characters that will turn your next battle into legend.\u003c/p>\u003cdiv class=\"collection-caption\" aria-live=\"polite\">\u003cdiv class=\"card-meta\">\u003ch3 id=\"active-name\">Silver Hunter\u003c/h3>\u003cspan class=\"rarity\" id=\"active-rarity\">LEGENDARY\u003c/span>\u003c/div>\u003cp class=\"card-type\" id=\"active-type\">Northern Realms · Human / Champion\u003c/p>\u003cdiv class=\"card-controls\">\u003cbutton class=\"round-button\" id=\"previous-card\" aria-label=\"Previous card\">←\u003c/button>\u003cspan class=\"collection-count\" id=\"collection-count\">01 / 05\u003c/span>\u003cbutton class=\"round-button\" id=\"next-card\" aria-label=\"Next card\">→\u003c/button>\u003cbutton class=\"inspect-link\" id=\"inspect-active\">Inspect card ↗\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"collection-footnote\">SELECT A CARD TO FOCUS · CLICK THE FOCUSED CARD TO INSPECT\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"factions\" id=\"factions\" aria-labelledby=\"factions-title\">\u003cdiv class=\"section-head reveal\">\u003cdiv class=\"eyebrow\">Choose your allegiance\u003c/div>\u003ch2 id=\"factions-title\">One world.\u003cbr>\u003cem>Three ways to rule.\u003c/em>\u003c/h2>\u003cp class=\"section-subtitle\">Every faction has its own nature. Find yours.\u003c/p>\u003c/div>\u003cdiv class=\"faction-tabs\" role=\"tablist\" aria-label=\"Factions\">\u003cbutton class=\"faction-tab\" id=\"faction-tab-0\" role=\"tab\" aria-selected=\"true\" aria-controls=\"faction-panel\" data-faction=\"0\">\u003cimg class=\"faction-icon\" data-art=\"faction-northern\" alt=\"\" width=\"32\" height=\"36\">Northern Realms\u003c/button>\u003cbutton class=\"faction-tab\" id=\"faction-tab-1\" role=\"tab\" aria-selected=\"false\" tabindex=\"-1\" aria-controls=\"faction-panel\" data-faction=\"1\">\u003cimg class=\"faction-icon\" data-art=\"faction-wild\" alt=\"\" width=\"32\" height=\"36\">Wild Courts\u003c/button>\u003cbutton class=\"faction-tab\" id=\"faction-tab-2\" role=\"tab\" aria-selected=\"false\" tabindex=\"-1\" aria-controls=\"faction-panel\" data-faction=\"2\">\u003cimg class=\"faction-icon\" data-art=\"faction-ashen\" alt=\"\" width=\"32\" height=\"36\">Ashen Legion\u003c/button>\u003c/div>\u003cdiv class=\"faction-panel\" id=\"faction-panel\" role=\"tabpanel\" aria-labelledby=\"faction-tab-0\" tabindex=\"0\">\u003cdiv class=\"faction-art card-stage\" id=\"faction-stage\" aria-label=\"Faction champion cards\">\u003cimg class=\"stage-fallback\" id=\"faction-image\" data-art=\"silver-hunter\" alt=\"Silver Hunter, champion of the Northern Realms\" width=\"300\" height=\"450\" loading=\"lazy\">\u003cspan class=\"stage-hint\">HOVER TO ORBIT · CLICK TO INSPECT\u003c/span>\u003c/div>\u003cdiv class=\"faction-story\">\u003cdiv class=\"eyebrow\" id=\"faction-motto\">Resolve is your greatest weapon\u003c/div>\u003ch3 id=\"faction-name\">Northern Realms\u003c/h3>\u003cp id=\"faction-description\">Where others see a broken kingdom, you see an army waiting to rise. Rally stalwart champions, unite your ranks, and turn discipline into devastating strength.\u003c/p>\u003cdiv class=\"faction-ability\">\u003cstrong id=\"faction-ability-name\">FACTION ABILITY · UNITED WE STAND\u003c/strong>\u003cp id=\"faction-ability-description\">Allied units grow stronger together. Build your formation and let every card lift the next.\u003c/p>\u003c/div>\u003cbutton class=\"angle-button outline\" id=\"choose-faction\">Choose the Realms \u003cspan aria-hidden=\"true\">›\u003c/span>\u003c/button>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"how\" id=\"how-to-play\" aria-labelledby=\"how-title\">\u003cdiv class=\"section-head reveal\">\u003cdiv class=\"eyebrow\">A game of wit, not chance\u003c/div>\u003ch2 id=\"how-title\">Your hand.\u003cbr>\u003cem>Your move.\u003c/em>\u003c/h2>\u003cp class=\"section-subtitle\">Easy to enter. A lifetime to master.\u003c/p>\u003c/div>\u003cdiv class=\"card-stage tactics-stage\" id=\"tactics-stage\" aria-label=\"Your opening hand\">\u003cdiv class=\"stage-fallback fallback-hand\">\u003cimg data-art=\"silver-hunter\" alt=\"Silver Hunter\">\u003cimg data-art=\"frost-mage\" alt=\"Frost Mage\">\u003cimg data-art=\"ancient-relic\" alt=\"Ancient Relic\">\u003c/div>\u003cspan class=\"stage-hint\">THREE CARDS. A THOUSAND POSSIBILITIES.\u003c/span>\u003c/div>\u003cdiv class=\"steps\">\u003carticle class=\"step reveal\">\u003cspan class=\"step-number\">01 — ASSEMBLE\u003c/span>\u003ch3>Forge your deck\u003c/h3>\u003cp>Choose a faction. Gather champions, creatures, and artifacts. Build a hand that fights the way you think.\u003c/p>\u003c/article>\u003carticle class=\"step reveal\">\u003cspan class=\"step-number\">02 — OUTWIT\u003c/span>\u003ch3>Read your rival\u003c/h3>\u003cp>Play your cards across the battlefield. Combine their abilities, bait your opponent, and know when to hold back.\u003c/p>\u003c/article>\u003carticle class=\"step reveal\">\u003cspan class=\"step-number\">03 — PREVAIL\u003c/span>\u003ch3>Change the tide\u003c/h3>\u003cp>Win two of three rounds. Every card is a commitment. The greatest victories begin with the cleverest sacrifices.\u003c/p>\u003c/article>\u003c/div>\u003cdetails class=\"rules\">\u003csummary>What makes a winning hand?\u003c/summary>\u003cp>Power wins a round, but timing wins the match. Your cards are shared across all three rounds. Play one card each turn, or pass to preserve your hand. When both players pass, the higher total power takes the round. Champions provide dependable strength, spellcasters disrupt your opponent, and artifacts turn well-planned combinations into decisive advantages.\u003c/p>\u003c/details>\u003c/section>\n\u003csection class=\"closing\" id=\"join-the-hunt\" aria-label=\"Join the Hunt\">\u003cdiv class=\"card-stage footer-stage\" id=\"footer-stage\" aria-label=\"The final deck\">\u003cdiv class=\"stage-fallback fallback-hand\">\u003cimg data-art=\"frost-mage\" alt=\"Frost Mage\">\u003cimg data-art=\"silver-hunter\" alt=\"Silver Hunter\">\u003cimg data-art=\"forest-behemoth\" alt=\"Forest Behemoth\">\u003c/div>\u003c/div>\u003cdiv class=\"closing-copy\">\u003cimg class=\"crest\" data-art=\"hunt-crest\" alt=\"\" width=\"100\" height=\"100\">\u003cdiv class=\"rune-divider\" aria-hidden=\"true\">\u003cspan>◇\u003c/span>\u003c/div>\u003ch2>The next legend\u003cbr>could be yours.\u003c/h2>\u003cp>Your faction awaits. Your story is unwritten.\u003c/p>\u003cbutton class=\"angle-button\" data-join>Join the Hunt \u003cspan class=\"arrow\" aria-hidden=\"true\">›\u003c/span>\u003c/button>\u003c/div>\u003c/section>\n\u003c/main>\n\u003cfooter>\u003cspan>THE HUNT · AN INDEPENDENT FANTASY CONCEPT\u003c/span>\u003cdiv class=\"footer-links\">\u003cbutton class=\"sound-toggle\" id=\"sound-toggle\" aria-pressed=\"false\" aria-label=\"Enable ambient sound\">\u003cspan class=\"sound-bars\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan id=\"sound-label\">SOUND OFF\u003c/span>\u003c/button>\u003ca href=\"#top\">BACK TO THE TOP ↑\u003c/a>\u003c/div>\u003c/footer>\n\u003cdialog id=\"inspect-dialog\" aria-labelledby=\"inspect-title\" aria-describedby=\"inspect-tip\">\n \u003cdiv class=\"inspect-scene\">\u003ccanvas id=\"inspect-canvas\" tabindex=\"0\" aria-label=\"Interactive card. Drag to tilt, or use the arrow keys. Home resets the view.\">\u003c/canvas>\u003c/div>\n \u003cdiv class=\"inspect-topbar\">\u003cspan>THE CARD ARCHIVE \u003cspan class=\"inspect-counter\" id=\"inspect-counter\">01 / 05\u003c/span>\u003c/span>\u003cbutton class=\"close-dialog\" aria-label=\"Close card inspector\" data-close>×\u003c/button>\ se:7,color:0x7abfdc,description:'A blade of silver. A will of iron. He walks the line between the world of men and the monsters beyond.',ability:'MONSTER SLAYER',effect:'Gains 3 power when played against a Beast. A precise answer to the wildest threats.'},\n{key:'frost-mage',name:'Frost Mage',faction:'Northern Realms',type:'Human / Spellcaster',rarity:'Epic',power:3,defense:5,color:0x9e87e5,description:'Winter does not ask permission. Neither does she. One whispered word can still an entire battlefield.',ability:'WINTER’S GRASP',effect:'Reduces the strongest opposing unit by 2 power. Even the mightiest army can be brought to a standstill.'},\n{key:'forest-behemoth',name:'Forest Behemoth',faction:'Wild Courts',type:'Beast',rarity:'Legendary',power:6,defense:8,color:0x6dc5a1,description:'Older than the kingdoms. Taller than their walls. The forest remembers every axe, and its patience has ended.',ability:'ANCIENT ROOTS',effect:'Gains 1 power for every allied Wild Courts unit. Let your roots spread before you strike.'},\n{key:'war-captain',name:'War Captain',faction:'Ashen Legion',type:'Human / Warrior',rarity:'Epic',power:5,defense:7,color:0xdf826b,description:'He has watched a hundred banners burn. His own has never fallen. Follow him into the embers.',ability:'RALLY THE LEGION',effect:'The next Warrior you play gains 2 power. A single order can turn a retreat into a reckoning.'},\n{key:'ancient-relic',name:'Ancient Relic',faction:'Neutral',type:'Artifact',rarity:'Legendary',power:0,defense:4,color:0xd7b16f,description:'No scholar knows who forged it. No king has held it for long. Power always has a price.',ability:'ECHOES OF POWER',effect:'Repeat the last allied unit’s ability. A forgotten moment becomes your greatest advantage.'},\n{\"key\":\"thorn-oracle\",\"name\":\"Thorn Oracle\",\"faction\":\"Wild Courts\",\"type\":\"Fae / Seer\",\"rarity\":\"Legendary\",\"power\":3,\"defense\":6,\"color\":7912347,\"description\":\"She reads tomorrow in the rings of ancient trees. Every thorn is a warning. Every blossom, a promise.\",\"ability\":\"VERDANT FORESIGHT\",\"effect\":\"The next allied Beast gains 2 power. Prepare the forest, then let its oldest spirits answer.\"},\n{\"key\":\"moonfang-stag\",\"name\":\"Moonfang Stag\",\"faction\":\"Wild Courts\",\"type\":\"Beast / Spirit\",\"rarity\":\"Legendary\",\"power\":5,\"defense\":7,\"color\":9884878,\"description\":\"At moonrise, the forest remembers its first guardian. Silver antlers part the mist where no mortal path remains.\",\"ability\":\"MOONLIT HERD\",\"effect\":\"Gains 1 power for each other allied Wild Courts unit, up to 3. The wilderness never walks alone.\"},\n{\"key\":\"briar-warden\",\"name\":\"Briar Warden\",\"faction\":\"Wild Courts\",\"type\":\"Fae / Guardian\",\"rarity\":\"Epic\",\"power\":4,\"defense\":8,\"color\":9746553,\"description\":\"Bark is his armor. The old oaths are his shield. No blade reaches the sacred grove while he still stands.\",\"ability\":\"THORNBOUND GUARD\",\"effect\":\"The next allied Wild Courts unit gains 2 defense. A living wall shelters the heart of your formation.\"},\n{\"key\":\"ember-phoenix\",\"name\":\"Ember Phoenix\",\"faction\":\"Ashen Legion\",\"type\":\"Beast / Mythic\",\"rarity\":\"Mythic\",\"power\":7,\"defense\":5,\"color\":15702375,\"description\":\"From the last ember of a fallen kingdom, a new dawn takes wing. Its song is the sound of the fire returning.\",\"ability\":\"LAST LIGHT\",\"effect\":\"Gains 2 power if you have fewer units than your rival. Even a fading flame can set the sky alight.\"},\n{\"key\":\"astral-knight\",\"name\":\"Astral Knight\",\"faction\":\"Northern Realms\",\"type\":\"Human / Champion\",\"rarity\":\"Legendary\",\"power\":6,\"defense\":7,\"color\":9419748,\"description\":\"Her oath was sworn beneath a sky without a sunrise. Now the constellations ride with her into the dark.\",\"ability\":\"STARBOUND OATH\",\"effect\":\"The next allied unit with 4 or less base power gains 2 power. Greatness gives the smallest light room to shine.\"},\n{\"key\":\"veil-weaver\",\"name\":\"Veil Weaver\",\"faction\":\"Neutral\",\"type\":\"Fae / Spellcaster\",\"rarity\":\"Epic\",\"power\":4,\"defense\":5,\"color\":12032222,\"description\":\"Behind the veil, every fate is a thread. With a single gesture, she unravels the future her rival thought was certain.\",\"ability\":\"UNRAVEL\",\"effect\":\"Reduces the next opposing unit’s power by 2. A patient enchantment turns their perfect plan against them.\"}\n];\nconst CARD_STRATEGIES={\n 'silver-hunter':'Hold him until a Beast enters the opposing row. His bonus turns a careful response into a decisive counter.',\n 'frost-mage':'Wait for your rival to commit their strongest unit, then let Winter’s Grasp take away its advantage.',\n 'forest-behemoth':'Build your Wild Courts presence first. Every allied unit gives this ancient creature another reason to stand tall.',\n 'war-captain':'Play him just before another Warrior. His rally prepares the next strike while keeping pressure on the board.',\n 'ancient-relic':'Save the relic for a powerful allied ability. Timing the echo matters more than playing it early.',\n 'thorn-oracle':'Play her before your larger forest creatures. Her foresight helps prepare a stronger following turn.',\n 'moonfang-stag':'Use the stag to reinforce an established Wild Courts row. Its spirit rewards a patient opening.',\n 'briar-warden':'Place the warden beside your most valuable forest unit. Let his guard hold while your allies grow.',\n 'ember-phoenix':'Commit the phoenix when the round needs a final burst of power. Keep a second threat ready for the next exchange.',\n 'astral-knight':'Lead a measured attack with the knight, then follow with a smaller ally to strengthen your formation.',\n 'veil-weaver':'Wait until your opponent reveals their plan. Her enchantment is strongest when it interrupts a valuable unit.'\n};\nconst FACTIONS=[\n{name:'Northern Realms',motto:'Resolve is your greatest weapon',description:'Where ot

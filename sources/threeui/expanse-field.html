<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HORIZON/0 Starflight Hero — r3xdec 3D</title>
  <script type="importmap">
  { "imports": { "three": "/vendor/three/three.module.js" } }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050911; color: #eef6ff; font-family: ui-sans-serif, system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .hud {
      position: fixed; inset: 0; padding: 28px 36px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; z-index: 10;
    }
    .top { display: flex; justify-content: space-between; font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.2em; color: #67e8f9; }
    .center { text-align: center; }
    .center h1 { font-size: clamp(42px, 6.5vw, 84px); font-weight: 800; letter-spacing: -0.04em; text-shadow: 0 0 42px rgba(56,189,248,0.55); }
    .center p { margin-top: 8px; font-size: 13px; letter-spacing: 0.26em; text-transform: uppercase; color: #94a3b8; }
    .bottom { display: flex; justify-content: center; pointer-events: auto; }
    .boost {
      padding: 12px 28px; border-radius: 999px; border: 1px solid rgba(56,189,248,0.55);
      background: rgba(14, 165, 233, 0.22); backdrop-filter: blur(12px); color: #e0f2fe;
      font-family: ui-monospace, monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;
    }
    .boost.on { background: rgba(244, 63, 94, 0.35); border-color: #fb7185; color: #fff; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="top"><span>HORIZON/0 · VECTOR DRIVE</span><span id="spd">VEL 420 KT</span></div>
    <div class="center"><h1>HORIZON/0</h1><p>Beyond the visual horizon</p></div>
    <div class="bottom"><button class="boost" id="btn">Engage Afterburner</button></div>
  </div>
  <script type="module">
    import * as THREE from 'three';

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x050911, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050911, 0.032);
    const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 140);
    camera.position.set(0, 3.0, 12);

    // Procedural wireframe canyon plane
    const geo = new THREE.PlaneGeometry(70, 90, 64, 64);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position;
    const baseHeights = new Float32Array(pos.count);
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i);
      const canyon = Math.pow(Math.abs(x) * 0.14, 1.8) * 3.8;
      const ridge = (Math.sin(x * 0.35) * Math.cos(z * 0.22) + Math.sin(x * 0.7 - z * 0.35) * 0.5) * 1.4;
      baseHeights[i] = canyon + ridge;
      pos.setY(i, baseHeights[i]);
    }
    const terrain = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x22d3ee, wireframe: true, transparent: true, opacity: 0.45 }));
    terrain.position.z = -20;
    scene.add(terrain);

    // Starfield
    const sArr = new Float32Array(1200 * 3);
    for (let i = 0; i < 1200; i++) {
      sArr[i*3] = (Math.random() - 0.5) * 80;
      sArr[i*3+1] = Math.random() * 28 + 1;
      sArr[i*3+2] = -Math.random() * 90;
    }
    const sGeo = new THREE.BufferGeometry();
    sGeo.setAttribute('position', new THREE.BufferAttribute(sArr, 3));
    const stars = new THREE.Points(sGeo, new THREE.PointsMaterial({ color: 0xe0f2fe, size: 0.14 }));
    scene.add(stars);

    let boost = 0, targetBoost = 0, steerX = 0;
    const btn = document.getElementById('btn');
    const spdEl = document.getElementById('spd');
    btn.addEventListener('click', () => { targetBoost = targetBoost ? 0 : 1; btn.classList.toggle('on', !!targetBoost); });
    window.addEventListener('pointermove', e => { steerX = ((e.clientX / window.innerWidth) - 0.5) * 5.0; });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let scroll = 0;
    function animate(ms) {
      boost += (targetBoost - boost) * 0.06;
      const speed = 0.24 + boost * 0.52;
      scroll += speed;
      spdEl.textContent = 'VEL ' + Math.round(420 + boost * 880) + ' KT';

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), z = pos.getZ(i) - scroll;
        const canyon = Math.pow(Math.abs(x) * 0.14, 1.8) * 3.8;
        const ridge = (Math.sin(x * 0.35) * Math.cos(z * 0.22) + Math.sin(x * 0.7 - z * 0.35) * 0.5) * 1.4;
        pos.setY(i, canyon + ridge);
      }
      pos.needsUpdate = true;

      for (let i = 0; i < 1200; i++) {
        sArr[i*3+2] += speed * 1.8;
        if (sArr[i*3+2] > 12) sArr[i*3+2] = -90;
      }
      sGeo.attributes.position.needsUpdate = true;

      camera.position.x += (steerX - camera.position.x) * 0.06;
      camera.rotation.z = -camera.position.x * 0.04;
      camera.lookAt(camera.position.x * 0.4, 2.2, -30);
      terrain.material.color.setHSL(0.53 - boost * 0.48, 0.9, 0.55);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>

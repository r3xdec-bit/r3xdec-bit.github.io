<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MatrixPay — Moving Forward Button</title><link rel="stylesheet" href="/landing-pages/week-2026-11-10/bc512a190aa92952159501ddbe17c708.css"><style>
:root{

*{box-sizing:border-box}
html{background:var(--bk);overflow-anchor:none;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bk);color:var(--w);font-family:var(--f-u);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}

.btn{position:relative;display:inline-flex;align-items:center;gap:12px;height:52px;padding:0 26px;border-radius:999px;font-family:var(--f-d);font-variation-settings:'wdth' 100;font-size:15px;font-weight:600;letter-spacing:.005em;white-space:nowrap;isolation:isolate;transition:color .4s var(--ease)}

  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 0 rgba(0,74,48,.5),inset 0 0 0 1px rgba(154,255,211,.55),

.btn--text{--lc:var(--w);padding:0 2px;height:44px;border-radius:0;color:var(--lc)}
.btn--text::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:1px;background:rgba(244,248,246,.5);transform-origin:100% 50%;transition:transform .6s var(--ease),opacity .3s}
.btn--text:hover::after{transform:scaleX(0);opacity:0;transition:transform .5s var(--ease),opacity .18s}
.btn__track{position:absolute;left:0;right:0;bottom:8px;height:1px;overflow:visible;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(154,255,211,.75) 0 2px,transparent 2px 6px);background-size:12px 1px;opacity:0;transition:opacity .4s,right .5s var(--ease)}
.btn__run{position:absolute;inset:0;translate:-100% 0;opacity:0}
.btn__run i{position:absolute;right:-3px;top:-2px;width:5px;height:5px;border-radius:50%;background:#f2fff9;box-shadow:0 0 6px 1px rgba(154,255,211,.95),0 0 14px 3px rgba(0,217,150,.5)}
.btn--text:hover .btn__track{opacity:1;right:-24px;animation:btnDash .9s linear infinite;transition:opacity .4s,right .6s var(--ease) .3s}
.btn--text:hover .btn__run{translate:0 0;opacity:1;transition:translate 1s var(--ease2) .1s,opacity .2s}
@keyframes btnDash{to{background-position:12px 0}}
.btn__tip{position:absolute;right:-24px;top:50%;width:14px;height:14px;margin-top:-7px;fill:none;stroke:var(--mint);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:0;translate:-8px 0;transition:opacity .4s,translate .6s var(--ease)}

.btn--key:focus-visible{border-radius:999px;outline-offset:calc(var(--bz) + 4px)}
@media (prefers-reduced-motion:reduce){.btn__led,.btn__trace .glint{animation:none}.btn__cap::after{display:none}.btn__ch,.btn__ch::after,.btn__flood,.btn__trace .lit{transition:none}.btn--key:hover .btn__arrow{animation:none}}
.btn--chip{height:36px;padding:0 14px 0 8px;border:1px solid rgba(0,217,150,.3);background:rgba(0,217,150,.08);font-size:13px;gap:8px;color:var(--mint)}

.btn__ic{width:20px;height:20px;display:inline-block;vertical-align:middle;flex:none}

  const lit = (d, k) => d.map(p => `<path class="lit" pathLength="1" style="--k:${k}" d="${p}"/><path class="glint" pathLength="1" style="--k:${k}" d="${p}"/>`).join('');
  // the chip: three concentric circles on the key's round end (the chip r 20, the ring r 14.25, the pad r 8.5, each

    + lit([RING_T, RING_B], 0)

  const chars = s => [...s].map((c, i) => { const k = c === ' ' ? '\u00a0' : c; return `<span class="btn__ch" style="--i:${i}" data-c="${k}">${k}</span>`; }).join('');
  $$('.btn--primary, .btn--huge, .btn--ghost').forEach(b => {
    const label = b.textContent.replace(/[→\s]+$/, '').trim(), dark = b.classList.contains('btn--ghost');

      + `<span class="btn__cap" aria-hidden="true">${dark ? '<i class="btn__flood"></i>' : ''}</span>`
      + (dark ? '<i class="btn__led" aria-hidden="true"></i>' : '')
      + `<span class="btn__label" aria-hidden="true">${chars(label)}</span>`
      + (dark ? '' : `<span class="btn__chip" aria-hidden="true">${CHIP}<span class="btn__arrow">${ARROW}</span></span>`);
    b.addEventListener('pointerdown', e => {
      const cap = b.querySelector('.btn__cap'), r = cap.getBoundingClientRect(), i = document.createElement('i');
      i.className = 'btn__ripple'; i.style.left = (e.clientX - r.left) + 'px'; i.style.top = (e.clientY - r.top) + 'px';
      cap.append(i); setTimeout(() => i.remove(), 900);
    });
  });
  $$('.btn--text').forEach(b => b.insertAdjacentHTML('beforeend', '<svg class="btn__tip" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8h10.6M9.2 3.9 13.3 8l-4.1 4.1"/></svg><i class="btn__track" aria-hidden="true"><i class="btn__run"><i></i></i></i>'));
  // magnetic buttons
  $$('.magnetic').forEach(b => {

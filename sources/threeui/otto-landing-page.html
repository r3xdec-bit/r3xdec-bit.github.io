"reveal\">A very capable\u003cbr>kind of sidekick.\u003c/h2>\u003cp class=\"eyebrow\">03 / BUILT FOR THE WORK\u003cbr>YOU'D RATHER BE DOING\u003c/p>\u003c/div>\u003cdiv class=\"feature-grid\">\u003cdiv class=\"feature-scene\">\u003ch3>Small tasks.\u003cbr>Meet your match.\u003c/h3>\u003cimg crossorigin=\"anonymous\" src=\"https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/seven-pro/0c3eb2a412ec13c79d729af138d755d8d29700bc91525e1f395c07faf201cabe.webp\" width=\"1536\" height=\"1024\" loading=\"lazy\" alt=\"A sculptural AI workflow with a mint agent core, floating documents, amber glass, and a chrome ring\">\u003cspan class=\"feature-small\">A WHOLE LOT OF WORK. ONE OTTO. ↗\u003c/span>\u003c/div>\u003cdiv class=\"feature-list\">\u003ca class=\"feature-item\" href=\"#platform\" data-usecase=\"research\">\u003cspan class=\"feature-number\">01 /\u003c/span>\u003cdiv>\u003ch3>Find your next good idea.\u003c/h3>\u003cp>From a mountain of information to a point of view. Explore topics, compare options, and surface what deserves your attention.\u003c/p>\u003cspan class=\"feature-meta\">RESEARCH · SUMMARIES · USEFUL INSIGHTS\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca class=\"feature-item\" href=\"#platform\" data-usecase=\"create\">\u003cspan class=\"feature-number\">02 /\u003c/span>\u003cdiv>\u003ch3>Skip the blank page.\u003c/h3>\u003cp>Turn the thought in your head into something you can work with. Draft a brief, shape a story, or get that first version out.\u003c/p>\u003cspan class=\"feature-meta\">CONTENT · CREATIVE BRIEFS · FIRST DRAFTS\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca class=\"feature-item\" href=\"#platform\" data-usecase=\"coordinate\">\u003cspan class=\"feature-number\">03 /\u003c/span>\u003cdiv>\u003ch3>Keep the good work moving.\u003c/h3>\u003cp>Bring a little order to all the moving parts. Pull out action items, prepare updates, and give every next step a home.\u003c/p>\u003cspan class=\"feature-meta\">PLANNING · FOLLOW-UPS · DAILY MOMENTUM\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\n\u003cdiv class=\"marquee\" aria-hidden=\"true\">\u003cdiv class=\"marquee-inner\">\u003cspan>Less doing the most.\u003c/span>\u003cspan class=\"mark\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan>More doing what matters.\u003c/span>\u003cspan class=\"mark\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan>Less doing the most.\u003c/span>\u003cspan class=\"mark\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan>More doing what matters.\u003c/span>\u003cspan class=\"mark\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003c/div>\u003c/div>\n\u003csection class=\"integrations\" id=\"integrations\">\u003cdiv class=\"integration-copy\">\u003cp class=\"eyebrow\">04 / RIGHT AT HOME IN YOUR WORLD\u003c/p>\u003ch2>Your tools.\u003cbr>Better together.\u003c/h2>\u003cp>Good things happen when your work connects. Give Otto the context from the tools you already love, and keep your flow in one place.\u003c/p>\u003ca class=\"text-link\" href=\"#platform\">Explore a connected workflow \u003cspan class=\"arrow\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"integration-graphic\">\u003cdiv class=\"rings\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"network-dot\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"network-core\" aria-hidden=\"true\">\u003cspan class=\"mark\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003c/div>\u003cbutton class=\"integration-node\" data-tool=\"Slack\" aria-label=\"Explore Slack integration\" aria-pressed=\"false\">\u003csvg viewBox=\"0 0 24 24\" fill= 5-6\">\u003c/path>\u003c/svg>\u003cdiv>\u003ch3>You're always in the loop.\u003c/h3>\u003cp>Review the plan, shape the draft, approve the next step. The important decisions stay with you.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"trust-row\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" aria-hidden=\"true\">\u003crect x=\"5\" y=\"10\" width=\"14\" height=\"11\" rx=\"2\">\u003c/rect>\u003cpath d=\"M8 10V7a4 4 0 018 0v3M12 14v3\">\u003c/path>\u003c/svg>\u003cdiv>\u003ch3>Only the context you choose.\u003c/h3>\u003cp>Pick what your agent can access. Keep workspaces separate and disconnect tools whenever you need to.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"trust-row\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" aria-hidden=\"true\">\u003cpath d=\"M3 12s3-7 9-7 9 7 9 7-3 7-9 7-9-7-9-7z\">\u003c/path>\u003ccircle cx=\"12\" cy=\"12\" r=\"3\">\u003c/circle>\u003c/svg>\u003cdiv>\u003ch3>No mysterious magic.\u003c/h3>\u003cp>See the steps behind the outcome. Clear activity, useful context, and room to check the work.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"pricing wrap\" id=\"pricing\">\u003cdiv class=\"section-head\">\u003cdiv>\u003cp class=\"eyebrow\">05 / MAKE A LITTLE MORE POSSIBLE\u003c/p>\u003ch2>A little help.\u003cbr>A lot of headroom.\u003c/h2>\u003c/div>\u003cdiv class=\"billing\" role=\"group\" aria-label=\"Billing period\">\u003cbutton class=\"active\" data-billing=\"monthly\" aria-pressed=\"true\">Monthly\u003c/button>\u003cbutton data-billing=\"yearly\" aria-pressed=\"false\">Yearly \u003csmall>SAVE 20%\u003c/small>\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"price-grid\">\u003carticle class=\"price-card\">\u003cdiv class=\"price-top\">\u003ch3>The first step.\u003c/h3>\u003c/div>\u003cp>A little extra intelligence for your everyday ideas.\u003c/p>\u003cdiv class=\"price\">\u003cspan class=\"currency\">$\u003c/span>\u003cspan data-price=\"0\">0\u003c/span>\u003csmall>/ forever\u003c/small>\u003c/div>\u003cdiv class=\"bill-detail\">Room to explore. No card needed.\u003c/div>\u003cbutton class=\"btn\" data-start=\"Starter\">Start something good \u003cspan class=\"arrow\">↗\u003c/span>\u003c/button>\u003cul>\u003cli>One personal agent\u003c/li>\u003cli>50 tasks each month\u003c/li>\u003cli>Research, writing, and planning\u003c/li>\u003cli>Your own workspace\u003c/li>\u003c/ul>\u003c/article>\u003carticle class=\"price-card featured\">\u003cdiv class=\"price-top\">\u003ch3>Your daily flow.\u003c/h3>\u003cspan class=\"tag\">THE SWEET SPOT\u003c/span>\u003c/div>\u003cp>For the doers, thinkers, and beautifully ambitious.\u003c/p>\u003cdiv class=\"price\">\u003cspan class=\"currency\">$\u003c/span>\u003cspan data-price=\"24\">24\u003c/span>\u003csmall>/ month\u003c/small>\u003c/div>\u003cdiv class=\"bill-detail\" data-bill-detail=\"24\">Billed monthly. Find your rhythm.\u003c/div>\u003cbutton class=\"btn ink\" data-start=\"Flow\">Find your flow \u003cspan class=\"arrow\">↗\u003c/span>\u003c/button>\u003cul>\u003cli>Everything in The first step\u003c/li>\u003cli>1,000 tasks each month\u003c/li>\u003cli>Connected tools and workflows\u003c/li>\u003cli>Longer context, bigger ideas\u003c/li>\u003c/ul>\u003c/article>\u003carticle class=\"price-card\">\u003cdiv class=\"price-top\">\u003ch3>Better together.\u003c/h3>\u003c/div>\u003cp>A shared home for a team with a lot on its mind.\u003c/p>\u003cdiv class=\"price\">\u003cspan class=\"currency\">$\u003c/span>\u003cspan data-price=\"49\">49\u003c/span>\u003csmall>/ person / month\u003c/small>\u003c/div>\u003cdiv class=\"bill-detail\" data-bill-detail=\"49\">Billed monthly. A little help for everyone.\u003c/div>\u003cbutton class=\"btn\" data-start=\"Team\">Bring your people \u003cspan class=\"arrow\">↗\u003c/span>\u003c/button>\u003cul>\u003cli>Everything in Your daily flow\u003c/li>\u003cli>3,000 tasks per person\u003c/li>\u003cli>Shared agents and workspaces\u003c/li>\u003cli>Team permissions and activity\u003c/li>\u003c/ul>\u003c/article>\u003c/div>\u003cp class=\"pricing-note\">Explore any plan in the product preview. No account or payment is created.\u003c/p>\u003c/section>\n\u003csection class=\"faq wrap\" id=\"faq\">\u003cdiv>\u003cp class=\"eyebrow\">A FEW GOOD QUESTIONS\u003c/p>\u003ch2>Curious?\u003cbr>Good.\u003c/h2>\u003c/div>\u003cdiv class=\"faq-list\">\u003cdetails>\u003csummary>What exactly is an AI agent?\u003c/summary>\u003cp>Think of an agent as a helper that can work through a series of steps toward an outcome. You give it a goal and useful context. It makes a plan, works through the task, and brings the result back for your review.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>How is Otto different from a chatbot?\u003c/summary>\u003cp>The Otto experience is designed around getting work from thought to outcome: understanding context, planning steps, and preparing something useful. Try Research, Create, or Coordinate above to explore the flow.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Will Otto take actions without asking?\u003c/summary>\u003cp>You're in charge. The product is designed around reviewing important actions before they happen. This interactive preview runs locally and never connects to your accounts, sends messages, or changes external tools.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Can I try it before choosing a plan?\u003c/summary>\u003cp>Absolutely. Choose “Find your flow” to personalize a workspace preview, or run one of the sample workflows above. The preview needs no sign-up, API key, or payment details.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Can I use it with my team?\u003c/summary>\u003cp>The Team plan illustrates a shared workspace for agents, context, and activity. Select “Bring your people” to try that setup. Live collaboration and connected accounts would be part of a production service.\u003c/p>\u003c/details>\u003c/div>\u003c/section>\n\u003csection class=\"closing wrap\" id=\"get-started\">\u003cspan class=\"mark closing-mark\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cdiv class=\"closing-top\">\u003cdiv>\u003cp class=\"eyebrow\">YOUR NEXT CHAPTER STARTS HERE.\u003c/p>\u003ch2 class=\"reveal\">Make room\u003cbr>for brilliant.\u003c/h2>\u003c/div>\u003cdiv class=\"closing-copy\">\u003cp>More space to think. More time to create.\u003cbr>A little Otto goes a long way.\u003c/p>\u003cbutton class=\"btn\" data-start=\"Starter\">Meet your new plus one \u003cspan class=\"arrow\">↗\u003c/span>\u003c/button>\u003c/div>\u003c/div>\u003cfooter>\u003cdiv class=\"footer-top\">\u003cspan>A LITTLE INTELLIGENCE. A LOT OF POSSIBILITY.\u003c/span>\u003cdiv class=\"footer-top-links\">\u003ca href=\"#platform\">Platform\u003c/a>\u003ca href=\"#how-it-works\">How it works\u003c/a>\u003ca href=\"#pricing\">Pricing\u003c/a>\u003ca href=\"#faq\">Good questions\u003c/a>\u003c/div>\u003c/div>\u003ca href=\"#home\" class=\"footer-brand\" aria-label=\"Otto. Back to top.\">\u003cspan>otto\u003c/span>\u003cspan class=\"mark\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003c/a>\u003cdiv class=\"footer-baseline\">\u003cspan>© 2026 OTTO. MADE FOR A LITTLE MORE.\u003c/span>\u003cspan>\u003cbutton id=\"privacy-button\">About this preview\u003c/button> &nbsp; · &nbsp; \u003cbutton id=\"motion-button\" aria-pressed=\"false\">Pause motion\u003c/button> &nbsp; · &nbsp; \u003ca href=\"#home\">BACK TO TOP ↑\u003c/a>\u003c/span>\u003c/div>\u003c/footer>\u003c/section>\n\u003c/main>\u003cbutton class=\"back-top\" aria-label=\"Back to top\">↑\u003c/button>\n\u003cdialog class=\"dialog\" id=\"start-dialog\" aria-labelledby=\"dialog-title\">\u003cbutton class=\"dialog-close\" aria-label=\"Close workspace preview\">×\u003c/button>\u003cdiv id=\"setup-pane\">\u003cspan class=\"mark dialog-mark\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cp class=\"eyebrow\" id=\"selected-plan\">YOUR FIRST STEP\u003c/p>\u003ch2 id=\"dialog-title\">Hello, possibility.\u003c/h2>\u003cp>Let's give your day a little more room. Make this workspace preview yours.\u003c/p>\u003cform id=\"setup-form\">\u003clabel for=\"your-name\">WHAT SHOULD OTTO CALL YOU?\u003c/label>\u003cinput id=\"your-name\" name=\"name\" placeholder=\"Your first name\" autocomplete=\"given-name\" required=\"\" maxlength=\"45\">\u003clabel for=\"your-focus\">WHAT'S ON YOUR MIND?\u003c/label>\u003cselect id=\"your-focus\" name=\"focus\">\u003coption value=\"research\">Finding clarity through research\u003c/option>\u003coption value=\"create\">Making something new\u003c/option>\u003coption value=\"coordinate\">Keeping the work moving\u003c/option>\u003c/select>\u003cbutton class=\"btn ink\" type=\"submit\">Let's find your flow \u003cspan class=\"arrow\">↗\u003c/span>\u003c/button>\u003cp class=\"fine\">A local product preview. No account, payment, or connected tools. Your name stays in this browser.\u003c/p>\u003c/form>\u003c/div>\u003cdiv id=\"success-pane\" class=\"success-pane\" hidden=\"\">\u003cspan class=\"mark\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003ch2 id=\"welcome-title\">Room for brilliant.\u003c/h2>\u003cp>Your workspace preview is ready. Pick a starting point, run a sample workflow, and see how a little help feels.\u003c/p>\u003cbutton class=\"btn ink\" id=\"open-workspace\">Explore your workspace \u003cspan class=\"arrow\">↗\u003c/span>\u003c/button>\u003c/div>\u003c/dialog>\n\u003cdialog class=\"dialog\" id=\"about-dialog\" aria-labelledby=\"about-title\">\u003cbutton class=\"dialog-close\" aria-label=\"Close about preview\">×\u003c/button>\u003cspan class=\"mark dialog-mark\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Torus Knot — r3xdec 3D</title>
  <script type="importmap">
  { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05050a; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05050a);
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 60);
    camera.position.set(0, 0.4, 5.2);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const knot = new THREE.Mesh(
      new THREE.TorusKnotGeometry(1.18, 0.36, 220, 42, 2, 3),
      new THREE.MeshPhysicalMaterial({
        color: 0x161829,
        metalness: 0.88,
        roughness: 0.08,
        clearcoat: 1.0,
        clearcoatRoughness: 0.05,
        iridescence: 1.0,
        iridescenceIOR: 1.6,
        iridescenceThicknessRange: [180, 620],
      })
    );
    scene.add(knot);

    const p1 = new THREE.PointLight(0x22d3ee, 28, 15); scene.add(p1);
    const p2 = new THREE.PointLight(0xf472b6, 28, 15); scene.add(p2);
    const p3 = new THREE.PointLight(0x818cf8, 22, 15); scene.add(p3);

    // Floating dust halo
    const dustPos = new Float32Array(600 * 3);
    for (let i = 0; i < 600; i++) {
      const r = 2.4 + Math.random() * 3.5;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      dustPos[i * 3] = r * Math.sin(ph) * Math.cos(th);
      dustPos[i * 3 + 1] = r * Math.cos(ph);
      dustPos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xa5b4fc, size: 0.045, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending }));
    scene.add(dust);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate(ms) {
      const t = ms * 0.001;
      knot.rotation.x = t * 0.38;
      knot.rotation.y = t * 0.52;
      dust.rotation.y = -t * 0.12;
      p1.position.set(Math.cos(t * 1.1) * 3.5, Math.sin(t * 0.8) * 2.2, 2.5);
      p2.position.set(Math.sin(t * 0.9) * -3.5, Math.cos(t * 1.0) * 2.2, -1.8);
      p3.position.set(0, Math.sin(t * 1.3) * 3.0, Math.cos(t * 0.7) * 3.0);
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>

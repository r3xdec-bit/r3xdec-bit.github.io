const stories={"seed": {"category": "Garden / I", "title": "A garden within.", "paragraphs": ["Stillflora begins with a simple image: a garden held inside a clear glass form. Petals, leaves, and branching stems occupy the same space as reflections of the world outside.", "Look through the face and into the foliage. A pale blossom catches the light; a dark leaf falls back into shadow. Move a little, and the arrangement seems to change.", "This imagined atelier is a place to look slowly. Each study follows a different quality of the natural world, from the smallest vein in a leaf to the way glass holds the afternoon light."]}, "tend": {"category": "Practice / I", "title": "Grow with care.", "paragraphs": ["An arrangement starts with the space around it. Before adding another stem, pause to see what is already there: a line, a weight, a patch of light.", "Care lives in these small decisions. Turn a leaf to reveal its shape. Leave a little air between two blooms. Let the materials tell you when the piece is complete."]}, "observe": {"category": "Practice / II", "title": "Seek the small.", "paragraphs": ["At first, a blossom reads as a single shape. Closer up, it becomes a landscape of folds, fine veins, and tiny grains of pollen.", "Our studies begin at this scale. A curled edge or a broken line can give an entire composition its character. Looking closely is part of making."]}, "petal": {"category": "Field notes / III", "title": "Corolla", "paragraphs": ["A corolla is the ring of petals around a flower. In this study, pale folds open around a warm center, each one catching a slightly different amount of light.", "Some edges curl inward. Others become almost transparent. Together, those small variations give the blossom a softness that a perfect outline could never hold."]}};

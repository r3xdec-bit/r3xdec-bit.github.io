<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LED Dot-Matrix Pulse Floor — r3xdec 3D</title>
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050508; font-family: ui-sans-serif, system-ui, sans-serif; color: #e6e6ee; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
    .hint {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 8px 18px; border-radius: 999px; background: rgba(18,18,26,0.72);
      border: 1px solid rgba(185,169,255,0.28); font-size: 11px; letter-spacing: 0.18em;
      text-transform: uppercase; color: #cbbdff; font-family: ui-monospace, monospace; pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hint">Move cursor to sweep beam · Click to emit pulse ripple</div>
  <script type="module">
    import * as THREE from 'three';

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x050508, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(0, 4.4, 13.5);
    camera.lookAt(0, 0.8, -6);

    // Build perspective LED lattice (~24,000 crisp points)
    const positions = [];
    const rnds = [];
    for (let x = -22; x <= 22; x += 0.28) {
      for (let z = 12; z >= -42; z -= 0.36) {
        positions.push(x, 0, z);
        rnds.push(Math.random());
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('rnd', new THREE.Float32BufferAttribute(rnds, 1));

    const floorUniforms = {
      uTime: { value: 0 },
      uBeamX: { value: 0 },
      uPulse: { value: 0.2 },
      uPixelRatio: { value: renderer.getPixelRatio() },
      uColor: { value: new THREE.Color('#9f8cff') },
      uBoost: { value: 1.35 },
    };

    const floorMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: floorUniforms,
      vertexShader: `
        attribute float rnd;
        uniform float uTime, uBeamX, uPulse, uPixelRatio;
        varying float vA, vR, vB;
        void main() {
          vec3 p = position;
          p.y += sin(p.x * 0.45 + uTime * 0.85) * 0.08 + sin(p.z * 0.35 - uTime * 0.65) * 0.08;
          float dx = abs(p.x - uBeamX);
          float beam = exp(-dx * dx * 0.08) * 1.45 + exp(-dx * dx * 0.008) * 0.32;
          float depth = pow(clamp(1.0 - (-p.z) / 48.0, 0.05, 1.0), 1.9);
          float ripple = exp(-pow((length(vec2(p.x - uBeamX, p.z + 2.0)) - uPulse * 11.0) * 0.42, 2.0))
                       * clamp(1.0 - uPulse / 2.6, 0.0, 1.0) * 1.85;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          float ps = (1.1 + 0.7 * beam) * uPixelRatio * 26.0 / -mv.z;
          float near = clamp((p.z + 2.0) / 10.0, 0.0, 1.0);
          vB = exp(-dx * dx * 0.08);
          vA = ((0.08 + beam * 0.68) * depth * (0.75 + 0.35 * rnd) + ripple * depth) * clamp(ps * 0.4, 0.35, 1.0);
          vR = near;
          gl_PointSize = max(ps, 1.6);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        uniform float uBoost;
        varying float vA, vR, vB;
        void main() {
          vec2 c = gl_PointCoord - 0.5;
          float d = length(c);
          if (d > 0.5) discard;
          float core = smoothstep(0.28, 0.04, d);
          float halo = smoothstep(0.5, 0.1, d) * 0.25;
          vec3 col = mix(uColor, vec3(0.95, 0.92, 1.0), clamp(vB * 1.2 - 0.5, 0.0, 1.0) + clamp(vA - 0.7, 0.0, 0.4));
          float alpha = (core + halo) * clamp(vA, 0.0, 1.0);
          gl_FragColor = vec4(col * (0.45 + vA * 0.85) * uBoost, alpha);
        }
      `,
    });
    scene.add(new THREE.Points(geo, floorMat));

    // Volumetric Gaussian spotlight beam cone
    const beamCanvas = document.createElement('canvas');
    beamCanvas.width = 256; beamCanvas.height = 512;
    const bctx = beamCanvas.getContext('2d');
    const img = bctx.createImageData(256, 512);
    for (let y = 0; y < 512; y++) {
      const yn = y / 511;
      const spread = 0.42 + 1.05 * yn;
      const vFade = Math.sin(Math.min(yn * 1.15, 1.0) * Math.PI);
      for (let x = 0; x < 256; x++) {
        const r = (x / 255 - 0.5) * 2.0;
        const l = (0.85 * Math.exp(-r * r * 12.0 / spread) + 0.16 * Math.exp(-r * r * 4.5 / spread)) * vFade;
        const idx = (y * 256 + x) * 4;
        img.data[idx] = 185; img.data[idx + 1] = 169; img.data[idx + 2] = 255;
        img.data[idx + 3] = Math.min(255, Math.floor(l * 170));
      }
    }
    bctx.putImageData(img, 0, 0);
    const beamTex = new THREE.CanvasTexture(beamCanvas);
    const beamMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 18),
      new THREE.MeshBasicMaterial({ map: beamTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.85 })
    );
    beamMesh.position.set(0, 7.6, -2);
    scene.add(beamMesh);

    let targetBeamX = 0, pulseAge = 0.4;
    window.addEventListener('pointermove', (e) => {
      targetBeamX = ((e.clientX / window.innerWidth) - 0.5) * 14.0;
    });
    window.addEventListener('pointerdown', () => { pulseAge = 0.0; });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let last = performance.now();
    function animate(now) {
      const dt = Math.min((now - last) * 0.001, 0.05);
      last = now;
      floorUniforms.uTime.value += dt;
      pulseAge += dt;
      if (pulseAge > 3.2) pulseAge = 0.0;
      floorUniforms.uPulse.value = pulseAge;

      const autoSweep = Math.sin(floorUniforms.uTime.value * 0.45) * 2.2;
      floorUniforms.uBeamX.value += ((targetBeamX + autoSweep * 0.25) - floorUniforms.uBeamX.value) * 0.06;
      beamMesh.position.x = floorUniforms.uBeamX.value;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>

:root{
--ink:#05071A; --night:#0A0F2E; --indigo:#18205A; --glow:#3B4BB0;
--silver:#C8D0E6; --moon:#EEF2FB; --mist:#8790B4; --line:rgba(200,208,230,.16);
--serif:"Newsreader",Georgia,"Times New Roman",serif;
--sans:"Zen Kaku Gothic New",system-ui,-apple-system,sans-serif;
--jp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
--ease:cubic-bezier(.16,1,.3,1); --ease-io:cubic-bezier(.65,0,.35,1);
--ease-out:cubic-bezier(0.23,1,0.32,1); --ease-io2:cubic-bezier(0.77,0,0.175,1);
--gut:clamp(16px,4vw,64px);
}
*{box-sizing:border-box;margin:0;padding:0}
.btn{position:relative;display:inline-flex;align-items:center;gap:14px;height:52px;padding:0 20px 0 26px;border-radius:999px;
border:1px solid rgba(200,208,230,.38);color:var(--moon);font:500 11.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;
overflow:hidden;isolation:isolate;background:rgba(10,15,46,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
transition:border-color 220ms ease,transform 90ms var(--ease-out)}
.btn:active{transform:scale(1.026,.95);transition:border-color 220ms ease,transform 140ms var(--ease-out)}
.btn.is-pour{border-color:rgba(238,242,251,.72)}
.btn>.lbl,.btn>.arr{position:relative;z-index:1}
.btn .arr{position:relative;width:16px;height:16px;overflow:hidden;flex:none}
.btn .arr svg{position:absolute;inset:0;transition:transform 220ms var(--ease-out)}
.btn .arr svg+svg{display:none}
.btn.is-pour .arr svg{transform:translateX(3px)}
.pour-css{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.is-pour .liq{opacity:1;transform:translateY(20%);transition:transform 1200ms var(--ease-out) 120ms,rotate 420ms var(--ease-out),opacity 200ms ease}
.is-pour.is-fast .liq{transition:transform 240ms var(--ease-out),rotate 420ms var(--ease-out),opacity 160ms ease}
.is-pour .liq::before{animation-play-state:running}
@keyframes surf{to{transform:translateX(-40px)}}
.btn--sm .stream{width:24px;margin-left:-12px;--t:8.3%;--b:25%;--e:4.6%}
.is-pour .col{transform:scaleY(.24);transition:transform 1200ms var(--ease-out) 120ms}
.is-pour.is-fast .col{transition:transform 240ms var(--ease-out)}
.is-pour .cw{animation-play-state:running}
@keyframes sway{from{transform:skewX(-2deg)}to{transform:skewX(2deg)}}
.is-pour .surf-fx{opacity:1;transition:opacity 300ms ease 120ms}
.is-pour .wv::before{animation-play-state:running}
@keyframes wl{to{transform:translateX(-24px)}}
@keyframes wr{to{transform:translateX(24px)}}
.is-full .wv{transform:scaleY(.3);opacity:.55}
.btn.is-pour>.lbl{text-shadow:0 0 4px rgba(5,7,26,.6),0 0 1px rgba(5,7,26,.6)}
.btn.is-pour>.arr{filter:drop-shadow(0 0 2px rgba(5,7,26,.7))}
.is-pour .ink .lbl{text-shadow:0 0 4px rgba(238,242,251,.9),0 0 1px rgba(238,242,251,.8)}
.is-pour .ink .arr{filter:drop-shadow(0 0 2px rgba(238,242,251,.9))}
.ink{position:absolute;inset:0;z-index:2;display:flex;align-items:center;gap:inherit;padding:inherit;color:var(--ink);pointer-events:none;
clip-path:inset(93% 0 0 0);transition:clip-path 280ms var(--ease-out)}
.is-pour .ink{clip-path:inset(20% 0 0 0);transition:clip-path 1200ms var(--ease-out) 120ms}
.is-pour.is-fast .ink{transition:clip-path 240ms var(--ease-out)}
.pour-gl{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit;pointer-events:none;display:none}
.gl-pour .pour-gl{display:block}
.gl-pour .pour-css,.gl-pour .ink{display:none}
.gl-pour>.lbl,.gl-pour>.arr{opacity:0}
.rm .liq,.rm .is-pour .liq{transform:translateY(20%);rotate:none;transition:opacity 200ms ease}
.rm .liq{opacity:0}
.rm .is-pour .liq{opacity:1}
.rm .liq::before{animation:none}
.rm .stream,.rm .surf-fx{display:none}
.rm .ink,.rm .is-pour .ink{clip-path:none;transition:opacity 200ms ease}
.rm .ink{opacity:0}
.rm .is-pour .ink{opacity:1}
.rm .pour-css::after{content:"";position:absolute;left:20%;right:20%;bottom:6px;height:1px;
background:linear-gradient(90deg,transparent,rgba(238,242,251,.5),transparent);transition:opacity 200ms ease}
.rm .is-pour .pour-css::after{opacity:0}
.rm .btn:active{transform:none;filter:brightness(1.12)}
.rm .btn .arr svg{transition:none}
.rm .btn.is-pour .arr svg{transform:none}
.btn--sm{height:42px;padding:0 16px 0 20px;font-size:10.5px}

*{box-sizing:border-box}html,body{margin:0}body{min-height:100svh;display:grid;place-content:center;}body{background:var(--ink)}a{text-decoration:none}.btn{cursor:pointer}</style></head><body><a class="btn" data-pour="gl" href="#reserve">Reserve a seat
            <span class="arr" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 8h11M9 4l4 4-4 4"/></svg><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 8h11M9 4l4 4-4 4"/></svg></span></a><script type="module">
/* ============================================================
   Pour buttons: a thin silver stream fills the pill on hover.
   Hero CTAs render in WebGL through one shared context;
   every other button (and any fallback) uses the CSS pour.
   ============================================================ */
const q = new URLSearchParams(location.search);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches || q.has('reduced');
const FINE = matchMedia('(hover: hover) and (pointer: fine)').matches;
const REST = 0.07, FULL = 0.8;             // liquid level, fraction of the pill height
const EASE_OUT = 'cubic-bezier(0.23, 1, 0.32, 1)';
document.documentElement.classList.toggle('rm', RM);

/* ---------- DOM: label, CSS liquid, ink copy ---------- */
const pours = [...document.querySelectorAll('.btn')].map(el => {
  const arr = el.querySelector('.arr');
  const tn = [...el.childNodes].find(n => n.nodeType === 3 && n.textContent.trim());
  const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = tn.textContent.trim(); tn.replaceWith(lbl);
  const css = document.createElement('span'); css.className = 'pour-css'; css.setAttribute('aria-hidden', 'true');
  css.innerHTML = '<i class="stream"><i class="col"><i class="cw"></i></i></i><i class="liq"><i class="surf-fx"><i class="wv wv-l"></i><i class="wv wv-r"></i></i></i>';
  const ink = document.createElement('span'); ink.className = 'ink'; ink.setAttribute('aria-hidden', 'true');
  ink.append(lbl.cloneNode(true), arr.cloneNode(true));
  el.prepend(css); el.append(ink);
  return { el, lbl, arr, ink, liq: css.querySelector('.liq'), stream: css.querySelector('.stream'), fx: css.querySelector('.surf-fx'), hover: false, u: 0.5, v: 0.5, gl: null };
});

/* ---------- interaction (shared by both renderers) ---------- */
pours.forEach(p => {
  const el = p.el;
  if (el.dataset.pour === 'state') return;          // filled by setLevel(), see below
  const at = e => { const r = el.getBoundingClientRect(); p.u = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); p.v = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)); };
  el.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch' && FINE){ at(e); start(p); } });
  el.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    const pu = p.u; at(e);
    if (p.gl){ p.gl.wobV += Math.min(4, Math.abs(p.u - pu) * 45); wake(); }
    else if (p.hover) cssFollow(p);
  });
  el.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') stop(p); });
  el.addEventListener('pointerdown', e => { at(e); press(p); if (e.pointerType === 'touch'){ clearTimeout(p.tt); start(p); } });
  const lift = e => { if (e.pointerType === 'touch'){ clearTimeout(p.tt); p.tt = setTimeout(() => stop(p), 260); } };
  el.addEventListener('pointerup', lift); el.addEventListener('pointercancel', lift);
  el.addEventListener('focus', () => { if (el.matches(':focus-visible')){ p.u = 0.5; start(p, true); } });
  el.addEventListener('blur', () => stop(p));
});
function start(p, fast = false){ if (p.hover) return; p.hover = true; p.fast = fast; p.el.classList.toggle('is-fast', fast); p.el.classList.add('is-pour'); p.gl ? glStart(p) : cssStart(p); }
function stop(p){ if (!p.hover) return; p.hover = false; p.el.classList.remove('is-pour'); p.gl ? glStop(p) : cssStop(p); }
function press(p){ if (!p.gl || RM) return; const g = p.gl; g.pressX = p.u; g.pressY = p.v; g.pressAge = 0; g.wobV += 6; wake(); }

/* ---------- CSS pour: the stream sits under the opaque liquid, so the surface always trims it ---------- */
function cssFollow(p){
  if (RM) return;
  const W = p.el.clientWidth;
  p.stream.style.translate = `${(p.u * W).toFixed(1)}px 0`;
  p.fx.style.translate = `${(p.u * W + 0.25 * W).toFixed(1)}px 0`;      // liquid layer starts 25% left of the pill
  p.liq.style.rotate = `${((0.5 - p.u) * 6).toFixed(2)}deg`;
}
function cssStart(p){
  if (RM) return;
  const s = p.stream;
  s.style.transition = 'none'; s.style.clipPath = 'inset(0 0 100% 0)'; cssFollow(p); void s.offsetWidth;   // a fresh stream starts at the top edge
  s.style.transition = `clip-path 140ms ${EASE_OUT}, translate 140ms ${EASE_OUT}`;
  s.style.clipPath = 'inset(0 0 0 0)';
  clearTimeout(p.ft); p.el.classList.remove('is-full'); p.ft = setTimeout(() => p.el.classList.add('is-full'), 1400);
}
function cssStop(p){
  p.liq.style.rotate = '0deg'; clearTimeout(p.ft); p.el.classList.remove('is-full');
  if (RM) return;
  p.stream.style.transition = `clip-path 200ms ${EASE_OUT}`;    // cut: the tail falls into the liquid
  p.stream.style.clipPath = 'inset(100% 0 0 0)';
}

/* ---------- WebGL pour (hero CTAs) ---------- */
const VS = `attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;
const FS = `
precision highp float;
uniform vec2 uRes, uPtr, uSW;
uniform float uDpr, uTime, uLevel, uTilt, uWob, uSX, uIX, uHead, uTail, uFlow, uEnergy, uLandAge, uHover, uArrow, uBody;
uniform vec4 uPress;
uniform sampler2D uTex;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
float sdPill(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }

// height of the liquid surface (px from the bottom) at x
float surf(float x){
  float d = uDpr, u = x / uRes.x;
  float h = uLevel * uRes.y + uTilt * (u - 0.5) * uRes.y;
  h += (sin(u * 6.0 + uTime * 2.1) * 0.5 + sin(u * 13.0 - uTime * 3.1) * 0.25) * uWob * d;          // slow slosh
  // rings travelling outward from the landing point, only as far as the front has reached
  float hwB = uSW.y * d, dx0 = abs(x - uIX), dx = max(dx0 - hwB * 0.7, 0.0);   // waves start at the column's edge
  float reach = smoothstep(uLandAge * 190.0 * d + 6.0 * d, uLandAge * 190.0 * d - 30.0 * d, dx);
  float waves = sin(dx / (6.5 * d) - uTime * 11.0) * exp(-dx / (120.0 * d)) * 1.0
              + sin(dx / (11.0 * d) - uTime * 7.0 + 1.3) * exp(-dx / (220.0 * d)) * 0.8
              + sin(dx / (3.4 * d) - uTime * 17.0) * exp(-dx / (34.0 * d)) * 0.5;
  h += uEnergy * d * 2.0 * waves * reach;
  // a small crater under the stream with a raised lip around it
  h += uEnergy * d * (-1.8 * exp(-dx0 * dx0 / (hwB * hwB)) + 1.2 * exp(-pow((dx0 - hwB - 3.0 * d) / (3.5 * d), 2.0)));
  if (uPress.z < 2.0){ float px = abs(x - uPress.x); h += uPress.w * d * 2.2 * sin(px / (6.0 * d) - uPress.z * 26.0) * exp(-uPress.z * 3.5) * exp(-px / (60.0 * d)); }
  return h;
}

// the falling stream: a thick translucent column, ~28px at the lip narrowing to ~18px where it lands,
// with bright edge lines, a soft inner glint and a gentle sway that grows toward the bottom
vec4 stream(vec2 p, float s, float sImp){
  float d = uDpr;
  float top = uRes.y * (1.0 - uTail), headY = uRes.y * (1.0 - uHead), bot = max(s, headY);
  if (uFlow <= 0.001 || p.y < bot - 3.0 * d || p.y > top + d) return vec4(0.0);
  float t = clamp((uRes.y - p.y) / max(uRes.y - sImp, d), 0.0, 1.0);           // 0 at the lip, 1 where it lands
  float cx = mix(uSX, uIX, smoothstep(0.0, 1.0, t));
  cx += (sin(p.y / (16.0 * d) + uTime * 5.5) * 1.3 + sin(p.y / (7.0 * d) - uTime * 8.0) * 0.4) * d * t;
  float hw = mix(uSW.x, uSW.y, t) * d;
  hw *= 1.0 + 0.05 * t * sin(p.y / (8.0 * d) + uTime * 13.0);                     // soft bulges travelling down
  hw *= mix(0.7, 1.0, uFlow);
  if (headY > s + 0.5 * d) hw *= sqrt(clamp((p.y - headY) / max(hw, d), 0.0, 1.0)); // rounded falling head
  float ax = clamp((p.x - cx) / hw, -1.0, 1.0);
  float cov = clamp(0.5 - (abs(p.x - cx) - hw) / (0.9 * d), 0.0, 1.0);
  float span = smoothstep(bot - 0.6 * d, bot + 0.6 * d, p.y) * (1.0 - smoothstep(top - d, top, p.y));
  float thick = sqrt(max(1.0 - ax * ax, 0.0));
  float streak = vnoise(vec2(ax * 3.0 + 7.0, p.y / (6.0 * d) + uTime * 9.0));
  vec3 body = mix(vec3(0.60, 0.65, 0.84), vec3(0.88, 0.91, 0.99), 0.45 + 0.35 * thick + 0.2 * streak);
  float bodyA = (0.24 + 0.16 * thick) * cov * span;
  float edgeL = exp(-pow((ax + 0.88) / 0.07, 2.0)), edgeR = exp(-pow((ax - 0.88) / 0.07, 2.0)) * 0.65;
  float glint = exp(-pow((ax + 0.45) / 0.12, 2.0)) * (0.25 + 0.35 * smoothstep(0.5, 0.9, streak));
  float hi = clamp((edgeL + edgeR) * 0.95 + glint, 0.0, 1.0) * cov * span;
  return vec4(body * bodyA * (1.0 - hi) + vec3(0.97, 0.98, 1.0) * hi, bodyA * (1.0 - hi) + hi);
}

// splash where the column lands: a crown thrown up either side of it, and a few drops on short arcs
float splash(vec2 p, float sImp){
  float d = uDpr, e = clamp(uEnergy / 1.2, 0.0, 1.0), hwB = uSW.y * d;
  if (e <= 0.01) return 0.0;
  vec2 q = p - vec2(uIX, sImp);
  float hc = (3.0 + 6.0 * e) * d * (0.8 + 0.2 * sin(uTime * 23.0));
  float a = 0.0;
  for (int i = 0; i < 2; i++){
    float sg = i == 0 ? -1.0 : 1.0;
    float lean = sg * (hwB + 1.0 * d + max(q.y, 0.0) * 0.7);
    a += smoothstep(1.2 * d, 0.35 * d, abs(q.x - lean)) * step(0.0, q.y) * smoothstep(hc, hc * 0.5, q.y);
    vec2 tip = vec2(sg * (hwB + 1.0 * d + hc * 0.7), hc + 1.0 * d);
    a += smoothstep(1.3 * d, 0.5 * d, length(q - tip));
  }
  for (int i = 0; i < 4; i++){
    float fi = float(i), T = 0.42 + 0.09 * fi;
    float t = mod(uTime + fi * 0.17, T);
    float sg = mod(fi, 2.0) < 0.5 ? -1.0 : 1.0;
    vec2 v = vec2(sg * (18.0 + 8.0 * fi), 62.0 + 16.0 * fi) * d * (0.55 + 0.6 * e);
    vec2 dp = vec2(sg * hwB * 0.85, 0.0) + v * t + vec2(0.0, -210.0 * d * t * t);
    float r = (1.4 - 0.15 * fi) * d;
    a += smoothstep(r + 0.6 * d, r - 0.4 * d, length(q - dp)) * step(0.0, dp.y) * smoothstep(0.0, 0.08, t);
  }
  return clamp(a, 0.0, 1.0) * e;
}

float lab(vec2 uv, vec2 sh){ return max(texture2D(uTex, uv).r, texture2D(uTex, uv - sh).g); }

void main(){
  vec2 p = gl_FragCoord.xy, c = uRes * 0.5;
  float d = uDpr, r = c.y;
  float sd = sdPill(p - c, c, r);
  float inside = 1.0 - smoothstep(-0.6 * d, 0.6 * d, sd);
  if (inside <= 0.0){ gl_FragColor = vec4(0.0); return; }
  float s = surf(p.x), dep = s - p.y;
  float slope = (surf(p.x + d) - surf(p.x - d)) / (2.0 * d);
  float lightCatch = clamp(0.6 - slope * 1.3, 0.2, 1.4);               // crests facing the light glint
  float sImp = surf(uIX);
  float liq = smoothstep(-0.7 * d, 0.7 * d, dep);
  float lift = clamp((uBody - 0.55) / 0.45, 0.0, 1.0);
  float e = clamp(uEnergy / 1.2, 0.0, 1.0);
  vec3 moon = vec3(0.933, 0.949, 0.984), ink = vec3(0.02, 0.027, 0.10);

  // label and a soft halo around it (keeps it readable through the surface, the stream and the splash)
  vec2 uv = p / uRes, sh = vec2(uArrow * d / uRes.x, 0.0), o = 2.4 * d / uRes;
  vec2 ref = vec2(0.0, sin(p.x / (7.0 * d) + uTime * 2.4) * 0.3 * d * uWob * smoothstep(0.0, 6.0 * d, dep)) / uRes;
  float labAir = lab(uv, sh), labLiq = lab(uv + ref, sh);
  float halo = (lab(uv + vec2(o.x, 0.0), sh) + lab(uv - vec2(o.x, 0.0), sh) + lab(uv + vec2(0.0, o.y), sh) + lab(uv - vec2(0.0, o.y), sh)
              + lab(uv + o, sh) + lab(uv - o, sh) + lab(uv + vec2(o.x, -o.y), sh) + lab(uv + vec2(-o.x, o.y), sh)) * 0.2;
  halo = clamp(max(halo, labAir), 0.0, 1.0);
  float keep = 1.0 - halo * 0.8;

  // liquid body: near-white silver, almost opaque, so the ink label stays easy to read;
  // it is brighter only where light catches: the skin under the surface and small glints
  float edge = clamp(-sd / r, 0.0, 1.0);
  vec3 col = vec3(0.95, 0.96, 1.0) * mix(0.84, 1.0, smoothstep(0.0, 0.85, edge)) * mix(0.9, 1.0, smoothstep(0.0, 0.9, p.y / uRes.y));
  float aL = mix(0.92, 0.98, smoothstep(0.0, uLevel * uRes.y, p.y)), skin = exp(-max(dep, 0.0) / (3.2 * d));   // thinner with depth
  col = mix(col, vec3(0.98, 0.985, 1.0), skin * 0.45); aL = mix(aL, 1.0, skin * 0.6);
  float n = vnoise(p / (11.0 * d) + vec2(uTime * 0.35, -uTime * 0.6)) * 0.6 + vnoise(p / (5.0 * d) - vec2(uTime * 0.5, uTime * 0.2)) * 0.4;
  col += (n - 0.5) * 0.06 * edge;
  float gl0 = smoothstep(0.66, 0.9, n) * edge * exp(-max(dep, 0.0) / (22.0 * d)); col += gl0 * 0.12; aL += gl0 * 0.12;
  float band = exp(-pow((dep - 4.5 * d) / (2.2 * d), 2.0)) * lightCatch; col += band * 0.08; aL += band * 0.08;
  col -= exp(-pow((dep - 1.6 * d) / (0.9 * d), 2.0)) * 0.08;
  float catchB = exp(-pow((sd + 2.4 * d) / (1.2 * d), 2.0)) * (1.0 - smoothstep(0.1, 0.45, p.y / uRes.y)) * (1.0 - 0.7 * abs(p.x / uRes.x - 0.47) * 2.0);
  col += catchB * 0.3; aL += catchB * 0.25;                            // light caught where the glass curves at the bottom
  vec2 pp = p - uPtr; float hv = exp(-dot(pp, pp) / (1400.0 * d * d)) * uHover; col += hv * 0.12; aL += hv * 0.08;
  // aerated plume and foam under the landing point
  float pdx = p.x - uIX;
  float hwB = uSW.y * d;
  float plume = e * exp(-pdx * pdx / (hwB * hwB * 1.1)) * exp(-max(dep, 0.0) / (16.0 * d)) * 0.35;
  float foam = e * smoothstep(0.55, 0.9, vnoise(vec2(p.x / (1.6 * d), p.y / (1.6 * d) - uTime * 9.0))) * exp(-pdx * pdx / pow(hwB + 6.0 * d, 2.0)) * exp(-abs(dep) / (3.0 * d)) * 0.4;
  col += plume + foam; aL += (plume + foam) * 0.5;
  float ring = 0.0;
  if (uPress.z < 2.0){ float pd = length(p - uPress.xy); ring = exp(-pow((pd - uPress.z * 240.0 * d) / (3.5 * d), 2.0)) * exp(-uPress.z * 3.2) * uPress.w; }
  col += ring * 0.35; aL += ring * 0.3;
  col = mix(col, vec3(0.97, 0.975, 1.0), halo * 0.5); aL = mix(aL, 1.0, halo * 0.55);   // a light bed under the ink letters
  col = mix(col, ink, labLiq * 0.94); aL = mix(aL, 1.0, labLiq);
  aL = clamp(aL, 0.0, 1.0);
  vec4 L = vec4(col * aL, aL) * uBody;                                   // premultiplied

  // air: the label, then the stream and splash, faded where they would cross a letter
  // the column passes behind the label: a darker bed under the letters keeps the moon label readable on it
  vec4 A = stream(p, s, sImp);
  A.rgb *= 1.0 - halo * 0.6;
  A = A * (1.0 - labAir) + vec4(moon, 1.0) * labAir;
  float sp = splash(p, sImp) * (1.0 - liq) * keep;
  A = A * (1.0 - sp) + vec4(moon, 1.0) * sp;

  vec4 col4 = mix(A, L, liq);
  float men = exp(-pow(dep / (0.8 * d), 2.0)) * (0.22 + 0.78 * lift) * lightCatch * keep;
  float glowAbove = exp(-max(-dep, 0.0) / (3.0 * d)) * (1.0 - liq) * (0.04 + 0.08 * lift) * keep;
  col4.rgb += moon * men * 0.8; col4.a = max(col4.a, men * 0.8);
  col4.rgb += moon * glowAbove; col4.a = max(col4.a, glowAbove);
  float ra = ring * 0.25 * (1.0 - liq); col4.rgb += vec3(ra); col4.a = max(col4.a, ra);
  // glassy catch-light along the inner top rim of the pill
  float rim = exp(-pow((sd + 2.2 * d) / (1.1 * d), 2.0)) * smoothstep(0.35, 0.95, p.y / uRes.y) * (1.0 - 0.6 * abs(p.x / uRes.x - 0.45));
  rim *= 0.10 + 0.22 * uHover;
  col4.rgb += moon * rim; col4.a = max(col4.a, rim);
  gl_FragColor = col4 * inside;
}`;

const glTargets = (RM || q.has('nogl')) ? [] : pours.filter(p => p.el.dataset.pour === 'gl');
let gl = null, glc = null, U = {}, raf = 0, last = 0, T = 0, lost = false;

function initGL(){
  glc = glc || document.createElement('canvas');
  const o = { premultipliedAlpha: true, preserveDrawingBuffer: true, antialias: false, alpha: true, depth: false, stencil: false };
  gl = glc.getContext('webgl2', o) || glc.getContext('webgl', o);
  if (!gl) return false;
  const sh = (t, src) => { const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  'uRes uPtr uSW uDpr uTime uLevel uTilt uWob uSX uIX uHead uTail uFlow uEnergy uLandAge uHover uArrow uBody uPress uTex'.split(' ').forEach(n => U[n] = gl.getUniformLocation(prog, n));
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.uniform1i(U.uTex, 0);
  return true;
}

function attach(p){
  const cvs = document.createElement('canvas'); cvs.className = 'pour-gl'; cvs.setAttribute('aria-hidden', 'true');
  p.el.querySelector('.pour-css').after(cvs);
  p.gl = { cvs, ctx: cvs.getContext('2d'), lab: document.createElement('canvas'), tex: gl.createTexture(), visible: true, frame: 0,
    sw: [14, 9], level: REST, tilt: 0, tiltV: 0, wob: 0.3, wobV: 0, sx: 0.5, sxV: 0, sl: 0.5, slV: 0, arrow: 0, arrowV: 0,
    head: 0, headV: 0, tail: 0, tailV: 0, on: false, cut: false, landed: false, flow: 0, energy: 0, landAge: 0, hov: 0, body: 0.55,
    pressX: 0.5, pressY: 0.5, pressAge: 9 };
  p.el.classList.add('gl-pour');
  layoutBtn(p);
  new ResizeObserver(() => { if (p.gl){ layoutBtn(p); wake(); } }).observe(p.el);
  io.observe(p.el);
}

// label + arrow → texture (R = text, G = arrow), placed exactly where the DOM label sits
function layoutBtn(p){
  const g = p.gl, el = p.el, W = el.clientWidth, H = el.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  if (!W || !H || lost) return;

  for (const ch of p.lbl.textContent.toUpperCase()){ c.fillText(ch, x, y); x += c.measureText(ch).width + ls; }

function glStart(p){
  const g = p.gl; g.on = true; g.cut = false; g.head = 0; g.headV = 2.5; g.tail = 0; g.tailV = 0; g.landed = false;
  g.sx = g.sl = p.u; g.sxV = g.slV = 0; g.wobV += 2; wake();
}
function glStop(p){ const g = p.gl; g.on = false; if (g.flow > 0.05){ g.cut = true; g.tailV = 2.5; } wake(); }

const spring = (g, k, target, stiff, zeta, dt) => { const v = g[k + 'V'] + (-stiff * (g[k] - target) - 2 * zeta * Math.sqrt(stiff) * g[k + 'V']) * dt; g[k + 'V'] = v; g[k] += v * dt; };

function step(p, g, dt){

  if (g.landed){ g.head = toSurf; g.landAge += dt; }
  if (g.cut){ g.tailV += 55 * dt; g.tail += g.tailV * dt; if (g.tail >= toSurf){ g.cut = false; g.flow = 0; g.landed = false; g.head = g.tail = 0; } }

  // splash and ripple energy: strongest on the long first fall, calming as the pill fills
  g.energy = approach(g.energy, g.landed && (g.on || g.cut) ? g.flow * (0.25 + 1.3 * (1 - g.level)) : 0, 5, dt);
  // the level rises only once the stream lands (about 1.3 s, quick at first, easing near the top) and drains from wherever it is
  const lt = g.on ? (g.landed ? FULL : g.level) : REST;
  g.level = approach(g.level, lt, lt > g.level ? (p.fast ? 9.5 : 2.4) : 8.5, dt);
  spring(g, 'sx', p.u, 260, 0.75, dt);
  spring(g, 'sl', g.sx, 55, 0.65, dt);                  // the lower stream lags the lip
  spring(g, 'tilt', p.hover ? (p.u - 0.5) * 0.14 : 0, 70, 0.3, dt);
  spring(g, 'wob', p.hover ? 0.4 : 0.3, 40, 0.28, dt);
  spring(g, 'arrow', p.hover ? 3 : 0, 220, 0.8, dt);
  g.hov = approach(g.hov, p.hover ? 1 : 0, 8, dt);
  g.body = approach(g.body, g.on || g.level > REST + 0.01 ? 1 : 0.55, 6, dt);
  g.pressAge += dt;
  return p.hover || g.on || g.cut || Math.abs(g.level - REST) > 0.003 || g.pressAge < 1.6 ||
    g.energy > 0.005 || Math.abs(g.tiltV) + Math.abs(g.wobV) + Math.abs(g.sxV) + Math.abs(g.slV) + Math.abs(g.arrowV) > 0.02 || Math.abs(g.tilt) > 0.002 || g.body < 0.999 && g.body > 0.551;
}

function draw(p, g){
  const Wd = g.cvs.width, Hd = g.cvs.height;
  if (!Wd || lost) return;
  gl.viewport(0, 0, Wd, Hd); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindTexture(gl.TEXTURE_2D, g.tex);
  gl.uniform2f(U.uRes, Wd, Hd); gl.uniform2f(U.uSW, g.sw[0], g.sw[1]); gl.uniform2f(U.uPtr, p.u * Wd, (1 - p.v) * Hd);
  gl.uniform1f(U.uDpr, g.dpr); gl.uniform1f(U.uTime, T); gl.uniform1f(U.uLevel, g.level); gl.uniform1f(U.uTilt, g.tilt);
  gl.uniform1f(U.uWob, Math.max(0, g.wob)); gl.uniform1f(U.uSX, g.sx * Wd); gl.uniform1f(U.uHead, g.head); gl.uniform1f(U.uTail, g.tail);
  gl.uniform1f(U.uIX, g.sl * Wd); gl.uniform1f(U.uEnergy, g.energy); gl.uniform1f(U.uLandAge, g.landAge);
  gl.uniform1f(U.uFlow, g.on || g.cut ? g.flow : 0); gl.uniform1f(U.uHover, g.hov);
  gl.uniform1f(U.uArrow, g.arrow); gl.uniform1f(U.uBody, g.body);

  gl.drawArrays(gl.TRIANGLES, 0, 3);

  g.ctx.drawImage(glc, 0, glc.height - Hd, Wd, Hd, 0, 0, Wd, Hd);

// one loop for all GL buttons; it stops when none is on screen, and the resting meniscus redraws at 20 fps
function wake(){ if (!raf && !lost && gl){ last = 0; raf = requestAnimationFrame(frame); } }
function frame(now){
  raf = 0;
  const dt = last ? Math.min(Math.max((now - last) / 1000, 0), 0.05) : 1 / 60; last = now;
  T += dt;
  let any = false;
  for (const p of glTargets){
    const g = p.gl;
    if (!g || !g.visible) continue;
    if (p.el.checkVisibility && !p.el.checkVisibility({ opacityProperty: true, visibilityProperty: true })) continue;
    any = true;
    const active = step(p, g, dt);
    if (active || ++g.frame % 3 === 0) draw(p, g);
  }

}
const io = new IntersectionObserver(es => es.forEach(e => { const p = glTargets.find(x => x.el === e.target); if (p && p.gl){ p.gl.visible = e.isIntersecting; if (e.isIntersecting) wake(); } }));

if (glTargets.length){
  try {
    if (initGL()){
      glTargets.forEach(attach);
      document.fonts.ready.then(() => glTargets.forEach(p => p.gl && layoutBtn(p)));
      addEventListener('scroll', wake, { passive: true });       // a CTA can fade in while the stage is pinned
      document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
      glc.addEventListener('webglcontextlost', e => {
        e.preventDefault(); lost = true; cancelAnimationFrame(raf); raf = 0;
        glTargets.forEach(p => { p.saved = p.gl; p.gl = null; p.el.classList.remove('gl-pour'); if (p.hover) cssStart(p); });
      });
      glc.addEventListener('webglcontextrestored', () => {
        lost = false; initGL();
        glTargets.forEach(p => { if (!p.saved) return; p.gl = p.saved; p.gl.tex = gl.createTexture(); p.el.classList.add('gl-pour'); layoutBtn(p); });
        wake();
      });
      wake();
    }
  } catch (err){
    console.warn('Pour buttons: WebGL unavailable, using the CSS pour.', err);
    glTargets.forEach(p => { p.gl = null; p.el.classList.remove('gl-pour'); p.el.querySelector('.pour-gl')?.remove(); });
  }
}
// state-driven pour: the confirm button fills in steps as a reservation is chosen (0, 0.5, 1)
window.__pourAPI = {
  setLevel(el, f){
    const p = pours.find(x => x.el === el);
    if (!p || p.level === f) return;
    const rising = f > (p.level || 0), top = 93 - 73 * f;
    p.liq.style.transition = `transform 1200ms ${EASE_OUT} ${rising ? 120 : 0}ms, rotate 420ms ${EASE_OUT}, opacity 200ms ease`;
    p.liq.style.transform = `translateY(${top}%)`; p.liq.style.opacity = f > 0 ? '1' : '';
    p.ink.style.transition = `clip-path 1200ms ${EASE_OUT} ${rising ? 120 : 0}ms, opacity 200ms ease`;
    p.ink.style.clipPath = `inset(${top}% 0 0 0)`; p.ink.style.opacity = f > 0 ? '1' : '';
    p.stream.querySelector('.col').style.transform = f > 0 ? `scaleY(${(top / 100 + 0.04).toFixed(3)})` : '';   // the column ends at this level's surface
    p.level = f;
    if (RM) return;
    clearTimeout(p.lt);
    if (rising){                                       // a short pour while the level rises
      p.u = 0.38 + Math.random() * 0.24;
      p.el.classList.add('is-pour'); cssStart(p);
      p.lt = setTimeout(() => { p.el.classList.remove('is-pour'); cssStop(p); }, 1150);
    }

};

// debug hooks for automated checks
let loseExt = null;
window.__pour = { pours, get gl(){ return gl; },
  loseContext(){ loseExt = gl && gl.getExtension('WEBGL_lose_context'); loseExt?.loseContext(); }, restoreContext(){ loseExt?.restoreContext(); } };
</script><script>document.querySelector("a").onclick=e=>{e.preventDefault();document.dispatchEvent(new CustomEvent("reserve",{bubbles:true}))}</script></body></html>

:root{--ink: #0b0a09;--ink-2: #121110;--bone: #efe9df;--mute: rgba(239, 233, 223, .68);--faint: rgba(239, 233, 223, .4);--line: rgba(239, 233, 223, .14);--bronze: #c9a36b;--glass: rgba(16, 14, 12, .46);--serif: "Cormorant Garamond", "Times New Roman", serif;--sans: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;--gutter: clamp(16px, 3.2vw, 48px);--ease: cubic-bezier(.22, 1, .36, 1);--bar: 72px}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink);color-scheme:dark;scroll-behavior:auto}
body{background:var(--ink);color:var(--bone);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.sec__label{display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute);margin-bottom:clamp(36px,5vw,64px)}
.sec__label:after{content:"";flex:0 0 56px;height:1px;background:var(--line)}
.display{font-family:var(--serif);font-weight:300;font-size:clamp(46px,6.4vw,112px);line-height:.96;letter-spacing:-.018em;max-width:13ch}
.display--s{font-size:clamp(40px,4.6vw,78px);max-width:15ch}
.sec__head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(24px,6vw,120px);align-items:end;margin-bottom:clamp(48px,7vw,104px)}
.sec__head p{color:var(--mute);max-width:44ch}
.section-draw{margin:0 0 clamp(40px,5vw,72px);background:var(--ink-2);border:1px solid var(--line);padding:clamp(16px,2.4vw,36px)}

.plans{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,3vw,48px)}
.plan__draw svg{width:100%;height:auto;display:block}
.plan figcaption{display:flex;gap:14px;align-items:baseline;margin-top:18px;font-size:13px;color:var(--mute)}
.plan figcaption span{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--bronze)}
.drw text{font-family:var(--sans);font-size:9px;letter-spacing:.18em;text-transform:uppercase;fill:var(--mute)}
.drw .t-room{font-size:10px;fill:var(--bone)}
.drw .t-dim{font-size:8px;fill:var(--faint);letter-spacing:.1em}

.drw .l-thin{stroke:var(--mute);stroke-width:.8;fill:none}
.drw .l-glass{stroke:var(--bronze);stroke-width:1;fill:none}
.drw .l-fur{stroke:var(--faint);stroke-width:.7;fill:none}
.drw .l-dim{stroke:var(--faint);stroke-width:.6;fill:none}
.drw .l-ground{stroke:var(--mute);stroke-width:1.2;fill:none}
.drw .l-sea{stroke:var(--bronze);stroke-width:.8;fill:none;stroke-dasharray:6 5}
.drw .f-water{fill:#c9a36b1f;stroke:var(--bronze);stroke-width:.8}
.drw .f-hatch{fill:url(#hatch);stroke:var(--bone);stroke-width:1.6}
.drw .g-rock{fill:url(#rock);stroke:none}
.drw .g-block{fill:#141210}
.drw .f-conc{fill:url(#conc);stroke:var(--bone);stroke-width:1.3}
.drw .f-wall{fill:#efe9df8c;stroke:var(--bone);stroke-width:1}
.drw .f-bronze{fill:var(--bronze);stroke:none}
.drw .f-light{fill:#fff3d6;stroke:none;filter:drop-shadow(0 0 3px rgba(255,220,160,.9))}
.drw .f-fire{fill:#de78328c;stroke:#efe9df73;stroke-width:.8}
.drw .f-datum{fill:var(--bronze);stroke:none}
.drw .l-break{stroke:var(--bone);stroke-width:1.2;fill:none}
.drw .l-water{stroke:#7fa3b3;stroke-width:1.4;fill:none}
.drw .l-wave{stroke:#7fa3b399;stroke-width:1;fill:none}
.drw .l-glass2{fill:#7fa3b340;stroke:#7fa3b3;stroke-width:1}
.drw .l-beyond{fill:none;stroke:#efe9df38;stroke-width:.8}
.drw .l-finish{stroke:var(--bronze);stroke-width:2;fill:none}
.drw .l-person{fill:none;stroke:#efe9dfbf;stroke-width:1;stroke-linecap:round}
.drw .l-sun{stroke:#e6b36a;stroke-width:1.1;stroke-dasharray:7 5;fill:none}
.drw .l-leader{fill:none;stroke:#efe9df59;stroke-width:.7}
.drw .t-note{font-size:8.5px;letter-spacing:.08em;text-transform:none;fill:#efe9dfc7}
.drw .t-sun{font-size:8.5px;letter-spacing:.08em;text-transform:none;fill:#e6b36a}
.drw .t-lev{font-size:8px;letter-spacing:.12em;fill:var(--bone)}
.drw .t-title{font-family:var(--serif);font-size:15px;letter-spacing:.12em;text-transform:none;fill:var(--bone)}
.materials__intro .display--s{margin-bottom:28px}
.daylight__top .display--s{text-shadow:0 2px 40px rgba(0,0,0,.5)}
.approach__copy .display--s{font-size:clamp(36px,4.2vw,68px);margin-top:18px}
.paper-svg .drw text{fill:#2a2520cc}
.paper-svg .drw .t-room{fill:var(--ink-c)}
.paper-svg .drw .l-cut{stroke:var(--ink-c)}
.paper-svg .drw .l-solid{fill:#2a25201a;stroke:var(--ink-c)}
.paper-svg .drw .l-thin{stroke:#2a2520a6}
.paper-svg .drw .l-fur{stroke:#2a252073}
.paper-svg .drw .l-dim,.paper-svg .drw .l-ground{stroke:#2a252080}
.paper-svg .drw .l-glass{stroke:#2f5f78}
.paper-svg .drw .f-water{fill:#2f5f7824;stroke:#2f5f78}
.paper-svg .drw .f-hatch{fill:url(#pHatch);stroke:var(--ink-c)}
@media  (max-width: 900px){.section-draw{overflow-x:auto}
.section-draw svg{width:900px;max-width:none}
.section-draw__hint{display:block;position:sticky;left:0;width:fit-content;margin-top:14px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#efe9df8c}
:root{--bar: 56px}
.sec__head{grid-template-columns:1fr;align-items:start}
.plans{grid-template-columns:1fr}
.approach__copy .display--s{font-size:clamp(28px,8vw,44px)}}
.blue-svg .drw text{fill:#e8f2ffd1}
.blue-svg .drw .t-room{fill:#f2f7ff}
.blue-svg .drw .t-dim{fill:#e8f2ffa8}

.blue-svg .drw .l-thin,.blue-svg .drw .l-ground{stroke:#e8f2ffc7}
.blue-svg .drw .l-fur,.blue-svg .drw .l-dim{stroke:#e8f2ff94}
.blue-svg .drw .l-glass,.blue-svg .drw .l-sea{stroke:#bfe2ff}
.blue-svg .drw .f-water{fill:#96d2ff33;stroke:#bfe2ff}
.blue-svg .drw .f-hatch,.blue-svg .drw .f-conc{stroke:#f2f7ff}
.blue-svg .drw .f-wall{fill:#f2f7ff8c;stroke:#f2f7ff}
.blue-svg .drw .f-bronze,.blue-svg .drw .f-datum{fill:#f2f7ff}
.blue-svg .drw .f-light{fill:#f2f7ff;filter:none}
.blue-svg .drw .f-fire{fill:#f2f7ff4d;stroke:#f2f7ff}
.blue-svg .drw .g-block{fill:#143f76}

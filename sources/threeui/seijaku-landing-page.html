    \u003ch2>Leave the world at the step\u003c/h2>\n        \u003cp>A slate tataki, a single cedar step and the scent of hinoki. Shoes come off here, and so does the day.\u003c/p>\n        \u003chr>\n        \u003cdiv class=\"cap\">Tataki earth floor · Keyaki step beam · Hinoki lattice doors\u003c/div>\n      \u003c/section>\n\n      \u003csection id=\"c2\" class=\"blk left\">\n        \u003cdiv class=\"num\">\u003cb>II\u003c/b>\u003cspan>The Corridor\u003c/span>\u003c/div>\n        \u003ch2>Light through paper\u003c/h2>\n        \u003cp>Shoji on the garden side turn afternoon sun into a soft, even glow that moves with the maples outside.\u003c/p>\n        \u003chr>\n        \u003cdiv class=\"cap\">Cedar planks · Washi shoji · Kumiko lattice\u003c/div>\n      \u003c/section>\n\n      \u003csection id=\"c3\" class=\"blk right\">\n        \u003cdiv class=\"num\">\u003cb>III\u003c/b>\u003cspan>The Zashiki\u003c/span>\u003c/div>\n        \u003ch2>Twelve mats, one view\u003c/h2>\n        \u003cp>The formal room is measured in tatami. A tokonoma holds a scroll, a single seasonal branch and nothing else.\n        \u003c/p>\n        \u003chr>\n        \u003cdiv class=\"cap\">12 tatami · Tokonoma · Igusa rush · Juraku plaster\u003c/div>\n      \u003c/section>\n\n      \u003csection id=\"c4\" class=\"blk left\">\n        \u003cdiv class=\"num\">\u003cb>IV\u003c/b>\u003cspan>The Tea Room\u003c/span>\u003c/div>\n        \u003ch2>Four and a half mats\u003c/h2>\n        \u003cp>A low ceiling, a sunken hearth and just enough light. Everything here is smaller so that attention grows.\u003c/p>\n        \u003chr>\n        \u003cdiv class=\"cap\">4.5 tatami · Sunken ro · Iron kettle\u003c/div>\n      \u003c/section>\n\n      \u003csection id=\"c5\" class=\"blk right\">\n        \u003cdiv class=\"num\">\u003cb>V\u003c/b>\u003cspan>The Engawa\u003c/span>\u003c/div>\n        \u003ch2>Neither inside nor out\u003c/h2>\n        \u003cp>The veranda runs beneath the eave: a metre of cedar between the rooms and the courtyard, warm underfoot by\n          late afternoon.\u003c/p>\n        \u003chr>\n        \u003cdiv class=\"cap\">Hinoki boards · Deep kawara eave · Kutsunugi stone\u003c/div>\n      \u003c/section>\n\n      \u003csection id=\"c6\" class=\"blk left\">\n        \u003cdiv class=\"num\">\u003cb>VI\u003c/b>\u003cspan>The Courtyard\u003c/span>\u003c/div>\n        \u003ch2>A garden held by the house\u003c/h2>\n        \u003cp>Moss, seven stones and a tsukubai. Stepping stones set the pace of the crossing, one deliberate step at a\n          time.\u003c/p>\n        \u003chr>\n        \u003cdiv class=\"cap\">Tsuboniwa · Moss · Granite tobi-ishi · Stone lantern\u003c/div>\n      \u003c/section>\n\n      \u003csection id=\"c7\" class=\"blk right\">\n        \u003cdiv class=\"num\">\u003cb>VII\u003c/b>\u003cspan>The Living Room\u003c/span>\u003c/div>\n        \u003ch2>Old frame, new life\u003c/h2>\n        \u003cp>Exposed cedar beams, a wide timber floor and a hearth. Contemporary comfort inside a traditional frame.\u003c/p>\n        \u003chr>\n        \u003cdiv class=\"cap\">Sugi beams · Irori hearth · Glazed doors to the courtyard\u003c/div>\n      \u003c/section>\n\n      \u003csection id=\"c8\" class=\"blk left\">\n        \u003cdiv class=\"num\">\u003cb>VIII\u003c/b>\u003cspan>The Bedroom\u003c/span>\u003c/div>\n        \u003ch2>A room for sleeping\u003c/h2>\n        \u003cp>Tatami, a low bed and paper light. Nothing that does not belong.\u003c/p>\n        \u003chr>\n        \u003cdiv class=\"cap\">Tatami · Andon lamps · Indigo linen\u003c/div>\n      \u003c/section>\n\n      \u003csection id=\"zen\" class=\"blk right\">\n        \u003cdiv class=\"num\">\u003cb>IX\u003c/b>\u003cspan>The Zen Garden\u003c/span>\u003c/div>\n        \u003ch2>Raked every morning\u003c/h2>\n        \u003cp>Eight stones set into moss, and gravel drawn into rings around each one. Nothing grows here that was not\n          chosen.\u003c/p>\n        \u003chr>\n        \u003cdiv class=\"cap\">Karesansui · Raked shirakawa gravel · Eight stones · Moss islands\u003c/div>\n      \u003c/section>\n\n      \u003csection id=\"c9\" class=\"blk right\">\n        \u003cdiv class=\"num\">\u003cb>X\u003c/b>\u003cspan>The Bath\u003c/span>\u003c/div>\n        \u003ch2>Hinoki and steam\u003c/h2>\n        \u003cp>A cypress tub facing the garden, filled to the brim. The wood scents the water, and the water darkens the\n          wood.\u003c/p>\n        \u003chr>\n        \u003cdiv class=\"cap\">Hinoki tub · Slate floor · Sliding glass to the garden\u003c/div>\n      \u003c/section>\n\n      \u003csection id=\"end\" class=\"blk\">\n        \u003ch1>Seijaku\u003c/h1>\n        \u003cp class=\"lede\">One continuous walk. A house that keeps its garden close.\u003c/p>\n        \u003cdiv class=\"stats\">\n          \u003cdiv>\n            \u003cdiv class=\"k\">Internal area\u003c/div>\n            \u003cdiv class=\"v\">310 m²\u003c/div>\n          \u003c/div>\n          \u003cdiv>\n            \u003cdiv class=\"k\">Garden\u003c/div>\n            \u003cdiv class=\"v\">1,200 m²\u003c/div>\n          \u003c/div>\n          \u003cdiv>\n            \u003cdiv class=\"k\">Tatami\u003c/div>\n            \u003cdiv class=\"v\">34\u003c/div>\n          \u003c/div>\n          \u003cdiv>\n            \u003cdiv class=\"k\">Completion\u003c/div>\n            \u003cdiv class=\"v\">2026\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003ca class=\"btn\" id=\"again\" href=\"#top\">Take the walk again\u003ci>\u003c/i>\u003c/a>\n        \u003cdiv class=\"foot\">Seijaku · A private residence in Kyoto · An immersive scroll walk\u003c/div>\n      \u003c/section>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"cursor\">\u003c/div>\n\n  \u003cdiv id=\"chrome\">\n    \u003cdiv id=\"brand\">\n      \u003cdiv class=\"name\">SEIJAKU\u003c/div>\n      \u003cdiv class=\"sub\">KYOTO · RESIDENCE\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"tools\">\n      \u003cdiv id=\"menubtn\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cem>MENU\u003c/em>\u003c/div>\n      \u003cdiv id=\"ambience\">\u003cspan class=\"eq\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cem>AMBIENCE\u003c/em>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"menu\">\n    \u003cdiv class=\"menu-bg\">\u003cimg loading=\"lazy\" decoding=\"async\" id=\"menuImg\" width=\"1600\" height=\"900\" crossorigin=\"anonymous\" alt=\"\">\u003c/div>\n    \u003cnav>\n      \u003ca class=\"mi\" href=\"#top\" data-img=\"hero\" style=\"--i:0\">\u003cspan class=\"n\">01\u003c/span>\u003cspan class=\"t\">Residence\u003c/span>\u003c/a>\n      \u003ca class=\"mi\" href=\"#intro\" data-img=\"composition\" style=\"--i:1\">\u003cspan class=\"n\">02\u003c/span>\u003cspan class=\"t\">Architecture\u003c/span>\u003c/a>\n      \u003ca class=\"mi\" href=\"#materials\" data-img=\"macro_hinoki\" style=\"--i:2\">\u003cspan class=\"n\">03\u003c/span>\u003cspan class=\"t\">Materials\u003c/span>\u003c/a>\n      \u003ca class=\"mi\" href=\"#craft\" data-img=\"joinery\" style=\"--i:3\">\u003cspan class=\"n\">04\u003c/span>\u003cspan class=\"t\">Craft\u003c/span>\u003c/a>\n      \u003ca class=\"mi\" href=\"#garden\" data-img=\"koi\" style=\"--i:4\">\u003cspan class=\"n\">05\u003c/span>\u003cspan class=\"t\">Garden\u003c/span>\u003c/a>\n      \u003ca class=\"mi\" href=\"#plan\" data-img=\"courtyard\" style=\"--i:5\">\u003cspan class=\"n\">06\u003c/span>\u003cspan class=\"t\">Floor plan\u003c/span>\u003c/a>\n      \u003ca class=\"mi\" href=\"#walk\" data-img=\"corridor\" style=\"--i:6\">\u003cspan class=\"n\">07\u003c/span>\u003cspan class=\"t\">Experience\u003c/span>\u003c/a>\n      \u003ca class=\"mi\" href=\"#pricing\" data-img=\"night\" style=\"--i:7\">\u003cspan class=\"n\">08\u003c/span>\u003cspan class=\"t\">Pricing\u003c/span>\u003c/a>\n      \u003ca class=\"mi\" href=\"#inquire\" data-img=\"gate\" style=\"--i:8\">\u003cspan class=\"n\">09\u003c/span>\u003cspan class=\"t\">Inquire\u003c/span>\u003c/a>\n    \u003c/nav>\n    \u003cdiv class=\"menu-foot\">Kyoto &nbsp;·&nbsp; Completion 2027 &nbsp;·&nbsp; Private viewings by appointment\u003c/div>\n    \u003cdiv id=\"menuclose\">CLOSE\u003c/div>\n  \u003c/div>\n\n  \u003cmain id=\"story\">\n    \u003csection id=\"intro\" class=\"ed ivory\">\n      \u003cdiv class=\"lbl2\">01 / The residence\u003c/div>\n      \u003ch2 class=\"h-huge\" data-split=\"words\">A house designed to breathe.\u003c/h2>\n      \u003cdiv class=\"grid\">\n        \u003cfigure class=\"mask-img\">\u003cimg loading=\"lazy\" decoding=\"async\" crossorigin=\"anonymous\" src=\"https://seijaku.mengto.here.now/photos/hero-1600-008a4dfde3f3.webp\" alt=\"Seijaku, the residence from the entrance garden\" width=\"1600\" height=\"900\" sizes=\"(max-width: 900px) 88vw, 48vw\" srcset=\"https://seijaku.mengto.here.now/photos/hero-640-d9cbb07cd02e.webp 640w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/hero-960-ce189cc8de1e.webp 960w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/hero-1600-008a4dfde3f3.webp 1600w\">\n        \u003c/figure>\n        \u003cp class=\"blur-in\">A private Kyoto residence shaped around light, landscape, material and silence. One roof,\n          three gardens, and a walk that never leaves the house.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"walk\" class=\"ed dark pin-section\">\n      \u003cdiv class=\"pin\">\n        \u003cdiv class=\"head\">\n          \u003cdiv class=\"lbl2\">The walk\u003c/div>\n          \u003ch2 class=\"h-huge\" data-split=\"words\">One continuous walk.\u003c/h2>\n        \u003c/div>\n        \u003cdiv class=\"track\">\n          \u003cfigure class=\"wi-item xl\" data-depth=\"0.15\">\u003cimg loading=\"lazy\" decoding=\"async\" crossorigin=\"anonymous\" src=\"https://seijaku.mengto.here.now/photos/entrance-1600-59e954824622.webp\" alt=\"\" width=\"1600\" height=\"900\" sizes=\"(max-width: 900px) 88vw, 82vw\" srcset=\"https://seijaku.mengto.here.now/photos/entrance-640-2db865961697.webp 640w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/entrance-960-8c7c779c8a5a.webp 960w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/entrance-1600-59e954824622.webp 1600w\">\n            \u003cfigcaption>Entrance\u003c/figcaption>\n          \u003c/figure>\n          \u003cfigure class=\"wi-item s\" data-depth=\"-0.6\">\u003cimg loading=\"lazy\" decoding=\"async\" crossorigin=\"anonymous\" src=\"https://seijaku.mengto.here.now/photos/joinery-1600-8171958b5a34.webp\" alt=\"\" width=\"1600\" height=\"900\" sizes=\"(max-width: 900px) 40vw, 22vw\" srcset=\"https://seijaku.mengto.here.now/photos/joinery-640-d386a468f049.webp 640w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/joinery-960-6162b3fca54a.webp 960w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/joinery-1600-8171958b5a34.webp 1600w\">\n            \u003cfigcaption>Post and beam\u003c/figcaption>\n          \u003c/figure>\n          \u003cfigure class=\"wi-item l\" data-depth=\"0.25\">\u003cimg loading=\"lazy\" decoding=\"async\" crossorigin=\"anonymous\" src=\"https://seijaku.mengto.here.now/photos/tearoom-1600-d3261feaa303.webp\" alt=\"\" width=\"1600\" height=\"900\" sizes=\"(max-width: 900px) 70vw, 52vw\" srcset=\"https://seijaku.mengto.here.now/photos/tearoom-640-e23a5df56a87.webp 640w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/tearoom-960-208a1e78bb89.webp 960w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/tearoom-1600-d3261feaa303.webp 1600w\">\n            \u003cfigcaption>Tea room\u003c/figcaption>\n          \u003c/figure>\n          \u003cfigure class=\"wi-item m\" data-depth=\"-0.3\">\u003cimg loading=\"lazy\" decoding=\"async\" crossorigin=\"anonymous\" src=\"https://seijaku.mengto.here.now/photos/living-1600-8f92153b467c.webp\" alt=\"\" width=\"1600\" height=\"900\" sizes=\"(max-width: 900px) 60vw, 36vw\" srcset=\"https://seijaku.mengto.here.now/photos/living-640-478f2878a331.webp 640w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/living-960-752e131546d7.webp 960w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/living-1600-8f92153b467c.webp 1600w\">\n            \u003cfigcaption>Living\u003c/figcaption>\n          \u003c/figure>\n          \u003cfigure class=\"wi-item xl\" data-depth=\"0.1\">\u003cimg loading=\"lazy\" decoding=\"async\" crossorigin=\"anonymous\" src=\"https://seijaku.mengto.here.now/photos/kitchen-1600-85d09e42ea4e.webp\" alt=\"\" width=\"1600\" height=\"900\" sizes=\"(max-width: 900px) 88vw, 82vw\" srcset=\"https://seijaku.mengto.here.now/photos/kitchen-640-9e5cf4ae0e47.webp 640w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/kitchen-960-1e7886713924.webp 960w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/kitchen-1600-85d09e42ea4e.webp 1600w\">\n            \u003cfigcaption>Kitchen\u003c/figcaption>\n          \u003c/figure>\n          \u003cfigure class=\"wi-item s\" data-depth=\"-0.7\">\u003cimg loading=\"lazy\" decoding=\"async\" crossorigin=\"anonymous\" src=\"https://seijaku.mengto.here.now/photos/macro_linen-1600-3f1798716bce.webp\" alt=\"\" width=\"1600\" height=\"900\" sizes=\"(max-width: 900px) 40vw, 22vw\" srcset=\"https://seijaku.mengto.here.now/photos/macro_linen-640-9227c6cf490e.webp 640w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/macro_linen-960-11c96f0507cf.webp 960w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/macro_linen-1600-3f1798716bce.webp 1600w\">\n            \u003cfigcaption>Indigo linen\u003c/figcaption>\n          \u003c/figure>\n          \u003cfigure class=\"wi-item l\" data-depth=\"0.2\">\u003cimg crossorigin=\"anonymous\" loading=\"lazy\" decoding=\"async\" data-still=\"bedroom\" alt=\"\" src=\"https://seijaku.mengto.here.now/a/687013f1080bd966d14b.webp\" width=\"1200\" height=\"676\" sizes=\"(max-width: 900px) 70vw, 52vw\" srcset=\"https://seijaku.mengto.here.now/photos/bedroom-640-5d6ed563eedb.webp 640w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/bedroom-960-dd77c4bfdb18.webp 960w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/embedded/687013f1080bd966d14b574ea6a9564ce4d0a3a50dcbf84082412463936859ff.webp 1200w\">\n            \u003cfigcaption>Bedroom\u003c/figcaption>\n          \u003c/figure>\n          \u003cfigure class=\"wi-item m\" data-depth=\"-0.25\">\u003cimg loading=\"lazy\" decoding=\"async\" crossorigin=\"anonymous\" src=\"https://seijaku.mengto.here.now/photos/onsen-1600-cb1436254a10.webp\" alt=\"\" width=\"1600\" height=\"900\" sizes=\"(max-width: 900px) 60vw, 36vw\" srcset=\"https://seijaku.mengto.here.now/photos/onsen-640-fa45254c7bd2.webp 640w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/onsen-960-a01294d24f2e.webp 960w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/onsen-1600-cb1436254a10.webp 1600w\">\n            \u003cfigcaption>Bath\u003c/figcaption>\n          \u003c/figure>\n          \u003cfigure class=\"wi-item xl\" data-depth=\"0.12\">\u003cimg loading=\"lazy\" decoding=\"async\" crossorigin=\"anonymous\" src=\"https://seijaku.mengto.here.now/photos/koi-1600-5b8da80e6431.webp\" alt=\"\" width=\"1600\" height=\"900\" sizes=\"(max-width: 900px) 88vw, 82vw\" srcset=\"https://seijaku.mengto.here.now/photos/koi-640-4442718fe4a7.webp 640w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/koi-960-754bb5846fdb.webp 960w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/koi-1600-5b8da80e6431.webp 1600w\">\n            \u003cfigcaption>Garden\u003c/figcaption>\n          \u003c/figure>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"materials\" class=\"ed dark pin-section\">\n      \u003cdiv class=\"pin\">\n        \u003ccanvas id=\"matcanvas\">\u003c/canvas>\n        \u003cdiv class=\"over\">\n          \u003cdiv class=\"lbl2\">02 / Materials &nbsp;—&nbsp; Material is memory.\u003c/div>\n          \u003cdiv id=\"matname\">Hinoki\u003c/div>\n          \u003cp id=\"matcap\">\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"craft\" class=\"ed ivory pin-section\">\n      \u003cdiv class=\"pin\">\n        \u003cdiv class=\"head\">\n          \u003cdiv class=\"lbl2\">03 / Craft\u003c/div>\n          \u003ch2 class=\"h-huge\" data-split=\"words\">Built by the hand.\u003c/h2>\n          \u003cp class=\"blur-in\">Beam into column, tenon into mortise, paper over lattice, clay over lath. Nothing is hidden\n            and nothing is glued.\u003c/p>\n        \u003c/div>\n        \u003ccanvas id=\"craftcanvas\">\u003c/canvas>\n        \u003csvg id=\"craftsvg\">\n          \u003cline>\u003c/line>\n          \u003cline>\u003c/line>\n          \u003cline>\u003c/line>\n          \u003cline>\u003c/line>\n        \u003c/svg>\n        \u003cdiv class=\"anno\" style=\"left:8vw;top:60vh\">01 — Hinoki column\u003c/div>\n        \u003cdiv class=\"anno\" style=\"left:8vw;top:67vh\">02 — Mortise and tenon\u003c/div>\n        \u003cdiv class=\"anno\" style=\"left:8vw;top:74vh\">03 — Washi screen\u003c/div>\n        \u003cdiv class=\"anno\" style=\"left:8vw;top:81vh\">04 — Clay plaster\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"garden\" class=\"scene\" data-pose=\"garden\">\n      \u003cdiv class=\"pin\">\n        \u003cdiv class=\"corner\">\n          \u003cdiv class=\"lbl2\">04 / Garden\u003c/div>\n          \u003cp>Koi, moss, seven stones and a bridge. Foreground leaves move; the water hardly does.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"seasons\" class=\"scene\" data-pose=\"seasons\">\n      \u003cdiv class=\"pin\">\n        \u003cdiv class=\"corner\">\n          \u003cdiv class=\"lbl2\">Seasons\u003c/div>\n          \u003ch2 class=\"h-mid\">The same house, four times.\u003c/h2>\n          \u003cp id=\"seasoncap\">Deep green foliage and warm daylight.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"seasonbar\">\n          \u003cdiv class=\"season\" data-season=\"spring\" data-cap=\"Sakura blossom and soft morning light.\">Spring\u003c/div>\n          \u003cdiv class=\"season on\" data-season=\"summer\" data-cap=\"Deep green foliage and warm daylight.\">Summer\u003c/div>\n          \u003cdiv class=\"season\" data-season=\"autumn\" data-cap=\"Red and orange maple, golden light.\">Autumn\u003c/div>\n          \u003cdiv class=\"season\" data-season=\"winter\" data-cap=\"Light snow, bare branches, warm rooms.\">Winter\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"rooms\" class=\"ed ivory\">\n      \u003cdiv class=\"ink-art ink-teaset\" data-art=\"teaset\">\u003c/div>\n      \u003cdiv class=\"lbl2\">Rooms\u003c/div>\n      \u003ch2 class=\"h-huge\" data-split=\"words\">Five rooms, one roof.\u003c/h2>\n      \u003cdiv class=\"roomlist\">\n        \u003cdiv class=\"room\">\n          \u003cfigure class=\"mask-img\">\u003cimg loading=\"lazy\" decoding=\"async\" crossorigin=\"anonymous\" src=\"https://seijaku.mengto.here.now/photos/tearoom-1600-d3261feaa303.webp\" alt=\"\" width=\"1600\" height=\"900\" sizes=\"(max-width: 900px) 88vw, 45vw\" srcset=\"https://seijaku.mengto.here.now/photos/tearoom-640-e23a5df56a87.webp 640w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/tearoom-960-208a1e78bb89.webp 960w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/tearoom-1600-d3261feaa303.webp 1600w\">\n          \u003c/figure>\n          \u003cdiv>\n            \u003ch3>The tea room\u003c/h3>\n            \u003cp>Four and a half mats, a sunken hearth and just enough light. Everything here is smaller so that attention\n              grows.\u003c/p>\n            \u003cul>\n              \u003cli>Tatami\u003c/li>\n              \u003cli>Hinoki\u003c/li>\n              \u003cli>Washi\u003c/li>\n              \u003cli>Handmade ceramic\u003c/li>\n            \u003c/ul>\u003ca class=\"enter\" href=\"#\" data-goto=\"13.3\">Enter room \u003ci>→\u003c/i>\u003c/a>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"room\">\n          \u003cfigure class=\"mask-img\">\u003cimg loading=\"lazy\" decoding=\"async\" crossorigin=\"anonymous\" src=\"https://seijaku.mengto.here.now/photos/living-1600-8f92153b467c.webp\" alt=\"\" width=\"1600\" height=\"900\" sizes=\"(max-width: 900px) 88vw, 45vw\" srcset=\"https://seijaku.mengto.here.now/photos/living-640-478f2878a331.webp 640w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/living-960-752e131546d7.webp 960w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/living-1600-8f92153b467c.webp 1600w\">\n          \u003c/figure>\n          \u003cdiv>\n            \u003ch3>The living room\u003c/h3>\n            \u003cp>Exposed cedar beams, a low table and four chairs without legs. Contemporary comfort inside a traditional\n              frame.\u003c/p>\n            \u003cul>\n              \u003cli>Sugi beams\u003c/li>\n              \u003cli>Tatami\u003c/li>\n              \u003cli>Glazed doors\u003c/li>\n              \u003cli>Paper pendant\u003c/li>\n            \u003c/ul>\u003ca class=\"enter\" href=\"#\" data-goto=\"19.6\">Enter room \u003ci>→\u003c/i>\u003c/a>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"room\">\n          \u003cfigure class=\"mask-img\">\u003cimg loading=\"lazy\" decoding=\"async\" crossorigin=\"anonymous\" src=\"https://seijaku.mengto.here.now/photos/kitchen-1600-85d09e42ea4e.webp\" alt=\"\" width=\"1600\" height=\"900\" sizes=\"(max-width: 900px) 88vw, 45vw\" srcset=\"https://seijaku.mengto.here.now/photos/kitchen-640-9e5cf4ae0e47.webp 640w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/kitchen-960-1e7886713924.webp 960w, https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/b8a49654fc1a3eb7aa856ae1/kitchen-1600-85d09e42ea4e.webp 1600w\">\n          \u003c/figure>\n          \u003cdiv>\n            \u003ch3>The kitchen\u003c/h3>\n            \u003cp>Slatted timber cabinets, a hinoki counter and a sunk basin. Appliances kept behind the same slats as\n              everything else.\u003c/p>\n            \u003cul>\n              \u003cli>Hinoki counter\u003c/li>\n              \u003cli>Brass\u003c/li>\n              \u003cli>Stoneware\u003c/li>\n              \u003cli>Tatami dining\u003c/li>\n            \u003c/ul>\u003ca class=\"enter\" href=\"#\" data-goto=\"9.6

<!doctype html>
<html lang="en">
<head><script id="aura-preview-performance-controller">
(function() {
if (window.__auraPreviewPerformanceController) return;
const nativeRequestAnimationFrame = window.requestAnimationFrame
? window.requestAnimationFrame.bind(window)
: function(callback) { return window.setTimeout(function() { callback(Date.now()); }, 16); };
const nativeCancelAnimationFrame = window.cancelAnimationFrame
? window.cancelAnimationFrame.bind(window)
: window.clearTimeout.bind(window);
const nativeSetInterval = window.setInterval.bind(window);
let paused = false;
let nextFrameId = 1;
const frameRecords = new Map();
const pausedFrameCallbacks = new Map();
const style = document.createElement('style');
style.id = 'aura-preview-performance-style';
style.textContent = [
'html[data-aura-preview-paused="true"] *,',
'html[data-aura-preview-paused="true"] *::before,',
'html[data-aura-preview-paused="true"] *::after {',
'  animation-play-state: paused !important;',
'  transition-duration: 0s !important;',
'  scroll-behavior: auto !important;',
'}'
].join('\n');
document.head.appendChild(style);
window.requestAnimationFrame = function(callback) {
const frameId = nextFrameId++;
if (paused) {
pausedFrameCallbacks.set(frameId, callback);
frameRecords.set(frameId, { paused: true });
return frameId;
}
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);
callback(timestamp);
});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });
return frameId;
};
window.cancelAnimationFrame = function(frameId) {
const record = frameRecords.get(frameId);
pausedFrameCallbacks.delete(frameId);
if (record && typeof record.nativeFrameId !== 'undefined') {
nativeCancelAnimationFrame(record.nativeFrameId);
}
frameRecords.delete(frameId);
};
window.setInterval = function(callback, delay) {
const args = Array.prototype.slice.call(arguments, 2);
return nativeSetInterval(function() {
if (paused) return;
callback.apply(this, args);
}, delay);
};
const flushPausedFrames = function() {
const callbacks = Array.from(pausedFrameCallbacks.entries());
pausedFrameCallbacks.clear();
callbacks.forEach(function(entry) {
const frameId = entry[0];
const callback = entry[1];
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);
callback(timestamp);
});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });
});
};
const setPaused = function(nextPaused) {
const shouldPause = Boolean(nextPaused);
if (paused === shouldPause) return;
paused = shouldPause;
document.documentElement.toggleAttribute('data-aura-preview-paused', paused);
if (!paused) {
flushPausedFrames();
}
};
window.__auraPreviewPerformanceController = {
setPaused: setPaused,
get paused() {
return paused;
}
};
window.addEventListener('message', function(event) {
if (event.source !== window.parent) return;
if (!event.data || event.data.type !== 'aura-preview-performance-mode') return;
setPaused(event.data.paused);
});
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MatrixPay — The treasury operating system</title>
<meta name="description" content="MatrixPay is the treasury operating system for internet-native companies: global liquidity, smart transfers, spend intelligence and vault-grade security in one platform.">
<meta name="theme-color" content="#050807">
<style>
html, body { margin: 0; height: 100%; background: #050807; overflow: hidden; }
#site { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
#wait { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 16px; padding: 0 24px;
color: rgba(154, 255, 211, .62); font: 500 11px/1.6 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .18em;
text-transform: uppercase; text-align: center; transition: opacity .5s; }
#wait.gone { opacity: 0; pointer-events: none; }
#bar { width: 160px; height: 1px; background: rgba(154, 255, 211, .14); overflow: hidden; }
#bar i { display: block; width: 0; height: 100%; background: #00d996; transition: width .2s; }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script>document.addEventListener('click', event => {
const anchor = event.target.closest?.('a[href]');
const href = anchor?.getAttribute('href');
if (event.defaultPrevented || !href?.startsWith('#')) return;
event.preventDefault();
// Hash routers need a real hashchange in this frame. Letting the anchor
// navigate normally would resolve against the parent URL of srcdoc.
if (href.startsWith('#/') || href.startsWith('#!/')) {
window.location.hash = href;
return;
}
if (href === '#') { window.scrollTo({top: 0, behavior: 'smooth'}); return; }
try {
const id = decodeURIComponent(href.slice(1));
const target = document.getElementById(id) || document.getElementsByName(id)[0];
target?.scrollIntoView({behavior: 'smooth', block: 'start'});
} catch { /* Invalid fragments remain in the saved document. */ }
});</script>
<script>document.addEventListener('click', event => {
if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
const anchor = event.target.closest?.('a[href]');
if (!anchor || anchor.hasAttribute('download')) return;
const target = anchor.getAttribute('target')?.toLowerCase();
if (target && target !== '_self' && target !== '_top') return;
try {
const destination = new URL(anchor.href, document.baseURI);
const base = new URL(document.baseURI);
if (!['http:', 'https:'].includes(destination.protocol) || destination.origin === base.origin) return;
event.preventDefault();
window.open(destination.href, '_blank', 'noopener,noreferrer');
} catch { /* Leave invalid links to the browser. */ }
}, true);</script></head>
<body>
<div id="wait"><span id="msg">Loading MatrixPay</span><div id="bar"><i></i></div></div>
<script>
  // MatrixPay v4 is one 4.9 MB file (tools/fil_bundle.py in Desktop/Claude/matrixpay/matrixpay-particle-v4), too big for an
  // Aura project, so it is hosted on Higgsfield's CDN. It runs in its own frame, a fresh window, so its import map and module
  // scripts work as they do standalone.
  const SITE = '/landing-pages/matrixpay-v4-authored.html';
  (async () => {
    const wait = document.getElementById('wait'), bar = document.querySelector('#bar i'), msg = document.getElementById('msg');
    try {
      const r = await fetch(SITE);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const total = +r.headers.get('content-length') || 0, reader = r.body.getReader(), chunks = [];
      for (let got = 0; ;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value); got += value.length;
        if (total) bar.style.width = (100 * got / total).toFixed(1) + '%';
      }
      const f = document.createElement('iframe');
      f.id = 'site'; f.title = 'MatrixPay'; f.allow = 'autoplay; fullscreen';
      f.addEventListener('load', () => { wait.classList.add('gone'); setTimeout(() => wait.remove(), 600); f.focus(); }, { once: true });
      f.srcdoc = await new Blob(chunks).text();
      document.body.appendChild(f);
    } catch (e) {
      msg.textContent = 'Could not load MatrixPay (' + e.message + ')';
    }
  })();
</script>
</body>

transform 1.15s cubic-bezier(.77,0,.175,1),opacity .6s}\n/* the sky shader (script below the loader): fades in over the CSS gradient once its first frame is up */\n#ldSky{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .9s ease}\n#loader.sky #ldSky{opacity:1}\n#loader.sky .ld-glow{animation:none;opacity:0;transition:opacity .9s ease}\n#loader::after{content:\"\";position:absolute;inset:0;z-index:1;pointer-events:none;background-image:var(--grain);background-size:180px;mix-blend-mode:overlay;opacity:.14}\n#loader.out .stage{transform:translateY(-12vh);opacity:0}\n/* the logo is a transparent PNG, shown at full strength from the first frame */\n.ld-logo{position:relative;width:min(372px,74vw);aspect-ratio:1116/178}\n.ld-logo img{position:absolute;inset:0;width:100%;height:100%;display:block}\n.ld-lw{}\n.ld-st{}\n.ld-glow{position:absolute;left:13%;top:62%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;background:radial-gradient(circle,rgba(255,170,90,.45),rgba(255,120,80,.12) 40%,transparent 70%);animation:ldGlow 2.4s ease-out both;pointer-events:none}\n@keyframes ldWipe{to{clip-path:inset(-10% 0 -10% 0)}}\n@keyframes ldStamp{0%{opacity:0;transform:scale(1.9) rotate(-9deg)}55%{opacity:1}100%{opacity:1;transform:none}}\n@keyframes ldThump{0%,100%{transform:none}40%{transform:scale(.985)}}\n@keyframes ldGlow{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}\n.ld-meta{margin-top:34px;display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:12px;letter-spacing:-.2px;text-transform:uppercase;color:rgba(255,236,220,.72)}\n.ld-meta .jp{font-family:var(--jp);font-size:13px;letter-spacing:.3em;text-transform:none}\n.ld-bar{margin-top:14px;width:180px;height:1px;background:rgba(255,236,220,.2);overflow:hidden}\n.ld-bar i{display:block;height:100%;background:#ffd6a8;transform:scaleX(0);transform-origin:left}\nhtml:not(.loaded) body{overflow:hidden}\n#petalLayer{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}\n@media (prefers-reduced-motion: reduce){.ld-logo,.ld-lw,.ld-st,.ld-glow{animation:none!important;clip-path:none!important;opacity:1!important}}\n\n/* ---------- responsive ---------- */\n@media (max-width:1023px){\n  :root{--margin:4.26667vw;--gutter:2.66667vw;--column:5.17778vw}\n  .nav-pill nav,.nav-pill .get-started{display:none}\n  .nav-pill{width:calc(100vw - 2*var(--margin));justify-content:space-between;padding:0 16px;height:52px}\n  .menu-btn{display:flex;flex-direction:column;gap:5px;width:22px}\n  .menu-btn i{height:1.5px;background:var(--black);display:block}\n  .site-header.dark .menu-btn i{background:var(--beige)}\n  .site-header{top:12px}\n  #hero .hero-copy{left:var(--margin);right:var(--margin);width:auto;bottom:6vh}\n  #hero h1{font-size:48px;line-height:52px;letter-spacing:-1px}\n  #hero h1 .line-mask{height:56px}\n  #hero .hero-copy p{width:auto;max-width:360px;font-size:16px;line-height:20px;margin-top:20px}\n  .qualify{width:100%;max-width:400px;margin-top:24px}\n  .hero-info{display:none}\n  #usp{padding:60px 0}\n  #usp .vlines{display:none}\n  .usp-row .orn{display:none}\n  .usp-row{display:flex;flex-direction:column;height:auto!important;aspect-ratio:auto;border-top:1px solid var(--line)}\n  .usp-row .mid{padding:48px var(--margin)}\n  .usp-row .mid .head{opacity:1!important;gap:16px}\n  .usp-fly{display:none}\n  .usp-row .mid h2{font-size:30px;line-height:34px;letter-spacing:-.6px}\n  .usp-row .media{height:110vw;max-height:560px;margin:0 var(--margin) 48px!important}\n  .hiw-intro h2{font-size:44px;line-height:44px;letter-spacing:-.8px;padding:0 var(--margin)}\n  .hiw-intro p{width:auto;padding:0 var(--margin);font-size:16px;line-height:20px}\n  .hiw-item{height:auto;position:relative;padding:12px var(--margin) 0;transform:none!important}\n  .hiw-item+.hiw-item{margin-top:0}\n  .hiw-card{height:auto;min-height:0;display:flex;flex-direction:column;padding:32px 20px}\n  .hiw-item:last- x;line-height:72px;padding-left:0}\n  #cta h2 .line-mask{height:auto}\n  #cta .bottom{grid-template-columns:1fr;gap:32px;padding-left:0;margin-top:48px}\n  #cta .right{height:120vw}\n  footer .frow{display:flex;flex-direction:column;gap:64px;margin-top:120px}\n\n  #letters{padding:80px 0 90px}\n  #letters .vlines,#pricing .vlines{display:none}\n  .lt-head{display:block;margin-bottom:40px;padding:0 var(--margin)}\n  .lt-head .h{padding:0}\n  .lt-head h2{font-size:44px;line-height:48px}\n  .lt-head p{padding:0;margin-top:20px}\n  .lt-row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px var(--margin) 28px;scrollbar-width:none}\n  .lt-row::-webkit-scrollbar{display:none}\n  .lt-row>li{flex:0 0 min(78vw,340px);padding:0;margin:0!important;scroll-snap-align:center}\n  .hagaki{--rot:0deg!important;width:100%}\n  #pricing{padding:80px 0}\n  .pr-grid{display:block;border:0;padding:0 var(--margin)}\n  .pr-intro{padding:0 0 32px}\n  .pr-intro h2{font-size:44px;line-height:48px}\n  .pr-card{display:flex;flex-direction:column;min-height:0;border-radius:6px;overflow:hidden;background:var(--beige-2)}\n  .pr-sky{height:92vw;max-height:520px}\n  .pr-body{border-left:0;padding:28px 20px 28px}\n  footer .more{font-size:35px}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"loader\" role=\"status\" aria-label=\"Loading Sunseto\">\n  \u003ccanvas id=\"ldSky\" aria-hidden=\"true\">\u003c/canvas>\n  \u003cdiv class=\"stage\">\n    \u003cdiv class=\"ld-logo\">\n      \u003cdiv class=\"ld-glow\">\u003c/div>\n      \u003cimg crossorigin=\"anonymous\" class=\"ld-lw\" src=\"https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/embedded/69f488f420f65c3b87e7964521c696dd4cc3b0934df8127f6625f6bcf928ef45.webp\" alt=\"Sunseto\" decoding=\"sync\" fetchpriority=\"high\">\n      \u003cimg crossorigin=\"anonymous\" class=\"ld-st\" src=\"https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/embedded/5a50d1b2400746f4abf29dfe4efcfdbed3a71a5fa9d20c66cc4d14cc791272c4.webp\" alt=\"\" decoding=\"sync\" fetchpriority=\"high\">\n    \u003c/div>\n    \u003cdiv class=\"ld-meta\">\u003cspan class=\"jp\">夕日\u003c/span>\u003cspan>Warming the sun\u003c/span>\u003cspan id=\"loaderPct\">00\u003c/span>\u003c/div>\n    \u003cdiv class=\"ld-bar\">\u003ci id=\"loaderBar\">\u003c/i>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cscript>\n/* Loader sky: the brand gradient brought to life by one small fragment shader. Soft kasumi haze drifts\n   sideways through it, lit where it crosses the warm pool, the mark's sun glows and throws faint shafts,\n   and both warm as the page loads. It runs in a worker on an OffscreenCanvas, so the page's build, which\n   holds the main thread for seconds at a time, cannot stall it; it renders at half the CSS resolution\n   (it is all soft light) and dithers against banding; the worker is shut down once the loader is gone.\n   Without OffscreenCanvas it runs on the main thread; without WebGL the CSS gradient underneath stays. */\nfunction ldSkyRenderer(canvas, raf) {\n  const gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'low-power' });\n  if (!gl) return null;\n  const FS = `precision highp float;\nuniform vec2 uRes, uSun; uniform float uT, uP;\nfloat h12(vec2 p){ vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }\nfloat vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);\n  return mix(mix(h12(i), h12(i + vec2(1., 0.)), f.x), mix(h12(i + vec2(0., 1.)), h12(i + vec2(1., 1.)), f.x), f.y); }\nfloat fbm(vec2 p){ float a = 0., s = .5; for (int i = 0; i \u003c 5; i++) { a += s * vn(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p; s *= .5; } return a; }\nvoid main(){\n  vec2 fc = gl_FragCoord.xy, R = uRes;\n  vec2 uv = vec2(fc.x / R.x, 1. - fc.y / R.y);\n  vec2 p = (fc - .5 * R) / R.y;\n  vec2 s = (vec2(uSun.x, R.y - uSun.y) - .5 * R) / R.y;\n  float t = uT, warm = .55 + .45 * uP;\n  // the brand gradient: an ellipse 60% x 45% round a warm pool 62% down, rising a touch as it loads\n  float e = length((uv - vec2(.5, .62 - .03 * uP)) / vec2(.6, .45));\n  vec3 col = mix(vec3(.54, .23, .23) * (.92 + .2 * uP), vec3(.29, .10, .22), smoothstep(0., .45, e));\n  col = mix(col, vec3(.10, .047, .133), smoothstep(.45, 1.05, e));\n  // kasumi haze: long soft bands drifting sideways, folded by a slower warp, lit near the pool\n  vec2 q = p * vec2(1.3, 3.4);\n  vec2 w = vec2(fbm(q * .9 + vec2(t * .018, 0.)), fbm(q * .9 + vec2(4.7, 1.3) - vec2(t * .012, 0.)));\n  float n = fbm(q * 1.4 + w * 1.6 + vec2(t * .035, 0.));\n  float band = smoothstep(.42, .78, n), lit = exp(-e * 1.6);\n  col = mix(col, mix(vec3(.16, .05, .13), vec3(1., .52, .34), lit), band * (.08 + .15 * lit));\n  col *= .9 + .2 * n;\n  // the sun behind the mark, breathing, with soft shafts where there is haze to carry them\n  vec2 ds = p - s; float d = length(ds);\n  col += vec3(1., .62, .32) * exp(-d * 7.) * .42 * warm * (1. + .05 * sin(t * 1.3));\n  col += vec3(.95, .38, .26) * exp(-d * 2.4) * .16 * warm;\n  vec2 dir = ds / max(d, 1e-4);\n  float r = vn(dir * 3.2 + vec2(t * .04, -t * .03)) * vn(dir * 7.1 - vec2(t * .02, 0.));\n  col += vec3(1., .55, .32) * smoothstep(.18, .5, r) * exp(-d * 4.6) * (.03 + .07 * band) * warm;\n  // vignette, then a dither under the 8-bit step so the long gradients never band\n  col *= 1. - .28 * smoothstep(.4, 1.2, length(p * vec2(.75, 1.)));\n  col += (h12(fc + fract(t * 7.3) * 91.) - .5) * (1.5 / 255.);\n  gl_FragColor = vec4(col, 1.);\n}`;\n  const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return o; };\n  const pr = gl.createProgram();\n  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }'));\n  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));\n  gl.bindAttribLocation(pr, 0, 'a'); gl.l els, battery, fitting and upkeep in one price.\u003c/p>\u003c/div>\n        \u003cdiv class=\"hg-note r1 c2\">\u003csmall class=\"mono\">Kyoto, Higashiyama\u003c/small>\u003cb>4.8\u003ci>kW\u003c/i>\u003c/b>\u003cp>Sixteen panels laid into the kawara, clear of the ridge and the eaves.\u003c/p>\u003c/div>\n        \u003cdiv class=\"hg-note r3 c3\">\u003csmall class=\"mono\">Up front\u003c/small>\u003cb>¥0\u003c/b>\u003cp>Nothing to buy and nothing to maintain, for as long as you stay.\u003c/p>\u003c/div>\n        \u003c/div>\n      \u003c/li>\n      \u003cli class=\"hiw-item\" data-i=\"1\">\n        \u003carticle class=\"hiw-card\" data-nav=\"dark\">\n          \u003cdiv class=\"txt\">\n            \u003csmall class=\"mono\">Step 2\u003c/small>\n            \u003ch3>We fit it\u003c/h3>\n            \u003ch4 class=\"mono\">One day, one local crew\u003c/h4>\n            \u003cp>A local installer handles the permits, fits the panels and battery, and connects everything to your fuse box. Most homes are finished between breakfast and sunset.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"s2-land\" aria-hidden=\"true\">\u003cdiv class=\"view\" data-view=\"s2land\">\u003ccanvas>\u003c/canvas>\u003c/div>\u003c/div>\n          \u003cdiv class=\"iso-slot\">\u003cdiv class=\"view\" data-view=\"iso\">\u003ccanvas>\u003c/canvas>\u003c/div>\u003c/div>\n        \u003cdiv class=\"veil\">\u003c/div>\u003c/article>\n      \u003c/li>\n      \u003cli class=\"hiw-item hiw-grid\" data-i=\"2\">\n        \u003cdiv class=\"hiw-g\">\n        \u003cdiv class=\"hg-txt r3 c2\">\n          \u003cdiv class=\"txt\">\n            \u003csmall class=\"mono\">Step 3\u003c/small>\n            \u003ch3>Switch on\u003c/h3>\n            \u003ch4 class=\"mono\">Sunshine, then stored sunshine\u003c/h4>\n            \u003cp>The panels run your home by day and fill the battery for the evening. When the grid goes down, your house simply carries on.\u003c/p>\n          \u003c/div>\n        \u003c/d ke-opacity=\"0\" stroke-width=\"1\" stroke-linecap=\"round\" vector-effect=\"non-scaling-stroke\" clip-path=\"url(#chartClip)\"/>\n                  \u003c/svg>\n                  \u003cdiv class=\"c3-chip\" id=\"chartChip\">\u003cb>11.9\u003c/b> kWh · Wed\u003c/div>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"hg-media r1 c1\">\u003cdiv class=\"view\" data-view=\"s3Dusk\" data-nopetal>\u003ccanvas>\u003c/canvas>\u003c/div>\u003c/div>\n        \u003cdiv class=\"hg-note r1 c2\">\u003csmall class=\"mono\">Shiga, 18:40\u003c/small>\u003cb>13.5\u003ci>kWh\u003c/i>\u003c/b>\u003cp>Stored by mid-afternoon, it lights the farmhouse well into the night.\u003c/p>\u003c/div>\n        \u003cdiv class=\"hg-note r1 c3\">\u003csmall class=\"mono\">When the grid drops\u003c/small>\u003cb>0.02\u003ci>s\u003c/i>\u003c/b>\u003cp>The battery takes over before a lamp can flicker.\u003c/p>\u003c/div>\n        \u003cdiv class=\"hg-note r2 c1\">\u003csmall class=\"mono\">A typical evening\u003c/small>\u003cb>82\u003ci>%\u003c/i>\u003c/b>\u003cp>of it runs on the afternoon’s sun.\u003c/p>\u003c/div>\n        \u003cdiv class=\"hg-media r3 c3\">\u003cdiv class=\"view\" data-view=\"s3Storm\" data-nopetal>\u003ccanvas>\u003c/canvas>\u003c/div>\u003c/div>\n        \u003c/div>\n      \u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003c!-- WHY -->\n  \u003csection id=\"why\">\n    \u003carticle data-nav=\"dark\" class=\"why-item c\" data-i=\"0\">\n      \u003cdiv class=\"frame\">\u003cdiv class=\"wire\" style=\"--g:radial-gradient(60% 34% at 50% 64%,rgba(255,130,80,.55),transparent 70%),linear-gradient(180deg,#0b0a1c 0%,#1a1432 30%,#44223e 50%,#a4483a 63%,#6a2a30 68%,#1a0e14 80%,#0a070c 100%)\">\u003cdiv class=\"view\" data-view=\"drawStorm\">\u003ccanvas>\u003c/canvas>\u003c/div>\u003c/div>\u003cdiv class=\"shade\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"inner\">\u003ch2 class=\"mono\">Why now\u003c/h2>\u003cp class=\"big\">\u003cspan class=\"line-mask sv\">\u003cspan>Japan’s grid was built\u003c/span>\u003c/span>\u003cspan class=\"line-mask sv\">\u003cspan>for a calmer climate\u003c/span>\u003c/span>\u003c/p>\u003c/div>\n    \u003c/article>\n    \u003carticle data-nav=\"dark\" class=\"why-item risks\" data-i=\"1\">\n      \u003cdiv class=\"frame\">\u003cdiv class=\"wire\" style=\"--g:radial-gradient(14% 20% at 58% 17%,rgba(255,200,140,.7),transparent 70%),radial-gradient(30% 26% at 47% 86%,rgba(255,150,100,.3),transparent 70%),linear-gradient(180deg,#0a0e1e 0%,#171a34 40%,#2e2040 70%,#140c16 100%)\">\u003cdiv class=\"view\" data-view=\"drawRisks\">\u003ccanvas>\u003c/canvas>\u003c/div>\u003c/div>\u003cdiv class=\"shade\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"inner\">\u003ch2 class=\"mono\">What we face\u003c/h2>\u003cp class=\"risks-lines\">\u003cspan>Your bill follows the price of imported fuel\u003c/span>\u003cspan>One storm can darken a whole prefecture\u003c/span>\u003cspan>After an earthquake, the lines can stay down for days\u003c/span>\u003c/p>\u003c/div>\n    \u003c/article>\n    \u003carticle data-nav=\"dark\" class=\"why-item c\" data-i=\"2\">\n      \u003cdiv class=\"frame\">\u003cdiv class=\"wire\" style=\"--g:radial-gradient(26% 32% at 86% 40%,rgba(255,190,100,.95),rgba(255,120,60,.35) 45%,transparent 75%),linear-gradient(180deg,#120a24 0%,#3a1a44 22%,#9a3e4a 34%,#f09048 40%,#6a2c2c 43%,#20101a 70%,#0c070c 100%)\">\u003cdiv class=\"view\" data-view=\"drawAerial\">\u003ccanvas>\u003c/canvas>\u003c/div>\u003c/div>\u003cdiv class=\"shade\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"inner\" style=\"padding-top:32.9vh\">\u003ch2 class=\"mono\">Roof by roof\u003c/h2>\u003cp class=\"big s70\">\u003cspan class=\"line-mask sv\">\u003cspan>Each Sunseto home shares what it\u003c/span>\u003c/span>\u003cspan class=\"line-mask sv\">\u003cspan>doesn’t use, and together they become\u003c/span>\u003c/span>\u003cspan class=\"line-mask sv\">\u003cspan>a power station spread across Japan\u003c/span>\u003c/span>\u003c/p>\u003c/div>\n    \u003c/article>\n  \u003c/section>\n\n  \u003c!-- NETWORK -->\n  \u003csection id=\"network\">\n    \u003cdiv class=\"copy\">\n      \u003csmall class=\"mono line-mask sv\">\u003cspan>Neighbours, connected\u003c/span>\u003c/small>\n      \u003ch2>\u003cspan class=\"line-mask sv\">\u003cspan>Every roof lends\u003c/span>\u003c/span>\u003cspan class=\"line-mask sv\">\u003cspan>a little light\u003c/span>\u003c/span>\u003c/h2>\n      \u003cp>Neighbouring Sunseto homes trade power with each other. \u003cbr>When one house runs short, the street covers it, and the \u003cbr>whole network grows steadier with every new roof.\u003c/p>\n      \u003ca class=\"btn\" href=\"#cta\">\u003cspan>Check my roof\u003c/span>\u003c/a>\n    \u003c/div>\n    \u003cdiv class=\"net-slot\">\u003cdiv class=\"view\" data-view=\"network\">\u003ccanvas>\u003c/canvas>\u003c/div>\u003c/div>\n  \u003c/section>\n\n  \u003c!-- LETTERS FROM THE STREET -->\n  \u003csection id=\"letters\" aria-labelledby=\"ltTitle\">\n    \u003cdiv class=\"vlines\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\n    \u003cdiv class=\"lt-head\">\n      \u003cdiv class=\"h\">\n        \u003csmall class=\"mono line-mask sv\">\u003cspan>From the neighbours\u003c/span>\u003c/small>\n        \u003ch2 id=\"ltTitle\">\u003cspan class=\"line-mask sv\">\u003cspan>Letters from\u003c/span>\u003c/span>\u003cspan class=\"line-mask sv\">\u003cspan>the street\u003c/span>\u003c/span>\u003c/h2>\n      \u003c/div>\n      \u003cp>Three homes and three evenings, in their own words, on the back of a postcard.\u003c/p>\n    \u003c/div>\n    \u003col class=\"lt-row\">\n      \u003cli>\u003carticle class=\"hagaki\" style=\"--rot:-1.6deg;--ink:#2e3f7a\" data-pm=\"KYOTO|16.4.25|18-40\">\n        \u003cdiv class=\"hk-top\">\n          \u003cdiv class=\"hk-stamp\">\u003cimg crossorigin=\"anonymous\" src=\"https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/embedded/d5dde468f91a64d03396649b56578962b88f983882b9fd9af4854ff3ed6626ee.webp\" alt=\"\" loading=\"lazy\">\u003cspan class=\"band\">\u003cspan>NIPPON\u003c/span>\u003cspan>84\u003c/span>\u003c/span>\u003c/div>\n          \u003csvg class=\"hk-pm\" viewBox=\"0 0 84 84\" aria-hidden=\"true\">\u003c/svg>\n          \u003cdiv class=\"hk-zip\" aria-label=\"Postcode 605-0826\">\u003ci>6\u003c/i>\u003ci>0\u003c/i>\u003ci>5\u003c/i>\u003cb>\u003c/b>\u003ci>0\u003c/i>\u003ci>8\u003c/i>\u003ci>2\u003c/i>\u003ci>6\u003c/i>\u003c/div>\n        \u003c/div>\n        \u003cblockquote class=\"hk-quote\">\u003cp>Our machiya is a hundred and ten years old. The crew laid the panels into the kawara as if they had always been there.\u003c/p>\u003c/blockquote>\n        \u003cdiv class=\"hk-from\">\u003cimg data-img=\"layers/hanko.webp\" alt=\"\">\u003cdiv>\u003cb>Haru Morimoto\u003c/b>\u003cspan class=\"mono\">Higashiyama, Kyoto\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"hk-fact mono\">Naka plan · 4.8 kW · on since April\u003c/div>\n      \u003c/article>\u003c/li>\n      \u003cli>\u003carticle class=\"hagaki\" style=\"--rot:1.2deg;--ink:#26345f\" data-pm=\"TATEYAMA|09.9.25|21-15\">\n        \u003cdiv class=\"hk-top\">\n          \u003cdiv class=\"hk-stamp\">\u003cimg crossorigin=\"anonymous\" src=\"https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/embedded/f7b0c25e5bb4ac1e7ea03498e1e64e1331f0c96110d0c9136eb35743a6367365.webp\" alt=\"\" loading=\"lazy\">\u003cspan class=\"band\">\u003cspan>NIPPON\u003c/span>\u003cspan>84\u003c/span>\u003c/span>\u003c/div>\n          \u003csvg class=\"hk-pm\" viewBox=\"0 0 84 84\" aria-hidden=\"true\">\u003c/svg>\n          \u003cdiv class=\"hk-zip\" aria-label=\"Postcode 294-0045\">\u003ci>2\u003c/i>\u003ci>9\u003c/i>\u003ci>4\u003c/i>\u003cb>\u003c/b>\u003ci>0\u003c/i>\u003ci>0\u003c/i>\u003ci>4\u003c/i>\u003ci>5\u003c/i>\u003c/div>\n        \u003c/div>\n        \u003cblockquote class=\"hk-quote\">\u003cp>The typhoon took the street’s power for eleven hours. Our lamps never flickered, so the neighbours came round for tea.\u003c/p>\u003c/blockquote>\n        \u003cdiv class=\"hk-from\">\u003cimg data-img=\"layers/hanko.webp\" alt=\"\">\u003cdiv>\u003cb>Emi Watanabe\u003c/b>\u003cspan class=\"mono\">Tateyama, Chiba\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"hk-fact mono\">Ō plan · 11 h through the outage\u003c/div>\n      \u003c/article>\u003c/li>\n      \u003cli>\u003carticle class=\"hagaki\" style=\"--rot:-.7deg;--ink:#c8452c\" data-pm=\"ONOMICHI|02.7.25|19-05\">\n        \u003cdiv class=\"hk-top\">\n          \u003cdiv class=\"hk-stamp\">\u003cimg crossorigin=\"anonymous\" src=\"https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/embedded/6dad9c0912482abecebe5d7df9fc5d006f2598b3638d84ba80435906fb8d322e.webp\" alt=\"\" loading=\"lazy\">\u003cspan class=\"band\">\u003cspan>NIPPON\u003c/span>\u003cspan>84\u003c/span>\u003c/span>\u003c/div>\n          \u003csvg class=\"hk-pm\" viewBox=\"0 0 84 84\" aria-hidden=\"true\">\u003c/svg>\n          \u003cdiv class=\"hk-zip\" aria-label=\"Postcode 722-0035\">\u003ci>7\u003c/i>\u003ci>2\u003c/i>\u003ci>2\u003c/i>\u003cb>\u003c/b>\u003ci>0\u003c/i>\u003ci>0\u003c/i>\u003ci>3\u003c/i>\u003ci>5\u003c/i>\u003c/div>\n        \u003c/div>\n        \u003cblockquote class=\"hk-quote\">\u003cp>Our bill used to rise and fall with the price of oil. Now it is one number, and the evenings run on the afternoon.\u003c/p>\u003c/blockquote>\n        \u003cdiv class=\"hk-from\">\u003cimg data-img=\"layers/hanko.webp\" alt=\"\">\u003cdiv>\u003cb>Kenji Sato\u003c/b>\u003cspan class=\"mono\">Onomichi, Hiroshima\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"hk-fact mono\">Ko plan · ¥9,800 a month\u003c/div>\n      \u003c/article>\u003c/li>\n    \u003c/ol>\n  \u003c/section>\n\n  \u003c!-- CTA --> \u003c/span>\u003cem>5–6 people\u003c/em>\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003carticle class=\"pr-card\" aria-live=\"polite\">\n        \u003cdiv class=\"pr-sky\">\n          \u003cdiv class=\"view\" data-view=\"priceSky\">\u003ccanvas>\u003c/canvas>\u003c/div>\n          \u003cdiv class=\"pr-kanji\" id=\"prKanji\" aria-hidden=\"true\">中\u003c/div>\n          \u003cdiv class=\"pr-until mono\">\u003cspan>Carries your evening to\u003c/span>\u003cb id=\"prUntil\">12:10 am\u003c/b>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"pr-body\">\n          \u003cdiv class=\"pr-name\">\u003cb id=\"prName\">Naka\u003c/b>\u003cspan class=\"mono\" id=\"prFor\">3–4 people\u003c/span>\u003c/div>\n          \u003cdiv class=\"pr-price\">\u003cspan class=\"yen\">¥\u003c/span>\u003cb id=\"prPrice\">13,800\u003c/b>\u003cspan class=\"per\">a month\u003c/span>\u003c/div>\n          \u003cul class=\"pr-list\">\n            \u003cli>\u003cspan>Panels\u003c/span>\u003cb id=\"prPanels\">4.8 kW, 16 panels\u003c/b>\u003c/li>\n            \u003cli>\u003cspan>Battery\u003c/span>\u003cb id=\"prBatt\">10 kWh\u003c/b>\u003c/li>\n            \u003cli>\u003cspan>Fitting\u003c/span>\u003cb>One day, one local crew\u003c/b>\u003c/li>\n            \u003cli>\u003cspan>Monitoring and repairs\u003c/span>\u003cb>Included\u003c/b>\u003c/li>\n            \u003cli>\u003cspan>Up front\u003c/span>\u003cb>¥0\u003c/b>\u003c/li>\n          \u003c/ul>\n          \u003ca class=\"btn\" href=\"#hero\">\u003cspan>Check my roof\u003c/span>\u003c/a>\n          \u003cp class=\"pr-note\">Prices include tax. We confirm yours after we have looked at your roof.\u003c/p>\n        \u003c/div>\n      \u003c/article>\n    \u003c/div>\n  \u003c/section>\n\u003c/main>\n\n\u003cfooter id=\"footer\">\n  \u003cdiv class=\"view\" data-view=\"footer\">\u003ccanvas>\u003c/canvas>\u003c/div>\n  \u003cdiv class=\"scrim\">\u003c/div>\n  \u003cdiv class=\"fcontent\">\n    \u003cdiv ====\n/* ============================================================ sunset print\n   Sunseto's own surface, used on the Get started button and the Step 1\n   phone screen: a sunset in the manner of a woodblock print.\n     sky: a bokashi gradient (the printer's wiped-ink blend) from indigo at\n       the top through plum, rose and coral to gold at the horizon\n     sun: a low disc, pale gold at its crown, cut by the horizon, its glow\n       warming the sky around it\n     clouds: flat kasumi bands with rounded ends drifting slowly across,\n       lit gold along their lower edges on the side facing the sun\n     sea: violet water in fine horizontal strokes, with a column of glitter\n       dashes under the sun that widens and loosens toward the viewer\n     paper: a faint grain over everything\n     sparks (button hover only): warm specks lifting off the water under the\n       sun, a small spray as the tide comes in, then a slow trickle\n   Coordinates are aspect-correct and centred; uHz places the horizon and\n   uSunR sizes the sun for each use. uSwell sets the height of the waves\n   along the sea's edge; uSpark (0..1) and uBurst (seconds since the tide\n   turned in) drive the sparks. All three default to off. */\nconst WAVE_VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';\nconst WAVE_VERT_MESH = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }';\nconst WAVE_FRAG = `\nprecision highp float;\nvarying vec2 vUv;\nuniform vec2 uRes; uniform float uTime, uGrain, uDpr, uHz, uSunR, uSunX, uSunY, uSunDeep, uClouds, uCloudY;\nuniform vec3 uC0, uC1, uC2; uniform vec2 uOff; uniform float uScale;\nuniform float uSwell, uSpark, uBurst, uDusk, uMoon;\n${GLSL_NOISE}\nfloat hsh(float n){ return fract(sin(n * 91.3458) * 47453.5453); }\n// a cloud band: a capsule with a slightly wavy edge\nfloat band(vec2 p, vec2 c, float halfLen, float th){\n  vec2 q = p - c; q.x = max nt deepens toward indigo and a pale crescent moon comes up. Both off by default\n  if (uDusk > 0.0) {\n    float lum = dot(col, vec3(0.299, 0.587, 0.114));\n    vec3 night = mix(uC0 * 0.55, vec3(0.12, 0.1, 0.24), 0.35) + lum * vec3(0.3, 0.27, 0.44);\n    col = mix(col, night, uDusk);\n  }\n  if (uMoon > 0.0) {\n    vec2 mc = vec2(0.3, uHz + 0.92);\n    float md = length(p - mc) - 0.07, mo = length(p - mc - vec2(0.03, 0.017)) - 0.064;\n    float mk = (1.0 - smoothstep(-fw, fw, md)) * smoothstep(-fw, fw, mo) * step(0.0, hs);\n    col = mix(col, vec3(1.0, 0.93, 0.8), mk * uMoon);\n  }\n  // --- sparks: specks of sunlight lifting off the water, most of them in the sun's column\n  if (uSpark > 0.001) {\n    float cpx = 2.0 * uDpr / S;                                  // one CSS pixel in these units\n    float sp = 0.0;\n    for (int i = 0; i \u003c 16; i++) {                               // the trickle: each speck loops, re-seeded every life\n      float fi = float(i);\n      float life = 1.6 + 1.6 * hsh(fi + 11.0);\n      float k = t / life + hsh(fi + 5.0), ph = fract(k), cyc = floor(k);\n      float jx = hsh(fi * 3.1 + cyc * 7.7) * 2.0 - 1.0;\n      float sx = i \u003c 9 ? uSunX + jx * uSunR * 1.4 : jx * 0.95;\n      float rise = 0.14 + 0.3 * hsh(fi + 23.0 + cyc * 1.3);\n      vec2 c = vec2(sx + sin(ph * 4.0 + fi * 2.3) * 0.018 + (hsh(fi + 31.0 + cyc) - 0.5) * 0.1 * ph,\n                    uHz + 0.004 + ph * rise);\n      float r = cpx * (0.3 + 0.7 * pow(hsh(fi + 41.0 + cyc), 2.0)) * (1.0 - 0.45 * ph);\n      float a = smoothstep(0.0, 0.1, ph) * pow(1.0 - ph, 1.4) * (0.5 + 0.5 * sin(t * 9.0 + fi * 4.1)) * 0.85;\n      float dd = length(p - c);\n      sp += a * (smoothstep(r + cpx * 0.7, r - cpx * 0.3, dd) + 0.3 * exp(-dd / (r * 2.2)));\n    }\n    float bt = uBurst - 0.1;                                     // the spray: thrown up as the water arrives\n    if (bt > 0.0 && bt \u003c 1.6) {\n      for (int i = 0; i \u003c 10; i++) {\n        float fi = float(i);\n        float tl = (bt - 0.3 * hsh(fi + 57.0)) / (0.6 + 0.5 * hsh(fi + 61.0));  // 0..1 through this speck's flight, launches staggered\n        if (tl \u003c= 0.0 || tl >= 1.0) continue;\n        float vx = (hsh(fi + 67.0) - 0.5) * 0.6, vy = 0.4 + 0.6 * hsh(fi + 71.0);\n        float tt = tl * 0.8;\n        vec2 c = vec2(uSunX + (hsh(fi + 73.0) - 0.5) * uSunR * 2.4 + vx * tt, uHz + vy * tt - 0.5 * tt * tt);\n        float r = cpx * (0.35 + 0.85 * pow(hsh(fi + 79.0), 2.0)) * (1.0 - 0.5 * tl);\n        float a = smoothstep(0.0, 0.05, tl) * pow(1.0 - tl, 1.2);\n        float dd = length(p - c);\n        sp += a * (smoothstep(r + cpx * 0.7, r - cpx * 0.3, dd) + 0.3 * exp(-dd / (r * 2.2)));\n      }\n    }\n    col += vec3(1.0, .9, .66) * min(sp, 1.2) * uSpark;\n  }\n  // paper grain, frame-varying\n  vec2 gp = floor(px/max(uDpr,1.0));\n  col += (hash12(gp + fract(uTime*1.37)*vec2(113.0, 71.0)) - 0.5) * uGrain;\n  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);\n}`;\nconst PALETTES = {\n  // uC0 indigo (top), uC1 rose, uC2 coral; horizon, sun radius and x, cloud strength\n  phone:  { c0: '#2c1d55', c1: '#b0406c', c2: '#ea5f4a', hz: -.56, sunR: .21, sunX: 0, clouds: 0, cloudY: .34 },   // no kasumi on the handset: a band cut by the display edge read as a grey bar\n  button: { c0: '#4a2255', c1: '#c4466a', c2: '#f0683f', hz: -.26, sunR: .3, sunX: .5, clouds: 0, cloudY: 1, sunDeep: 1 },\n  heroOrange: { c0: '#2c1d55', c1: '#b0406c', c2: '#ea5f4a', hz: -.3, sunR: .3, sunX: 0, clouds: 1 },\n  purple: { c0: '#2c1d55', c1: '#b0406c', c2: '#ea5f4a', hz: -.3, sunR: .3, sunX: 0, clouds: 1 },\n};\nfunction makeWaveMaterial(pal, o = {}, mesh = false) {\n  const P = PALETTES[pal] || PALETTES.phone;\n  const u = {\n    uRes: { value: new THREE.Vector2(100, 100) }, uTime: { value: 0 }, uDpr: { value: 1 },\n    uGrain: { value: o.grain ?? 0.04 }, uHz: { value: o.hz ?? P.hz }, uSunR: { value: o.sunR ?? P.sunR }, uSunX: { value: o.sunX ?? P.sunX }, uClouds: { value: P.clouds }, uCloudY: { value: P.cloudY ?? .3 }, uSunY: { value: -10 }, uSunDeep: { value: P.sunDeep ?? 0 },\n    uC0: { value: new THREE.Color(P.c0) }, uC1: { value: new THREE.Color(P.c1) }, uC2: { value: new THREE.Color(P.c2) },\n    uOff: { value: new THREE.Vector2(0, 0) }, uScale: { value: o.scale ?? 1 },\n    uSwell: { value: 0 }, uSpark: { value: 0 }, uBurst: { value: 99 }, uDusk: { value: 0 }, uMoon: { value: 0 },\n  };\n  // palette colours are authored in sRGB and written straight out (no colour management)\n  for (const k of ['uC0', 'uC1', 'uC2']) u[k].value.convertLinearToSRGB();\n  return new THREE.ShaderMaterial({ uniforms: u, vertexShader: mesh ? WAVE_VERT_MESH : WAVE_VERT, fragmentShader: WAVE_FRAG, depthTest: !!mesh, depthWrite: !!mesh, toneMapped: false });\n}\nfunction waveView(name, pal, opts = {}) {\n  const mat = makeWaveMaterial(pal, opts);\n  const scene = new THREE.Scene();\n  scene.add(new THREE.Mesh(quadGeo, mat));\n  return addView(name, {\n    dprCap: opts.dprCap ?? 1.5, noGovern: !!opts.noGovern, mat,\n    draw(t, dt, v) {\n      mat.uniforms.uRes.value.set(v.pw, v.ph);\n      mat.uniforms.uDpr.value = v.dpr;\n      mat.uniforms.uTime.value = t + (opts.t0 || 0);\n      if (opts.update) opts.update(mat, v, t);\n      renderer.render(scene, orthoCam);\n    }\n  });\n}\n\n// ===== solarcard.js =====\n/* ========================================================== solar card\n   The hero and CTA cards are a real, modelled solar panel. At rest it faces\n   you and fills the card exactly; hover and it turns to follow the pointer,\n   drag and it spins (with inertia) so you can see its back, then it settles.\n     front: tempered AR glass over monocrystalline cells (clipped corners,\n            multi-busbar ribbons, finger grid), white backsheet between them,\n            string ribbons across the ends, a brushed aluminium frame\n     back:  backsheet, junction box with two MC4 leads, the rating label,\n            and the frame's return flange\n   The glass reflects a sk the doorway\n   The geometry's positions and normals are rewritten in place each frame. */\n\nfunction makeCloth(geo, { pinTop = true, back = -.12, mass = 1 } = {}) {\n  const pos = geo.attributes.position, n = pos.count;\n  const P = new Float32Array(n * 3), Q = new Float32Array(n * 3), F = new Float32Array(n * 3), pin = new Uint8Array(n);\n  let top = -Infinity; for (let i = 0; i \u003c n; i++) top = Math.max(top, pos.getY(i));\n  for (let i = 0; i \u003c n; i++) { P[i * 3] = Q[i * 3] = pos.getX(i); P[i * 3 + 1] = Q[i * 3 + 1] = pos.getY(i); P[i * 3 + 2] = Q[i * 3 + 2] = pos.getZ(i); if (pinTop && pos.getY(i) > top - 1e-4) pin[i] = 1; }\n  const W = geo.parameters.widthSegments + 1, H = geo.parameters.heightSegments + 1;\n  const C = [];   // [a, b, rest, stiffness]\n  const link = (a, b, k) => { const dx = P[a * 3] - P[b * 3], dy = P[a * 3 + 1] - P[b * 3 + 1], dz = P[a * 3 + 2] - P[b * 3 + 2]; C.push([a, b, Math.hypot(dx, dy, dz), k]); };\n  const id = (x, y) => y * W + x;\n  for (let y = 0; y \u003c H; y++) for (let x = 0; x \u003c W; x++) {\n    if (x + 1 \u003c W) link(id(x, y), id(x + 1, y), 1);\n    if (y + 1 \u003c H) link(id(x, y), id(x, y + 1), 1);\n    if (x + 1 \u003c W && y + 1 \u003c H) { link(id(x, y), id(x + 1, y + 1), .6); link(id(x + 1, y), id(x, y + 1), .6); }\n    if (x + 2 \u003c W) link(id(x, y), id(x + 2, y), .25);\n    if (y + 2 \u003c H) link(id(x, y), id(x, y + 2), .25);\n  }\n  const idx = geo.index.array, nor = geo.attributes.normal;\n  const seed = Math.random() * 100;\n  let acc = 0;\n  const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), fn = new THREE.Vector3(), wv = new THREE.Vector3();\n  function step(h, t, wind) {\n    F.fill(0);\n    // wind on each triangle: along its normal, by how squarely it meets the flow\n    for (let k = 0; k \u003c idx.length; k += 3) {\n      const a = idx[k], b = idx[k + 1], c = idx[k + 2];\n      e1.set(P[b * 3] - P[a * 3], P[b * 3 + 1] - P[a * 3 + 1], P[b * 3 + 2] - P[a * 3 + 2]);\n      e2.set(P[c * 3] - P[a * 3], P[c * 3 + 1] - P[a * 3 + 1], P[c * 3 + 2] - P[a * 3 + 2]);\n      fn.crossVectors(e1, e2);                                       // length = 2 * area\n      const cy = (P[a * 3 + 1] + P[b * 3 + 1] + P[c * 3 + 1]) / 3, cx = (P[a * 3] + P[b * 3] + P[c * 3]) / 3;\n      // gusts: slow swells, faster flutter, varying across the panel\n      const g = .5 + .5 * Math.sin(t * .9 + seed) * Math.sin(t * .37 + seed * 1.7) + .35 * Math.sin(t * 3.4 + cx * 7 + cy * 5 + seed) + .15 * Math.sin(t * 7.3 + cx * 13 - cy * 9);\n      wv.copy(wind).multiplyScalar(Math.max(0, g));\n      const f = fn.dot(wv) * .5 / 3;\n      const len = fn.length() || 1;\n      for (const v of [a, b, c]) { F[v * 3] += fn.x / len * f; F[v * 3 + 1] += fn.y / len * f; F[v * 3 + 2] += fn.z / len * f; }\n    }\n    const damp = .985, gy = -9.81 * h * h;\n    for (let i = 0; i \u003c n; i++) {\n      if (pin[i]) continue;\n      const o = i * 3;\n      for (let k = 0; k \u003c 3; k++) {\n        const x = P[o + k], v = (x - Q[o + k]) * damp;\n        Q[o + k] = x;\n        // ~1250 turns the per-vertex share of pressure into a light cotton's acceleration (wind 1 face-on ~ 3 m/s^2)\n        P[o + k] = x + v + (F[o + k] / mass) * h * h * 1250 + (k === 1 ? gy : 0);\n      }\n    }\n    for (let it = 0; it \u003c 10; it++) {\n      for (const [a, b, rest, k] of C) {\n        const ia = a * 3, ib = b * 3;\n        const dx = P[ib] - P[ia], dy = P[ib + 1] - P[ia + 1], dz = P[ib + 2] - P[ia + 2];\n        const d = Math.hypot(dx, dy, dz) || 1e-6, s = (d - rest) / d * .5 * k;\n        const wa = pin[a] ? 0 : 1, wb = pin[b] ? 0 : 1, ws = wa + wb; if (!ws) continue;\n        const sa = s * 2 * wa / ws, sb = s * 2 * wb / ws;\n        P[ia] += dx * sa; P[ia + 1] += dy * sa; P[ia + 2] += dz * sa;\n        P[ib] -= dx * sb; P[ib + 1] -= dy * sb; P[ib + 2] -= dz * sb;\n      }\n      for (let i = 0; i \u003c n; i++) if (!pin[i] && P[i * 3 + 2] \u003c back) P[i * 3 + 2] = back;   // the doorway behind\n    }\n  }\n  return {\n    update(dt, t, wind) {\n      acc += Math.min(dt, 1 / 20);\n      const h = 1 / 120;\n      let steps = 0;\n      while (acc >= h && steps \u003c 6) { step(h, t, wind); acc -= h; steps++; }\n      if (!steps) return;\n      for (let i = 0; i \u003c n; i++) pos.setXYZ(i, P[i * 3], P[i * 3 + 1], P[i * 3 + 2]);\n      pos.needsUpdate = true; geo.computeVertexNormals(); geo.computeBoundingSphere();\n    }\n  };\n}\n\n// a woven cotton normal map: warp and weft threads crossing\nfunction weaveNormal() {\n  const S = 256, c = makeCanvas(S, S), g = c.getContext('2d'), id = g.createImageData(S, S), d = id.data;\n  const h = (x, y) => { const u = x / 4, v = y / 4, cu = Math.floor(u), cv = Math.floor(v), over = (cu + cv) % 2;\n    const fu = u - cu, fv = v - cv; return over ? Math.sin(fu * Math.PI) * .8 + .2 * Math.sin(fv * Math.PI) : Math.sin(fv * Math.PI) * .8 + .2 * Math.sin(fu * Math.PI); };\n  for (let y = 0; y \u003c S; y++) for (let x = 0; x \u003c S; x++) {\n    const dx = h(x + 1, y) - h(x - 1, y), dy = h(x, y + 1) - h(x, y - 1), i = (y * S + x) * 4;\n    d[i] = 128 - dx * 60; d[i + 1] = 128 - dy * 60; d[i + 2] = 255; d[i + 3] = 255;\n  }\n  g.putImageData(id, 0, 0);\n  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(24, 30); t.anisotropy = 8;\n  return t;\n}\n\n// ===== minka.js =====\n/* ============================================================ minka\n   The hero home: a modern minka on a granite plinth. Kawara-tiled gable\n   roof with a gentle sori at the corners, exposed rafters under deep eaves,\n   hinoki engawa, glowing shoji, a round window, a lattice entry door under\n   an indigo noren, paper lanterns, charred-cedar (yakisugi) wall, a copper\n   rain chain, and solar panels laid into the front slope. */\n\nconst MK = { X0: -5.4, X1: 5.4, D: 8, FLOOR: .55, WALL: 3.0, EAVE_Z: 1.6, RIDGE_Z: -4.0, PITCH: .38, GABLE_X: 6.25 };\nMK.RIDGE_Y = MK.WALL + .1 + -MK.RIDGE_Z * MK.PITCH;\nMK.EAVE_Y = MK.WALL + .1 - MK.EAVE_Z * MK.PITCH;\n\nfunction buildMinka(env) {\n  const root = new THREE.Group();\n  const add = (o, p = root) => { p.add(o); return o; };\n  const mesh = (geo, mat, x = 0, y = 0, z = 0, cast = true) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = true; return add(m); };\n  const box = (w, h, d, mat, x, y, z, cast = true) => mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, cast);\n\n  // ------------------------------------------------ materials\n  const granite = boxMat('granite', { scale: .8, env, envI: .3, nScale: 1.2 });\n  const darkWood = boxMat('darkwood', { scale: .55, env, envI: .5, nScale: 1.1 });\n  const hinoki = boxMat('hinoki', { scale: .8, env, envI: .7, nScale: .8 });\n  const plaster = boxMat('plaster', { scale: 1.6, env, envI: .35, nScale: .9 });\n  const yakisugi = boxMat('yakisugi', { scale: 1.0, env, envI: 1.0, metal: .12, nScale: 1.4 });\n  const kawara = boxMat('kawara', { scale: 1.9, env, envI: 1.8, metal: .12, nScale: 1.5, color: 0xd8dde8 });\n  const copper = new THREE.MeshStandardMaterial({ color: 0xb8683c, metalness: 1, roughness: .32, envMap: env, envMapIntensity: 1 });\n  const shojiT = tex(shojiTexture());\n  const shoji = new THREE.MeshStandardMaterial({ map: shojiT, emissiveMap: shojiT, emissive: new THREE.Color(1, .62, .3).multiplyScalar(2.2), roughness: .9 });\n  const warm = new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, .85, .38) });\n\n  const { X0, X1, D, FLOOR, WALL } = MK;\n  // ------------------------------------------------ plinth, sill, floor\n  box(X1 - X0 + .2, FLOOR - .1, D + .2, granite, 0, (FLOOR - .1) / 2, -D / 2);\n  box(X1 - X0 + .1, .12, .22, darkWood, 0, FLOOR - .05, -.08);                  // dodai sill\n  // back mass (hidden but casts shadow / blocks light)\n  box(X1 - X0, WALL - FLOOR, D - .3, yakisugi, 0, (WALL + FLOOR) / 2, -D / 2 - .15);\n\n  // ------------------------------------------------ front wall, bay by bay\n  const posts = [-5.4, -3.6, -1.8, 0, 1.8, 3.6, 5.4];\n  for (const x of posts) box(.16, WALL - FLOOR + .1, .18, darkWood, x, (WALL + FLOOR) / 2, .02);\n  box(X1 - X0 + .2, .16, .2, darkWood, 0, 2.42, .03);                              // nageshi (lintel)\n  box(X1 - X0 + .3, .22, .24, darkWood, 0, WALL - .02, .02);                        // eave beam\n  // bays 1-2: shoji sliding panels behind glass, transom lattice above\n  for (let b = 0; b \u003c 2; b++) {\n    const bx = -5.4 + b * 1.8;\n    for (let k = 0; k \u003c 2; k++) {\n      const px = bx + .08 + k * .86 + .43, sh = mesh(new THREE.PlaneGeometry(.86, 2.38 - FLOOR - .04), shoji, px, (2.34 + FLOOR) / 2 + .02, -.06, false);\n      box(.86, .05, .05, darkWood, px, 2.34, -.03);\n    }\n    // ranma: lattice over glow\n    mesh(new THREE.PlaneGeometry(1.66, .42), warm, bx + .9, 2.72, -.1, false);\n    for (let s = 0; s \u003c 14; s++) box(.03, .42, .04, darkWood, bx + .15 + s * .11, 2.72, -.04);\n  }\n  // bay 3: plaster with a round window (marumado)\n  const bx3 = -1.8;\n  const circ = new THREE.Shape(); circ.moveTo(bx3, FLOOR); circ.lineTo(bx3 + 1.8, FLOOR); circ.lineTo(bx3 + 1.8, 2.34); circ.lineTo(bx3, 2.34); circ.closePath();\n  const hole = new THREE.Path(); hole.absarc(bx3 + .9, 1.58, .5, 0, Math.PI * 2, true); circ.holes.push(hole);\n  const pw = mesh(new THREE.ShapeGeometry(circ, 48), plaster, 0, 0, -.03, false);\n  const mw = mesh(new THREE.CircleGeometry(.5, 48), shoji, bx3 + .9, 1.58, -.1, false);\n  mw.material = shoji.clone(); mw.material.map = shojiT.clone(); mw.material.map.repeat.set(1.6, .8); mw.material.map.needsUpdate = true; mw.material.emissiveMap = mw.material.map;\n  const ring = mesh(new THREE.TorusGeometry(.5, .035, 10, 64), darkWood, bx3 + .9, 1.58, -.02);\n  for (let k = -2; k \u003c= 2; k++) { box(.022, Math.sqrt(Math.max(0, .25 - (k * .18) ** 2)) * 2, .03, darkWood, bx3 + .9 + k * .18, 1.58, -.05); }\n  // bay 4: entrance (genkan) — sliding koshi-do lattice doors over warm li im from the horizon\n  scene.add(new THREE.HemisphereLight(0xb4a2c8, 0x4a3024, 1.0));\n  const key = new THREE.DirectionalLight(0xffb070, 3.2);\n  key.position.copy(mSun).multiplyScalar(40); key.castShadow = true; key.shadow.mapSize.set(1024, 1024);\n  Object.assign(key.shadow.camera, { left: -14, right: 14, top: 12, bottom: -8, near: 1, far: 90 });\n  scene.add(key);\n  const fill = new THREE.DirectionalLight(0x9aa9c9, .8); fill.position.set(18, 10, 22); scene.add(fill);\n\n  const cam = new THREE.PerspectiveCamera(34, .66, .1, 400);\n  // hover: the camera swings round the house toward the cursor, drag orbits further; a hand light follows the cursor\n  const mRig = pointerRig(document.querySelector('[data-view=\"modern\"]').parentElement, { yaw: .5, pitch: .2, dragYaw: 1.6, dragPitch: .3, minYaw: -.55, maxYaw: .5 });\n  const mLight = cursorFlashlight(scene, { intensity: 320, angle: .2, distance: 80 });\n  scene.add(cam); moon.visible = false; trail.visible = false;\n  addView('modern', {\n    dprCap: 1.5,\n    cine: { sunDir: mSun, exposure: 1.15, bloom: .08, bloomTh: 2.6, rays: 0, haze: 0xa07060, hazeK: .007, hazeStart: 26, hazeSun: 1.2, sunCol: 0xffa050, dof: .25, focus: 26, focusRange: 30, ao: .8, aoRadius: .5, aoIntensity: 1.2, vignette: .35, warm: .2, lift: .8, sat: 1.08, contrast: 1.06, grain: .024 },\n    draw(t, dt, v) {\n      T_UNI.value = t;\n      const z = STATE.uspZoom[0], par = STATE.uspPar[0];\n      // photo solve: f = 707px for a 507px-tall tile, horizon at 70% down,\n      // camera 26m out, 25deg round toward the gable, eye height 1m\n      const W = v.w, H = v.h, f = 707 * (H / 507) * z * 1.16;\n      const py = H * (0.74 - par * 0.05);\n      const fullH = 2 * Math.max(py, H - py);\n      cam.fov = 2 * Math.atan(fullH / 2 / f) * 180 / Math.PI;\n      cam.aspect = W / fullH;\n      cam.setViewOffset(W, fullH, 0, fullH / 2 - py, W, H);\n      mRig.update(dt);\n      const az = 0.44 + PTR.sx * 0.03 + mRig.yaw, el = mRig.pitch;\n      cam.positi , P: .5, HIP: 1.75, T: 1.6 };\nS3H.YE = S3H.H2 + .2; S3H.XE = S3H.L / 2 + S3H.OV; S3H.ZE = S3H.D / 2 + S3H.OV;\nS3H.XG = S3H.XE - S3H.HIP; S3H.ZG = S3H.ZE - S3H.HIP; S3H.YG = S3H.YE + S3H.HIP * S3H.P; S3H.YR = S3H.YE + S3H.ZE * S3H.P;\nconst S3_REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n/* ------------------------------------------------------------ batching\n   Static parts are collected per material and merged: a house is a\n   handful of draw calls however many boards and battens it has. */\nfunction s3Batch() {\n  const G = new Map(), m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), one = new THREE.Vector3(1, 1, 1);\n  const prep = g => {\n    const h = g.index ? g.toNonIndexed() : g.clone();\n    for (const k of Object.keys(h.attributes)) if (k !== 'position' && k !== 'normal' && k !== 'uv') h.deleteAttribute(k);\n    if (!h.attributes.normal) h.computeVertexNormals();\n    if (!h.attributes.uv) h.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(h.attributes.position.count * 2), 2));\n    h.clearGroups();\n    return h;\n  };\n  return {\n    add(geo, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, M = null) {\n      const g = prep(geo); geo.dispose();\n      m4.compose(p.set(x, y, z), q.setFromEuler(e.set(rx, ry, rz)), one);\n      if (M) m4.premultiply(M);\n      g.applyMatrix4(m4);\n      if (!G.has(mat)) G.set(mat, []);\n      G.get(mat).push(g);\n      return g;\n    },\n    box(w, h, d, mat, x, y, z, M = null, rx = 0, ry = 0, rz = 0) { return this.add(new THREE.BoxGeometry(w, h, d), mat, x, y, z, rx, ry, rz, M); },\n    // a cylinder between two points\n    rod(a, b, r, mat, seg = 8, M = null) {\n      const A = new THREE.Vector3(...a), Bv = new THREE.Vector3(...b), d = Bv.clone().sub(A), len = d.length();\n      const g = new THREE.CylinderGeometry(r, r, len, seg, 1, false);\n      g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()));\n      g.translate((A.x + Bv.x) / 2, (A.y + Bv.y) / 2, (A.z + Bv.z) / 2);\n      return this.add(g, mat, 0, 0, 0, 0, 0, 0, M);\n    },\n    flush(parent, { noCast = [], noReceive = [] } = {}) {\n      const out = [];\n      for (const [mat, list] of G) {\n        const mesh = new THREE.Mesh(mergeGeometries(list), mat);\n        mesh.castShadow = !noCast.includes(mat) && !mat.transparent; mesh.receiveShadow = !noReceive.includes(mat);\n        parent.add(mesh); out.push(mesh);\n        list.forEach(g => g.dispose());\n      }\n      G.clear();\n      return out;\n    }\n  };\n}\n\n// merge every mesh under a group into one mesh per material (multi-material boxes split by group):\n// the kit's panel array is ten six-group boxes, sixty draw calls a pass; merged it is two\nfunction s3MergeMeshes(grp) {\n  grp.updateMatrixWorld(true);\n  const inv = grp.matrixWorld.clone().invert(), lists = new Map(), meshes = [];\n  grp.traverse(o => { if (o.isMesh) meshes.push(o); });\n  for (const m of meshes) {\n    const M = new THREE.Matrix4().multiplyMatrices(inv, m.matrixWorld), src = m.geometry, idx = src.index;\n    const mats = Array.isArray(m.material) ? m.material : [m.material];\n    const groups = Array.isArray(m.material) && src.groups.length ? src.groups : [{ start: 0, count: idx ? idx.count : src.attributes.position.count, materialIndex: 0 }];\n    for (const gr of groups) {\n      const sub = new THREE.BufferGeometry();\n      for (const name of ['position', 'normal', 'uv']) {\n        const a = src.attributes[name]; if (!a) continue;\n        const arr = new Float32Array(gr.count * a.itemSize);\n        for (let i = 0; i \u003c gr.count; i++) { const vi = idx ? idx.getX(gr.start + i) : gr.start + i; for (let k = 0; k \u003c a.itemSize; k++) arr[i * a.itemSize + k] = a.array[vi * a.itemSize + k]; }\n        sub.setAttribute(name, new THREE.BufferAttribute(arr, a.itemSize));\n      }\n      sub.applyMatrix4(M);\n      const mat = mats[gr.materialIndex];\n      if (!lists.has(mat)) lists.set(mat, []); lists.get(mat).push(sub);\n    }\n  }\n  for (const m of meshes) m.parent.remove(m);\n  for (const [mat, list] of lists) { const mm = new THREE.Mesh(mergeGeometries(list), mat); mm.castShadow = mm.receiveShadow = true; grp.add(mm); list.forEach(g => g.dispose()); }\n  return grp;\n}\n// objects kept out of the mirror pass (the mirror camera sees layer 0 only)\nfunction s3NoMirror(...objs) { for (const o of objs) o.traverse(k => k.layers.set(1)); }\n// a convex planar polygon with uv from a basis (metres / T); flipped to face `out`\nfunction s3Poly(pts, o, uAx, vAx, T, out) {\n  const pos = [], uv = [];\n  const pr = (p, a) => ((p[0] - o[0]) * a[0] + (p[1] - o[1]) * a[1] + (p[2] - o[2]) * a[2]) / T;\n  const a = new THREE.Vector3(...pts[0]), b = new THREE.Vector3(...pts[1]), c = new THREE.Vector3(...pts[2]);\n  const flip = b.clone().sub(a).cross(c.clone().sub(a)).dot(new THREE.Vector3(...out)) \u003c 0;\n  for (let i = 1; i \u003c pts.length - 1; i++) {\n    const tri = flip ? [pts[0], pts[i + 1], pts[i]] : [pts[0], pts[i], pts[i + 1]];\n    for (const p of tri) { pos.push(...p); uv.push(pr(p, uAx), pr(p, vAx)); }\n  }\n  const g = new THREE.BufferGeometry();\n  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));\n  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));\n  g.computeVertexNormals();\n  return g;\n}\n\n// facade frame: local (u along the wall, v up, n out of it) -> house space\nfunction s3Face(face, y0 = 0, L = S3H.L, D = S3H.D) {\n  const ry = { front: 0, right: Math.PI / 2, back: Math.PI, left: -Math.PI / 2 }[face];\n  const o = { front: [-L / 2, y0, D / 2], right: [L / 2, y0, D / 2], back: [L / 2, y0, -D / 2], left: [-L / 2, y0, -D / 2] }[face];\n  return new THREE.Matrix4().compose(new THREE.Vector3(...o), new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), ry), new THREE.Vector3(1, 1, 1));\n}\n// wall slab with rectangular openings, outer face at n = 0, uv in metres\nfunction s3WallGeo(w, h, holes, t) {\n  const V = THREE.Vector2, sh = new THREE.Shape([new V(0, 0), new V(w, 0), new V(w, h), new V(0, h)]);\n  for (const [u0, v0, u1, v1] of holes) sh.holes.push(new THREE.Path([new V(u0, v0), new V(u1, v0), new V(u1, v1), new V(u0, v1)]));\n  const g = new THREE.ExtrudeGeometry(sh, { depth: t, bevelEnabled: false, curveSegments: 1 });\n  g.translate(0, 0, -t);\n  return g;\n}\n\n/* ------------------------------------------------------ painted glows */\n// a lamp-lit tatami room seen through a window: plaster wall, fusuma, a pendant shade\nfunction s3RoomTexture(seed = 1, kind = 0) {\n  rand(seed * 131 + 17);\n  const c = makeCanvas(256, 192), g = c.getContext('2d'), W = 256, H = 192;\n  const lx = W * (.3 + rand() * .4);\n  const gr = g.createRadialGradient(lx, H * .22, 4, lx, H * .4, W * .75);\n  gr.addColorStop(0, '#fff0d0'); gr.addColorStop(.35, '#f2c48a'); gr.addColorStop(1, '#8a5a30');\n  g.fillStyle = gr; g.fillRect(0, 0, W, H);\n  if (kind === 0) {\n    // fusuma: two paper doors with dark frames and round pulls\n    const fx = W * (.08 + rand() * .2), fw = W * .5;\n    g.fillStyle = 'rgba(60,34,18,.85)'; g.fillRect(fx - 3, H * .2, fw + 6, H * .8);\n    g.fillStyle = 'rgba(236,214,176,.9)'; g.fillRect(fx, H * .23, fw / 2 - 2, H * .77); g.fillRect(fx + fw / 2 + 2, H * .23, fw / 2 - 2, H * .77);\n    g.fillStyle = 'rgba(120,90,60,.35)'; for (let k = 0; k \u003c 5; k++) { g.beginPath(); g.ellipse(fx + rand() * fw, H * (.35 + rand() * .4), 10 + rand() * 12, 4 + rand() * 4, 0, 0, 7); g.fill(); }\n    g.fillStyle = 'rgba(40,24,12,.8)'; g.beginPath(); g.arc(fx + fw / 2 - 12, H * .62, 3, 0, 7); g.arc(fx + fw / 2 + 12, H * .62, 3, 0, 7); g.fill();\n  } else {\n    // shelves and a tansu in the lamp light\n    g.fillStyle = 'rgba(70,40,20,.8)'; g.fillRect(W * .6, H * .45, W * .3, H * .55);\n    g.fillStyle = 'rgba(150,100,60,.6)'; for (let k = 0; k \u003c 4; k++) g.fillRect(W * .62, H * (.5 + k * .12), W * .26, H * .08);\n  }\n  // the pendant shade and its pool on the ceiling\n  g.fillStyle = 'rgba(255,248,230,1)'; g.beginPath(); g.ellipse(lx, H * .14, 22, 10, 0, 0, 7); g.fill();\n  g.fillStyle = 'rgba(60,34,18,.6)'; g.fillRect(lx - 1, 0, 2, H * .1);\n  // tatami edge and the floor in shadow\n  g.fillStyle = 'rgba(70,52,26,.55)'; g.fillRect(0, H * .9, W, H * .1);\n  return c;\n}\n// a wooded ridge as an alpha silhouette: rolling hill, cedar spires and rounded crowns along the top\nfunction s3Treeline(seed, { w = 2048, h = 320, col = [18, 26, 30], spire = .6 } = {}) {\n  rand(seed * 71 + 5);\n  const c = makeCanvas(w, h), g = c.getContext('2d');\n  const base = x => h * (.62 - .16 * fbm(x / w * 3 + seed, seed * .7, 3) - .06 * Math.sin(x / w * 6.28 * 1.3 + seed));\n  g.fillStyle = `rgb(${col})`;\n  g.beginPath(); g.moveTo(0, h); for (let x = 0; x \u003c= w; x += 8) g.lineTo(x, base(x)); g.lineTo(w, h); g.fill();\n  for (let x = -20; x \u003c w + 20; x += 5 + rand() * 9) {\n    const y = base(x) + 6, v = .85 + rand() * .3;\n    g.fillStyle = `rgb(${col.map(k => k * v | 0)})`;\n    if (rand() \u003c spire) { const hh = 22 + rand() * 46, ww = 7 + rand() * 7; g.beginPath(); g.moveTo(x - ww, y); for (let k = 0; k \u003c= 6; k++) { const t = k / 6; g.lineTo(x + (k % 2 ? -1 : 1) * ww * (1 - t) * .9, y - hh * t); } g.lineTo(x + ww, y); g.fill(); }\n    else { const r = 10 + rand() * 18; g.beginPath(); g.arc(x, y - r * .6, r, 0, 7); g.arc(x + r * .7, y - r * .3, r * .7, 0, 7); g.fill(); }\n  }\n  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;\n  return t;\n}\n// a stone resting on the ground: stoneGeometry lifted so its base is flat and 1 cm sunk\nfunction s3Stone(rx, ry, rz, seed, detail = 2) {\n  const g = stoneGeometry(rx, ry, rz, seed, detail), p = g.attributes.position;\n  let lo = Infinity; for (let i = 0; i \u003c p.count; i++) lo = Math.min(lo, p.getY(i));\n  const base = lo + ry * .12;\n  for (let i = 0; i \u003c p.count; i++) p.setY(i, Math.max(p.getY(i), base) - base - .01);\n  g.computeVertexNormals();\n  return g;\n}\n// glass keeps its environment reflection but takes no highlight from the lamps (no glints)\nfunction s3NoGlint(m) {\n  m.onBeforeCompile = sh => { sh.fragmentShader = sh.fragmentShader.replace('#include \u003clights_fragment_end>', '#include \u003clights_fragment_end>\\n reflectedLight.directSpecular = vec3(0.0);'); };\n  m.customProgramCacheKey = () => 's3noglint';\n  return m;\n}\nfunction s3Canvas(c) { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }\n\n/* ------------------------------------------------------- the farmhouse\n   o.tint: tile colour (linear multiplier over the grey kawara photo)\n   o.lit:  windows have lamp-lit rooms behind them (else dark glass)\n   Returns { root, glows: [{order, set(k)}], lamps: [{light, base, order}] } */\nfunction s3House(env, o = {}) {\n  const { L, D, F0, H1, H2, OV, P, T, YE, XE, ZE, XG, ZG, YG, YR } = S3H;\n  const root = new THREE.Group(), B = s3Batch();\n  const wet = o.wet || 0, lit = o.lit !== false;\n  rand((o.seed || 1) * 977 + 3);\n  // ---------------------------------------------------------------- materials\n  const tile = new THREE.MeshStandardMaterial({ map: ptex('kawara_c', true), normalMap: ptex('kawara_n'), roughnessMap: ptex('kawara_r'), aoMap: ptex('kawara_r'), aoMapIntensity: .9,\n    color: new THREE.Color().setRGB(...(o.tint || [1.45, .6, .4])), roughness: lerp(.75, .42, wet), metalness: .15, envMap: env, envMapIntensity: lerp(1.1, 1.8, wet) });\n  tile.normalScale.set(1.3, 1.3);\n  const glaze = new THREE.MeshStandardMaterial({ color: new THREE.Color().setRGB(...(o.tint || [1.45, .6, .4])).multiplyScalar(.14), roughness: lerp(.72, .5, wet), metalness: .1, envMap: env, envMapIntensity: lerp(.9, 1.5, wet) });\n  const timber = boxMat('darkwood', { scale: .55, env, envI: lerp(.5, 1, wet), nScale: 1.1, rough: lerp(1, .7, wet) });\n  const plaster = box these scenes reseed it for their own\n// draws and then put it back exactly where they found it, so everything built after them is unchanged\nconst S1_M = 2147483647n, S1_INV = 1407677000n;           // 16807^-1 mod 2^31-1\nfunction s1RandSave() { return BigInt(Math.round(rand() * 2147483646 + 1)); }\nfunction s1RandRestore(s1) { const s0 = s1 * S1_INV % S1_M; rand(Number(s0 * S1_INV % S1_M)); }\nconst S1_REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n// the USP tiles' entry motion, from the tile's own rect\nfunction s1Entry(v) {\n  if (S1_REDUCE || !v.rect) return { z: 1, par: 0 };\n  const r = v.rect, VH = VP.h;\n  return { z: 1 + .22 * (1 - E.outCubic(inv(VH, VH * .25, r.top))), par: (r.top + r.height / 2 - VH / 2) / VH };\n}\n// vertical fov for a design aspect: narrower tiles widen it so the width still fits, then the zoom\nfunction s1Fov(fov, aspect, design, z) {\n  let t = Math.tan(fov * Math.PI / 360);\n  if (aspect \u003c design) t *= design / aspect;\n  return Math.atan(t / z) * 360 / Math.PI;\n}\n\n/* ------------------------------------------------------------- textures */\n// ishidatami: granite setts in running bond over the photographic granite\nfunction s1PavingTexture() {\n  const W = 1024, c = makeCanvas(W, W), g = c.getContext('2d', { willReadFrequently: true }), hc = makeCanvas(W, W), hg = hc.getContext('2d', { willReadFrequently: true });\n  rand(4101);\n  g.drawImage(TIMG.granite_c, 0, 0, W, W);\n  hg.fillStyle = '#1c1c1c'; hg.fillRect(0, 0, W, W);\n  const rows = 10, rh = W / rows, joint = 5;\n  for (let r = 0; r \u003c rows; r++) {\n    let x = -rand() * rh * 2;\n    while (x \u003c W) {\n      const sw = rh * (1.4 + rand() * 1.2), v = .78 + rand() * .3, warm = (rand() - .5) * 18, hv = 170 + rand() * 50 | 0;\n      const tilt = (rand() - .5) * 40;\n      for (const xx of [x, x - W]) {\n        const y0 = r * rh;\n        g.globalCompositeOperation = 'multiply';\n        g.fillStyle = `rgb(${clamp(255 * v + warm, 0, 255) | 0},${clamp(250 * v, 0, 255) | 0},${clamp(240 * v - warm, 0, 255) | 0})`;\n        g.fillRect(xx + joint / 2, y0 + joint / 2, sw - joint, rh - joint);\n        g.globalCompositeOperation = 'source-over';\n        // worn top: each sett dished a little, edges rounded off\n        const hgr = hg.createLinearGradient(xx, y0, xx + sw, y0 + rh);\n        hgr.addColorStop(0, `rgb(${hv + tilt | 0},${hv + tilt | 0},${hv + tilt | 0})`); hgr.addColorStop(1, `rgb(${hv - tilt | 0},${hv - tilt | 0},${hv - tilt | 0})`);\n        hg.fillStyle = 'rgb(90,90,90)'; hg.fillRect(xx + joint / 2 - 1, y0 + joint / 2 - 1, sw - joint + 2, rh - joint + 2);\n        hg.fillStyle = hgr; hg.fillRect(xx + joint / 2 + 2, y0 + joint / 2 + 2, sw - joint - 4, rh - joint - 4);\n      }\n      x += sw;\n    }\n  }\n  // joints: dark grit\n  const id = g.getImageData(0, 0, W, W), d = id.data, hd = hg.getImageData(0, 0, W, W).data;\n  for (let i = 0; i \u003c d.length; i += 4) {\n    const h = hd[i] / 255, j = h \u003c .2 ? .42 : 1;\n    const n = (Math.random() - .5) * 10;\n    d[i] = d[i] * j + n; d[i + 1] = d[i + 1] * j + n; d[i + 2] = d[i + 2] * j + n;\n  }\n  g.putImageData(id, 0, 0);\n  return { map: c, height: hc };\n}\n// weathered sugi clapboard: the photographic dark boards turned so the grain runs along,\n// lifted to silver-brown; four boards in the atlas, one per row of the wall\nfunction s1CedarTexture() {\n  const W = 1024, c = makeCanvas(W, W), g = c.getContext('2d', { willReadFrequently: true });\n  g.save(); g.translate(W, 0); g.rotate(Math.PI / 2); g.drawImage(TIMG.darkwood_c, 0, 0, W, W); g.restore();\n  rand(4203);\n  const id = g.getImageData(0, 0, W, W), d = id.data;\n  const tints = [...Array(4)].map(() => [1 + (rand() - .5) * .12, 1 + (rand() - .5) * .08, 1 + (rand() - .5) * .1, .92 + rand() * .16]);\n  const hc = makeCanvas(W, W), hg = hc.getContext('2d', { willReadFrequently: true }), hid = hg.createImageData(W, W), h = hid.data;\n  for (let y = 0; y \u003c W; y++) {\n    const );\n  return c;\n}\n// indigo han-noren with the mark in undyed white\nfunction s1NorenTexture() {\n  const c = makeCanvas(512, 320), g = c.getContext('2d');\n  g.fillStyle = '#1d2748'; g.fillRect(0, 0, 512, 320);\n  rand(4409);\n  for (let i = 0; i \u003c 700; i++) { g.fillStyle = `rgba(${rand() \u003c .5 ? '10,14,30' : '60,72,110'},${.05 + rand() * .08})`; if (rand() \u003c .5) g.fillRect(rand() * 512, 0, 1, 320); else g.fillRect(0, rand() * 320, 512, 1); }\n  drawMark(g, 256, 158, 170, { sun: '#efe8dc', sea: '#efe8dc' });\n  // a darker band where the cloth is folded over the rod\n  const gr = g.createLinearGradient(0, 0, 0, 40); gr.addColorStop(0, 'rgba(0,0,0,.45)'); gr.addColorStop(1, 'rgba(0,0,0,0)');\n  g.fillStyle = gr; g.fillRect(0, 0, 512, 40);\n  return c;\n}\nfunction s1LanternTexture() {\n  return paint(256, 256, (g, W, H) => {\n    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#eecf9c'); gr.addColorStop(.5, '#fff1d2'); gr.addColorStop(1, '#ecc990');\n    g.fillStyle = gr; g.fillRect(0, 0, W, H);\n    g.strokeStyle = 'rgba(110,64,26,.32)'; g.lineWidth = 2; for (let y = 6; y \u003c H; y += 13) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }\n  });\n}\n\n// the kit's petals are near-white in linear light; in low warm sun they read as bright specks,\n// so these tiles give them a deeper blossom pink (colour only, no random stream)\nfunction s1PetalTone(mesh, l) {\n  const c = new THREE.Color();\n  for (let i = 0; i \u003c mesh.count; i++) { c.setHSL(.955 + (i % 7) * .006, .62, l + (i % 5) * .03, THREE.SRGBColorSpace); mesh.setColorAt(i, c); }\n  mesh.instanceColor.needsUpdate = true;\n}\n\n/* ================================================================ s1Solar */\nfunction initS1Solar() {\n  const el = document.querySelector('[data-view=\"s1Solar\"]');\n  if (!el) return null;\n  const rs = s1RandSave();\n  // the sun is low behind the viewer's left shoulder: it rakes the lattice and the plaster gable,\n  // and the > q.dispose()); return add(new THREE.Mesh(g, mat), cast, parent); };\n  const at = (geo, x, y, z) => geo.translate(x, y, z);\n\n  /* ---------------------------------------------- one machiya on the row\n     facade on z = 0 facing the lane (+z); roof ridge parallel to the lane */\n  function machiya({ x0, x1, Y0, p = .45, D = 9, ov = .78, hisY = 3.05, door = 'right', upper = 'mushiko', panels = false, noren = false, lantern = false, wall = plaster, verge = [true, true] }) {\n    const W = x1 - x0, cx = (x0 + x1) / 2, a = Math.atan(p), ca = Math.cos(a), sa = Math.sin(a);\n    const wallTop = Y0 - .36;\n    // body (hidden behind the facade, it carries shadows and closes the gaps)\n    box(W - .02, wallTop - .1, D - .3, wall, cx, (wallTop - .1) / 2 + .05, -D / 2 - .15);\n    box(W, .14, .3, granite, cx, .07, .12);                                                  // stone curb\n    // ---- ground floor: posts, head beam, lattice, door\n    const xd = door === 'right' ? x1 - 1.75 : x0 + 1.75;                                    // door jamb\n    const lat0 = door === 'right' ? x0 + .17 : xd + .09, lat1 = door === 'right' ? xd - .09 : x1 - .17;\n    const dr0 = door === 'right' ? xd + .09 : x0 + .17, dr1 = door === 'right' ? x1 - .17 : xd - .09;\n    for (const x of [x0 + .08, xd, x1 - .08]) box(.16, hisY - .14, .17, bengara, x, (hisY - .14) / 2 + .14, .0);\n    box(W, .16, .18, bengara, cx, 2.34, .0);                                                 // head beam\n    box(W, hisY - 2.42, .06, dark, cx, (hisY + 2.42) / 2, -.04);                             // board band under the pent roof\n    // kyo-goshi: thick full-height bars with short thin ones hung between them from the top rail\n    // (painted as a mipmapped texture: at this distance modelled bars shimmer into moire)\n    const lw = lat1 - lat0;\n    box(lw, .1, .14, bengara, (lat0 + lat1) / 2, .19 + .05, .03);                            // sill\n    const lm = new THREE.MeshStandardMaterial({ map: latMap.clone(), emissiveMap: latMask.clone(), emissive: new THREE.Color(1, .56, .26).multiplyScalar(.85), roughness: .85, envMap: env, envMapIntensity: .3 });\n    const reps = Math.round(lw / .09);\n    for (const t of [lm.map, lm.emissiveMap]) { t.repeat.set(reps, 1); t.needsUpdate = true; }\n    mesh(new THREE.PlaneGeometry(lw - .02, 1.98), lm, (lat0 + lat1) / 2, 1.28, .05, false);\n    // entrance: a sliding lattice door with the lit genkan behind\n    const dw = dr1 - dr0;\n    mesh(new THREE.PlaneGeometry(dw, 2.1), glowDoor, (dr0 + dr1) / 2, 1.19, -.2, false);\n    const dbars = [at(new THREE.BoxGeometry(dw * .52, .05, .05), dr0 + dw * .26, 2.2, -.12), at(new THREE.BoxGeometry(dw * .52, .05, .05), dr0 + dw * .26, .2, -.12)];\n    for (let k = 0; k \u003c= 7; k++) dbars.push(at(new THREE.BoxGeometry(.028, 2.0, .04), dr0 + .02 + k * (dw * .52 - .04) / 7, 1.2, -.12));\n    for (let k = 0; k \u003c 4; k++) dbars.push(at(new THREE.BoxGeometry(dw * .52, .022, .035), dr0 + dw * .26, .7 + k * .45, -.13));\n    merged(dbars, dark);\n    box(dw, .12, .5, granite, (dr0 + dr1) / 2, .06, .05);                                     // threshold stone\n    if (noren) {\n      // han-noren on a bamboo rod: three panels with a soft wave\n      const rod = mesh(new THREE.CylinderGeometry(.018, .018, dw + .16, 8), bambooDark, (dr0 + dr1) / 2, 2.19, .15);\n      rod.rotation.z = Math.PI / 2;\n      for (const x of [dr0 - .02, dr1 + .02]) box(.03, .06, .07, dark, x, 2.19, .1);           // hooks into the posts\n      const nt = new THREE.CanvasTexture(s1NorenTexture()); nt.colorSpace = THREE.SRGBColorSpace; nt.anisotropy = 8;\n      const nm = new THREE.MeshStandardMaterial({ map: nt, roughness: .95, side: THREE.DoubleSide });\n      const pw = (dw + .04) / 3;\n      for (let k = 0; k \u003c 3; k++) {\n        const geo = new THREE.PlaneGeometry(pw - .03, .92, 8, 6), pp = geo.attributes.position, uv = geo.attributes.uv;\n        for (let i = 0; i \u003c pp.count; i++) {\n          const u = pp.ge + .016);\n        tubes.push(tie);\n      }\n      merged(tubes, bambooDark);\n    }\n    // ---- pent roof (ichi-kai hisashi) with its copper gutter\n    const hp = .32, hl = 1.0, ha = Math.atan(hp);\n    const hs = box(W + .02, .07, hl / Math.cos(ha), kawara, cx, hisY - hl / 2 * hp + .02, hl / 2 - .03);\n    hs.rotation.x = ha;\n    const gut = mesh(new THREE.CylinderGeometry(.055, .055, W, 12, 1, true, 0, Math.PI), copper, cx, hisY - hl * hp - .03, hl - .02);\n    gut.rotation.set(Math.PI, 0, Math.PI / 2); gut.material.side = THREE.DoubleSide;\n    // ---- upper floor\n    const u0 = hisY + .03, uh = wallTop - u0;\n    for (const x of [x0 + .06, x1 - .06]) box(.12, uh + .02, .2, bengara, x, u0 + uh / 2, -.02);\n    if (upper === 'mushiko') {\n      const sh = new THREE.Shape();\n      sh.moveTo(x0 + .12, u0); sh.lineTo(x1 - .12, u0); sh.lineTo(x1 - .12, wallTop); sh.lineTo(x0 + .12, wallTop); sh.closePath();\n      const wins = W > 5 ? [cx - W * .22, cx + W * .22] : [cx];\n      const ww = Math.min(1.35, W * .3), wh = .66, wy = u0 + uh * .5;\n      for (const wx of wins) { const hole = new THREE.Path(); hole.moveTo(wx - ww / 2, wy - wh / 2); hole.lineTo(wx - ww / 2, wy + wh / 2); hole.lineTo(wx + ww / 2, wy + wh / 2); hole.lineTo(wx + ww / 2, wy - wh / 2); hole.closePath(); sh.holes.push(hole); }\n      const wg = new THREE.ExtrudeGeometry(sh, { depth: .2, bevelEnabled: false });\n      mesh(wg, wall, 0, 0, -.2);\n      const slats = [];\n      for (const wx of wins) {\n        const ns = Math.round(ww / .13);\n        for (let k = 1; k \u003c ns; k++) slats.push(at(new THREE.BoxGeometry(.07, wh, .13), wx - ww / 2 + k * ww / ns, wy, -.1));\n        mesh(new THREE.PlaneGeometry(ww, wh), dim, wx, wy, -.19, false);\n      }\n      merged(slats, wall);\n    } else {\n      // dark boarded upper floor with a sudare blind over a lit window\n      box(W - .24, uh, .08, dark, cx, u0 + uh / 2, -.04);\n      const sw = Math.min(2.2, W * .45), sy = u0 + uh * .52;\n      mes  value: new THREE.Color(1.6, .7, .28) }, uFogCol: { value: new THREE.Color(.75, .47, .42) }, uSeaCol: { value: new THREE.Color(.36, .2, .11) } };\n  const wingM = gullMaterial({ vertexColors: true, roughness: .75, side: THREE.DoubleSide }, uni);\n  const bodyM = gullMaterial({ color: 0xece8e4, roughness: .8, side: THREE.DoubleSide }, uni);\n  const billM = gullMaterial({ color: 0xe0aa3a, roughness: .5 }, uni);\n  g.add(new THREE.Mesh(G.body, bodyM), new THREE.Mesh(G.tail, bodyM), new THREE.Mesh(G.bill, billM));\n  // each wing: a skinned mesh with a shoulder and a wrist bone, so the wing bends smoothly at the carpal joint\n  const side = sx => {\n    const mesh = new THREE.SkinnedMesh(sx > 0 ? G.L : G.R, wingM);\n    const shoulder = new THREE.Bone(), wrist = new THREE.Bone();\n    shoulder.position.set(sx * .045, .03, -.07); wrist.position.set(sx * GULL.wrist, 0, 0);\n    shoulder.add(wrist); mesh.add(shoulder); mesh.bind(new THREE.Skeleton([shoulder, wrist]));\n    g.add(mesh);\n    return { shoulder, wrist };\n  };\n  g.userData = { L: side(1), R: side(-1), uni };\n  g.traverse(o => { if (o.isMesh) o.frustumCulled = false; });\n  return g;\n}\n\nfunction gullFlock(scene, sunDir, { count = 9 } = {}) {\n  const birds = [];\n  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;\n  for (let i = 0; i \u003c count; i++) {\n    const b = makeGull(); scene.add(b);\n    const near = i \u003c 3;\n    const d = near ? 34 + i * 12 : 80 + (i - 3) * 30 + rnd() * 20;      // centre range\n    const az = (-46 + rnd() * 50) * Math.PI / 180;\n    b.userData.f = {\n      c: new THREE.Vector3(Math.sin(az) * d, d * (.07 + rnd() * .1) + 4, -Math.cos(az) * d),\n      R: near ? 9 + rnd() * 7 : 16 + rnd() * 26, dir: rnd() \u003c .5 ? -1 : 1, th: rnd() * 6.28,\n      v: 8 + rnd() * 3, ph: rnd() * 6.28, beat: 0, flap: rnd(), s: 1.15 + rnd() * .2, bob: rnd() * 6.28,\n    };\n    birds.push(b);\n  }\n  window.__gulls = birds;\n  const q = new THREE.Quaternion( ------------------------------------------------------ torii */\nfunction makeTorii(env) {\n  const g = new THREE.Group();\n  const verm = boxMat('darkwood', { scale: .9, color: 0xff5a3a, env, envI: .35, nScale: .8, key: 'torii-verm' });\n  const black = boxMat('darkwood', { scale: .9, color: 0x2a2224, env, envI: .5, nScale: .6, key: 'torii-black' });\n  const H = 13.5, X = 5.4;\n  // hashira: a lathe with a gentle entasis\n  const pil = new THREE.LatheGeometry(Array.from({ length: 16 }, (_, i) => { const t = i / 15; return new THREE.Vector2(.56 - .08 * t - .04 * Math.sin(t * Math.PI), -1.5 + t * (H + .6)); }), 36);\n  const leg = new THREE.LatheGeometry(Array.from({ length: 10 }, (_, i) => { const t = i / 9; return new THREE.Vector2(.33 - .06 * t, -1.2 + t * 9.8); }), 24);\n  const cap = (w, d, h) => new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, Math.min(w, h, d) * .2), black);\n  for (const sx of [-1, 1]) {\n    const p = new THREE.Mesh(pil, verm); p.position.set(sx * X, 0, 0); g.add(p);\n    const nem = new THREE.Mesh(new THREE.CylinderGeometry(.66, .7, 1.3, 36), black); nem.position.set(sx * X, .15, 0); g.add(nem);   // nemaki at the waterline\n    const dai = new THREE.Mesh(new THREE.CylinderGeometry(.62, .6, .42, 36), black); dai.position.set(sx * X, H - .8, 0); g.add(dai);     // daiwa ring\n    // ryōbu: two support legs each side, leaning in, with their own black roofs, tied by two beams\n    for (const sz of [-1, 1]) {\n      const l = new THREE.Mesh(leg, verm); l.position.set(sx * X, 0, sz * 2.45); l.rotation.x = -sz * .17; g.add(l);\n      const roof = cap(1.3, 1.3, .36); roof.position.set(sx * X, 8.75, sz * 2.45 - sz * Math.sin(.17) * 8.6); g.add(roof);\n      const n2 = new THREE.Mesh(new THREE.CylinderGeometry(.4, .42, .9, 24), black); n2.position.set(sx * X, .1, sz * 2.45); g.add(n2);\n    }\n    for (const [y, d, w] of [[7.1, 5.5, .42], [2.1, 5.9, .36]]) {\n      const tie = new THREE.Mesh(new RoundedBoxGeometry(w, w * 1.1, d, 2, .05), verm); tie.position.set(sx * X, y, 0); g.add(tie);\n      for (const e of [-1, 1]) { const k = new THREE.Mesh(new THREE.BoxGeometry(w * 1.2, w * .5, .22), black); k.position.set(sx * X, y, e * (d / 2 + .05)); g.add(k); }\n    }\n    // kusabi: wedges driven through the nuki beside each pillar\n    for (const e of [-1, 1]) { const k = new THREE.Mesh(new THREE.BoxGeometry(.18, .95, .7), verm); k.position.set(sx * X + e * .72, 9.3, 0); g.add(k); }\n  }\n  // nuki: through both pillars, its ends capped\n  const nuki = new THREE.Mesh(new RoundedBoxGeometry(17.6, .82, .62, 3, .06), verm); nuki.position.y = 9.3; g.add(nuki);\n  for (const sx of [-1, 1]) { const c = new THREE.Mesh(new RoundedBoxGeometry(.2, .9, .7, 2, .04), black); c.position.set(sx * 8.85, 9.3, 0); g.add(c); }\n  // gakuzuka and the plaque (a black frame, a dark field, gilt characters)\n  const gk = new THREE.Mesh(new RoundedBoxGeometry(.75, 2.3, .5, 2, .05), verm); gk.position.y = 10.9; g.add(gk);\n  const plc = makeCanvas(128, 192), pg = plc.getContext('2d');\n  pg.fillStyle = '#141012'; pg.fillRect(0, 0, 128, 192); pg.strokeStyle = '#b89a52'; pg.lineWidth = 6; pg.strokeRect(8, 8, 112, 176);\n  pg.fillStyle = '#d9b86a'; pg.font = 'bold 58px \"Shippori Mincho\",\"Hiragino Mincho ProN\",serif'; pg.textAlign = 'center'; pg.fillText('陽', 64, 88); pg.fillText('宮', 64, 158);\n  const plT = new THREE.CanvasTexture(plc); plT.colorSpace = THREE.SRGBColorSpace;\n  const plq = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.9, .24), [black, black, black, black, new THREE.MeshStandardMaterial({ map: plT, roughness: .5, metalness: .2 }), black]);\n  plq.position.set(0, 11, .32); g.add(plq);\n  // shimaki (vermilion) under the kasagi (black): both sweep up toward the ends (sori), the kasagi's ends cut on a slant\n  const beam = (w, h, d, y, mat, sori, slant) => {\n    const s = new THREE.Shape(), n = 40, lift = x => sori * Math.pow(Math.abs(x) / (w / 2), 2.2);\n    for (let i = 0; i \u003c= n; i++) { const x = -w / 2 + w * i / n;

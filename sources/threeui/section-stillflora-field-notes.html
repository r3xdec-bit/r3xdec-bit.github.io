h3>COROLLA</h3><p>Five petals open around a golden center. Their folds and fine veins make every blossom slightly different.</p></button><button class="story-circle" data-story="root"><span class="eyebrow">IV</span><h3>VERDANT</h3><p>Beneath the flowers, dark leaves and woody stems give the arrangement its depth, rhythm, and structure.</p></button></div><div aria-hidden="true" id="world"></div><div aria-hidden="true" class="vignette"></div><dialog aria-labelledby="story-title" id="story-dialog"><button aria-label="Close note" class="dialog-close">×</button><article class="dialog-content"><span class="eyebrow" id="story-category"></span><h2 id="story-title"></h2><div id="story-body"></div><button class="story-cta dialog-done">Back to the page</button></article></dialog><p class="model-credit"><a href="https://commons.wikimedia.org/wiki/File:Body_female_realistic_by_Dan_Ulrich_(CC0).stl" rel="noopener noreferrer" target="_blank">Female form by Dan Ulrich / Blender Studio</a> · <a href="https://creativecommons.org/publicdomain/zero/1.0/" rel="noopener noreferrer" target="_blank">CC0</a> · adapted for Stillflora.</p><link href="https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/sections-release/ef0e54eb35f203196de2e5354a3728442c328e7f7705ab4bb78e612664d8ec12.txt" rel="license"/></section></main><script defer="" src="./runtime.js"></script><script>(()=>{const root=document.querySelector('[data-section-root]'),life=new AbortController();const listen=(target,type,fn,options={})=>target.addEventListener(type,fn,{...options,signal:life.signal});let dead=false;listen(window,'pagehide',()=>{dead=true;life.abort()},{once:true});
const stories={"light": {"category": "Field notes / I", "title": "Lucent", "paragraphs": ["Light arrives at the edge of the glass before it reaches the flowers. A narrow reflection traces the curve, then softens into the pale petals behind it.", "Lucent is a study of these overlapping surfaces: polished crystal, thin botanical fibers, and the pockets of clear air that let us see through them."]}, "water": {"category": "Field notes / II", "title": "Dewfall", "paragraphs": ["A drop of water turns an ordinary leaf into a lens. Within its curved surface, nearby colors gather and the garden appears in miniature.", "Dewfall follows that same quiet distortion through glass. Familiar stems bend at the edge of the form, while a distant blossom seems to draw closer."]}, "petal": {"category": "Field notes / III", "title": "Corolla", "paragraphs": ["A corolla is the ring of petals around a flower. In this study, pale folds open around a warm center, each one catching a slightly different amount of light.", "Some edges curl inward. Others become almost transparent. Together, those small variations give the blossom a softness that a perfect outline could never hold."]}, "root": {"category": "Field notes / IV", "title": "Verdant", "paragraphs": ["The flowers draw the eye first. Beneath them, the leaves and stems do quieter work: setting the rhythm, carrying the weight, and giving the pale petals something dark to rest against.", "Verdant looks at this supporting structure. Follow one woody line from the shoulder into the neck and notice how many small decisions of growth it contains."]}};

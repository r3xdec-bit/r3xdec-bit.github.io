<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURAL Material Field · ThreeUI</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0e}canvas{display:block;width:100%;height:100%;touch-action:none}nav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:#111b;border:1px solid #ffffff24;border-radius:14px;padding:8px}button,select{font:12px system-ui;color:#eee;background:#ffffff12;border:0;border-radius:8px;padding:9px 14px}button:hover,select:hover{background:#ffffff26}button:focus-visible,select:focus-visible{outline:2px solid #d4bc90}option{background:#161b1e}</style></head><body><canvas aria-label="Interactive AURAL material background"></canvas><nav aria-label="Background controls"><select aria-label="Material"><option>Intro</option><option>Turn</option><option>Glass</option><option>Leather</option><option>Motion</option><option>Layers</option><option>Cushion</option><option>Details</option><option>Register</option></select><button>Reset</button></nav><script type="module">import {mountBackground} from './background.js';const canvas=document.querySelector('canvas');const field=mountBackground(canvas);const select=document.querySelector('select');select.addEventListener('change',()=>field.setMode(select.selectedIndex));document.querySelector('button').addEventListener('click',()=>{select.selectedIndex=0;field.setMode(0)});addEventListener('pagehide',()=>field.dispose(),{once:true});document.body.dataset.state='ready';</script></body></html>

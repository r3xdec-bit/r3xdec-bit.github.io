<h2 class="section-heading" id="practice-heading">Practice</h2><p class="eyebrow">Made of attention, shaped by nature.</p>
<div aria-label="Studio principles" class="card-rail" role="region" tabindex="0"><button class="manifesto-card" data-story="tend"><span class="card-number">I</span><h3>GROW<br/>WITH<br/>CARE</h3><p>Give each stem room to breathe. A considered arrangement begins with patience, a little space, and a careful hand.</p></button><button class="manifesto-card" data-story="observe"><span class="card-number">II</span><h3>SEEK<br/>THE<br/>SMALL</h3><p>Look for the details that almost disappear: a translucent edge, a branching vein, the shadow beneath a leaf.</p></button><button class="manifesto-card" data-story="gather"><span class="card-number">III</span><h3>MAKE<br/>ROOM<br/>FOR LIFE</h3><p>Let an unexpected shape change the composition. A little asymmetry gives a piece its own character.</p></button><button class="manifesto-card" data-story="preserve"><span class="card-number">IV</span><h3>HOLD<br/>THE<br/>LIGHT</h3><p>Turn a piece toward the window. Notice how clear glass gathers light and carries it into the smallest spaces.</p></button><button class="manifesto-card" data-story="rewild"><span class="card-number">V</span><h3>LEAVE<br/>IT<br/>WILD</h3><p>Keep the crooked stem and the unruly branch. Nature brings a kind of order that cannot be drawn in advance.</p></button></div>

<p class="section-footnote">Ways of tending to what catches the eye.</p>
<div aria-hidden="true" id="world"></div><div aria-hidden="true" class="vignette"></div><dialog aria-labelledby="story-title" id="story-dialog"><button aria-label="Close note" class="dialog-close">×</button><article class="dialog-content"><span class="eyebrow" id="story-category"></span><h2 id="story-title"></h2><div id="story-body"></div><button class="story-cta dialog-done">Back to the page</button></article></dialog><p class="model-credit"><a href="https://commons.wikimedia.org/wiki/File:Body_female_realistic_by_Dan_Ulrich_(CC0).stl" rel="noopener noreferrer" target="_blank">Female form by Dan Ulrich / Blender Studio</a> · <a href="https://creativecommons.org/publicdomain/zero/1.0/" rel="noopener noreferrer" target="_blank">CC0</a> · adapted for Stillflora.</p><link href="https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/sections-release/ef0e54eb35f203196de2e5354a3728442c328e7f7705ab4bb78e612664d8ec12.txt" rel="license"/></section></main><script defer="" src="./runtime.js"></script><script>(()=>{const root=document.querySelector('[data-section-root]'),life=new AbortController();const listen=(target,type,fn,options={})=>target.addEventListener(type,fn,{...options,signal:life.signal});let dead=false;listen(window,'pagehide',()=>{dead=true;life.abort()},{once:true});const motion=matchMedia('(prefers-reduced-motion: reduce)');const folios=['I','II','III','IV','V'];
const stories={"tend": {"category": "Practice / I", "title": "Grow with care.", "paragraphs": ["An arrangement starts with the space around it. Before adding another stem, pause to see what is already there: a line, a weight, a patch of light.", "Care lives in these small decisions. Turn a leaf to reveal its shape. Leave a little air between two blooms. Let the materials tell you when the piece is complete."]}, "observe": {"category": "Practice / II", "title": "Seek the small.", "paragraphs": ["At first, a blossom reads as a single shape. Closer up, it becomes a landscape of folds, fine veins, and tiny grains of pollen.", "Our studies begin at this scale. A curled edge or a broken line can give an entire composition its character. Looking closely is part of making."]}, "gather": {"category": "Practice / III", "title": "Make room for life.", "paragraphs": ["A stem rarely grows in a perfect line. Leaves turn toward the light; petals open at their own pace. These small differences bring an arrangement to life.", "Leave enough space for them. Try a branch at an unfamiliar angle, or place a single bud where a larger flower might have been. Follow what changes."]}, "preserve": {"category": "Practice / IV", "title": "Hold the light.", "paragraphs": ["Clear glass can nearly disappear, then announce its whole shape in a single bright edge. Inside it, petals filter the light into quieter shades of cream and pink.", "Watch the relationship between the two materials. A reflection travels across the surface while a leaf stays still behind it. The piece holds both moments at once."]}, "rewild": {"category": "Practice / V", "title": "Leave it wild.", "paragraphs": ["The garden offers more than perfect specimens. A crooked stem has direction. A curled leaf casts a deeper shadow. An uneven blossom asks to be seen on its own terms.", "Keep a little of that unruliness. Let a branch interrupt the outline. The most memorable part of a piece may be the detail that refuses to fit neatly."]}};

const rail=document.querySelector('.card-rail'),cards=[...rail.children];let cardIndex=innerWidth<701?0:2;rail.scrollLeft=cards[cardIndex].offsetLeft-rail.clientWidth/2+cards[cardIndex].offsetWidth/2;document.getElementById('card-counter').textContent=folios[cardIndex]+' / V';

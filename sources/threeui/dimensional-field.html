<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Constellation Gravity Field — r3xdec 3D</title>
  <script type="importmap">
  { "imports": { "three": "/vendor/three/three.module.js" } }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05070e; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x05070e, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 16;

    const COUNT = 110;
    const pts = [];
    const vels = [];
    const posArr = new Float32Array(COUNT * 3);
    for (let i = 0; i < COUNT; i++) {
      const p = new THREE.Vector3((Math.random() - 0.5) * 18, (Math.random() - 0.5) * 11, (Math.random() - 0.5) * 10);
      pts.push(p);
      vels.push(new THREE.Vector3((Math.random() - 0.5) * 0.025, (Math.random() - 0.5) * 0.025, (Math.random() - 0.5) * 0.02));
      posArr.set([p.x, p.y, p.z], i * 3);
    }

    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    const pMat = new THREE.PointsMaterial({ color: 0x67e8f9, size: 0.18, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending });
    scene.add(new THREE.Points(pGeo, pMat));

    const MAX_SEGS = COUNT * 18;
    const linePos = new Float32Array(MAX_SEGS * 6);
    const lineCol = new Float32Array(MAX_SEGS * 6);
    const lGeo = new THREE.BufferGeometry();
    lGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
    lGeo.setAttribute('color', new THREE.BufferAttribute(lineCol, 3));
    const lMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.65, blending: THREE.AdditiveBlending });
    const lines = new THREE.LineSegments(lGeo, lMat);
    scene.add(lines);

    const mouse = new THREE.Vector3(0, 0, 0);
    let pointerActive = false;
    window.addEventListener('pointermove', (e) => {
      pointerActive = true;
      mouse.x = ((e.clientX / window.innerWidth) * 2 - 1) * 9.5;
      mouse.y = (-(e.clientY / window.innerHeight) * 2 + 1) * 6.0;
    });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate(ms) {
      const t = ms * 0.0004;
      camera.position.x = Math.sin(t) * 2.2;
      camera.position.y = Math.cos(t * 0.7) * 1.1;
      camera.lookAt(0, 0, 0);

      for (let i = 0; i < COUNT; i++) {
        const p = pts[i], v = vels[i];
        p.add(v);
        if (Math.abs(p.x) > 9.5) v.x *= -1;
        if (Math.abs(p.y) > 5.8) v.y *= -1;
        if (Math.abs(p.z) > 5.5) v.z *= -1;
        if (pointerActive) {
          const dx = p.x - mouse.x, dy = p.y - mouse.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < 9.0 && d2 > 0.01) {
            const f = 0.028 / Math.sqrt(d2);
            p.x += dx * f; p.y += dy * f;
          }
        }
        posArr[i * 3] = p.x; posArr[i * 3 + 1] = p.y; posArr[i * 3 + 2] = p.z;
      }
      pGeo.attributes.position.needsUpdate = true;

      let seg = 0;
      const thresh = 3.4;
      for (let i = 0; i < COUNT; i++) {
        for (let j = i + 1; j < COUNT && seg < MAX_SEGS; j++) {
          const d = pts[i].distanceTo(pts[j]);
          if (d < thresh) {
            const a = 1.0 - d / thresh;
            const o = seg * 6;
            linePos[o] = pts[i].x; linePos[o+1] = pts[i].y; linePos[o+2] = pts[i].z;
            linePos[o+3] = pts[j].x; linePos[o+4] = pts[j].y; linePos[o+5] = pts[j].z;
            lineCol[o] = 0.25 * a; lineCol[o+1] = 0.75 * a; lineCol[o+2] = 1.0 * a;
            lineCol[o+3] = 0.55 * a; lineCol[o+4] = 0.42 * a; lineCol[o+5] = 1.0 * a;
            seg++;
          }
        }
      }
      lGeo.setDrawRange(0, seg * 2);
      lGeo.attributes.position.needsUpdate = true;
      lGeo.attributes.color.needsUpdate = true;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>

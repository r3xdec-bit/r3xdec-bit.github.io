in(devicePixelRatio||1,1.5));gl.drawArrays(gl.POINTS,0,42);gl.disableVertexAttribArray(seed);\n  if(!reduced.matches)frame=requestAnimationFrame(draw);\n }\n function onVisibility(){cancelAnimationFrame(frame);frame=0;if(!document.hidden){last=performance.now();draw(last);}}\n function onMotion(){cancelAnimationFrame(frame);frame=0;draw(performance.now());}\n try{\n  gl=canvas.getContext('webgl',{alpha:true,antialias:false,powerPreference:'low-power'});if(!gl)throw new Error('WebGL unavailable');\n  particles=program(`attribute vec3 aSeed;uniform float uTime;uniform float uRatio;varying float vAlpha;void main(){float phase=aSeed.x*6.283185+uTime*(.025+aSeed.z*.022);float radius=.35+aSeed.y*.46;vec2 p=vec2(cos(phase)*radius,sin(phase)*radius*.85);p.y+=sin(uTime*.25+aSeed.z*30.)*.025;gl_Position=vec4(p,0.,1.);gl_PointSize=(1.4+aSeed.z*2.)*uRatio;vAlpha=(.18+.34*aSeed.z)*(.6+.4*sin(uTime*.6+aSeed.x*22.));}`,`precision mediump float;varying float vAlpha;void main(){float d=length(gl_PointCoord-.5)*2.;gl_FragColor=vec4(.64,.44,.18,pow(max(0.,1.-d),1.8)*vAlpha);}`);\n  const seeds=[];for(let i=0;i\u003c42;i++)seeds.push((i*.618033989)%1,(i*.41421356)%1,(i*.73205081)%1);points=buffer(seeds);\n  resize();draw(performance.now());root.dataset.loaderShader='ready';\n }catch{root.dataset.loaderShader='unavailable';}\n window.addEventListener('resize',resize);document.addEventListener('visibilitychange',onVisibility);reduced.addEventListener('change',onMotion);\n})();\n\u003c/script>\n\u003cnoscript>\u003cstyle>.edition-loader{display:none}\u003c/style>\u003c/noscript>\n\u003ca class=\"skip\" href=\"#main\">Skip to content\u003c/a>\n\u003csvg width=\"0\" height=\"0\" aria-hidden=\"true\" style=\"position:absolute\">\u003cdefs>\u003csymbol id=\"star\" viewBox=\"0 0 40 50\">\u003cpath d=\"M20 1 23 19 35 10 27 23 40 25 27 28 35 40 23 32 20 49 17 32 5 40 13 28 0 25 13 23 5 10 17 19Z\" fill=\"currentColor\"/>\u003cpath d=\"M20 1V25L35 10 23 23 40 25H20V49L17 28 5 40 16 25H0L20 23Z\" meless objects\u003cbr>for a brighter today\u003c/p>\u003ch1 id=\"hero-title\">\u003cspan>A classic worth\u003c/span>\u003cem>remembering\u003c/em>\u003c/h1>\u003cdiv class=\"rule\" aria-hidden=\"true\">\u003csvg class=\"star-mark\">\u003cuse href=\"#star\"/>\u003c/svg>\u003c/div>\u003cp class=\"intro\">Enduring taste. Considered craft. A more inspired tomorrow. The Renaissance Edition curates timeless objects for a new generation of builders, dreamers, and doers.\u003c/p>\u003ca class=\"story-button\" href=\"#story\">\u003cimg class=\"story-ornament\" data-asset=\"story-ornament\" width=\"1024\" height=\"341\" alt=\"\" draggable=\"false\">\u003cspan class=\"story-label\">Discover the story \u003csvg aria-hidden=\"true\">\u003cuse href=\"#arrow\"/>\u003c/svg>\u003c/span>\u003c/a>\u003c/div>\n\u003cdiv class=\"side-note\" aria-hidden=\"true\">Ideas\u003cbr>People\u003cbr>Commerce\u003cbr>A brighter\u003cbr>tomorrow\u003csvg class=\"star-mark\">\u003cuse href=\"#star\"/>\u003c/svg>\u003c/div>\u003cdiv class=\"paper-message\" aria-hidden=\"true\">A\u003cbr>brighter\u003cbr>tomorrow\u003csvg class=\"star-mark\">\u003cuse href=\"#star\"/>\u003c/svg>\u003c/div>\n\u003cdiv class=\"edition-footer\">\u003cspan class=\"number\">01\u003c/span>\u003cspan class=\"caption\">Art / Commerce / A brighter tomorrow\u003c/span>\u003c/div>\u003cdiv class=\"motion-controls\">\u003cspan class=\"scroll-cue\">Scroll to explore ↓\u003c/span>\u003cbutton id=\"motion-toggle\" aria-pressed=\"false\">Pause motion\u003c/button>\u003c/div>\u003cdiv class=\"grain\" aria-hidden=\"true\">\u003c/div>\n\u003c/section>\n\u003csection class=\"edition-bridge\" aria-label=\"The first edition\">\n\u003cbutton class=\"bridge-copy\" data-view=\"collection\">\u003cspan class=\"eyebrow\" style=\"display:block\">The first edition\u003c/span>\u003cp>A curated collection for a more inspired tomorrow.\u003c/p>\u003c/button>\n\u003cdiv class=\"bridge-stars\" aria-hidden=\"true\">\u003cimg data-asset=\"footer-compass\" alt=\"\">\u003cimg data-asset=\"footer-compass\" alt=\"\">\u003cimg data-asset=\"footer-compass\" alt=\"\">\u003c/div>\n\u003c/section>\n\u003c/div>\n\u003csection class=\"collection-section\" id=\"collection\" aria-labelledby=\"collection-title\">\n  \u003cdiv class=\"collection-intro\">\n    \u003cp class=\"eyebrow\">Objects / Images / Ideas\u003c/p>\n    \u003ch2 id=\"collection-title\" tabindex=\"-1\">The \u003cem>Collection\u003c/em>\u003c/h2>\n    \u003cp class=\"collection-lead\">A curated selection of rare objects, classical forms, and visual culture.\u003cbr class=\"collection-wide-break\"> The Renaissance Edition brings together enduring craft and ideas to inspire a more considered tomorrow.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"collection-marginalia\" aria-hidden=\"true\">\u003cimg data-asset=\"footer-compass\" alt=\"\">\u003cp>Ideas\u003cbr>People\u003cbr>Commerce\u003cbr>A brighter\u003cbr>tomorrow\u003c/p>\u003cspan>\u003c/span>\u003cimg class=\"collection-small-star\" data-asset=\"footer-compass\" alt=\"\">\u003cem>Objects\u003cbr>carry forward\u003cbr>what endures.\u003c/em>\u003c/div>\n  \u003cdiv class=\"collection-toolbar\">\n    \u003cdiv class=\"collection-filters\" role=\"group\" aria-label=\"Filter the collection\">\n      \u003cbutton type=\"button\" data-collection-filter=\"all\" aria-pressed=\"true\" aria-controls=\"collection-works\">All Works\u003c/button>\n      \u003cbutton type=\"button\" data-collection-filter=\"Sculpture\" aria-pressed=\"false\" aria-controls=\"collection-works\">Sculpture\u003c/button>\n      \u003cbutton type=\"button\" data-collection-filter=\"Art\" aria-pressed=\"false\" aria-controls=\"collection-works\">Art\u003c/button>\n      \u003cbutton type=\"button\" data-collection-filter=\"Objects\" aria-pressed=\"false\" aria-controls=\"collection-works\">Objects\u003c/button>\n      \u003cbutton type=\"button\" data-collection-filter=\"Books\" aria-pressed=\"false\" aria-controls=\"collection-works\">Books\u003c/button>\n      \u003cbutton type=\"button\" data-collection-filter=\"Ideas\" aria-pressed=\"false\" aria-controls=\"collection-works\">Ideas\u003c/button>\n    \u003c/div>\n    \u003cp class=\"collection-count\" id=\"collection-count\" role=\"status\" aria-atomic=\"true\">4 works\u003c/p>\n    \u003clabel class=\"collection-sort\" for=\"collection-sort\">Sort by \u003cspan>\u003cselect id=\"collection-sort\" aria-controls=\"collection-works\">\u003coption value=\"featured\">Featured\u003c/option>\u003coption value=\"title-asc\">Title: A–Z\u003c/option>\u003coption value=\"title-desc\">Title: Z–A\u003c/option>\u003coption value=\"number-desc\">Edition: newest first\u003c/option>\u003c/select>\u003csvg viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003cpath d=\"m3 6 5 5 5-5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/>\u003c/svg>\u003c/span>\u003c/label>\n  \u003c/div>\n  \u003cdiv class=\"collection-works\" id=\"collection-works\">\u003c/div>\n  \u003cdiv class=\"collection-empty\" hidden>\u003ch3>A little room for what’s next.\u003c/h3>\u003cp>Books will join a future edition. Explore the works in this first collection.\u003c/p>\u003cbutton type=\"button\" class=\"text-link\" data-collection-reset>View all works \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/button>\u003c/div>\n  \u003cdiv class=\"collection-signature\">\u003cspan>01\u003c/span>\u003cp>Art / Commerce / A brighter tomorrow\u003c/p>\u003ca href=\"#story\">Discover our story \u003csvg aria-hidden=\"true\">\u003cuse href=\"#arrow\"/>\u003c/svg>\u003c/a>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"story-section\" id=\"story\" aria-labelledby=\"story-title\" data-in-view=\"false\">\n  \u003cdiv class=\"story-layout\">\n    \u003cdiv class=\"story-intro\">\n      \u003cp class=\"eyebrow\">A more inspired tomorrow\u003c/p>\n      \u003ch2 id=\"story-title\" tabindex=\"-1\">Our \u003cem>Story\u003c/em>\u003c/h2>\n      \u003cp class=\"story-lead\">Timeless objects have the power to shape brighter tomorrows. The Renaissance Edition was born from a belief in enduring beauty, thoughtful craft, and a more inspired way of living.\u003c/p>\n      \u003cdiv class=\"story-intro-rule\" aria-hidden=\"true\">\u003cimg data-asset=\"footer-compass\" alt=\"\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"story-quote\">\u003cblockquote>“The past\u003cbr>fuels a brighter\u003cbr>tomorrow.”\u003c/blockquote>\u003cspan>\u003c/span>\u003cp>Ideas\u003cbr>People\u003cbr>Commerce\u003cbr>A brighter\u003cbr>tomorrow\u003c/p>\u003c/div>\n    \u003cdiv class=\"story-portrait story-float\" data-depth=\"1.2\" aria-hidden=\"true\">\u003cdiv class=\"story-drift\">\u003cimg class=\"story-bust\" data-asset=\"story-bust\" width=\"1122\" height=\"1402\" alt=\"\">\u003cimg class=\"portrait-star\" data-asset=\"footer-compass\" alt=\"\">\u003cdiv class=\"story-established\">Est.\u003cstrong>2018\u003c/strong>\u003c/div>\u003cdiv class=\"story-dots\">\u003c/div>\u003c/div>\u003c/div>\n    \u003cdiv class=\"story-values\" aria-hidden=\"true\">\u003cimg data-asset=\"footer-compass\" alt=\"\">\u003cp>Objects\u003cbr>Ideas\u003cbr>People\u003cbr>A brighter\u003cbr>tomorrow\u003c/p>\u003c/div>\n    \u003cdiv class=\"story-collage story-float\" data-depth=\"-.85\" aria-hidden=\"true\">\u003cimg class=\"story-drift\" data-asset=\"story-collage\" alt=\"\">\u003c/div>\n    \u003cdiv class=\"story-side-note story-float\" data-depth=\".55\" aria-hidden=\"true\">\u003cimg data-asset=\"paper\" alt=\"\">\u003cp>A more\u003cbr>inspired\u003cbr>tomorrow\u003c/p>\u003cimg class=\"note-compass\" data-asset=\"footer-compass\" alt=\"\">\u003c/div>\n    \u003cdiv class=\"story-atlas story-float\" data-depth=\".75\" aria-hidden=\"true\">\u003cimg class=\"story-drift\" data-asset=\"story-atlas\" alt=\"\">\u003c/div>\n    \u003col class=\"story-timeline\" aria-label=\"Our story, 2018 to 2025\">\n      \u003cli class=\"story-entry\" id=\"chapter-2018\">\u003cspan class=\"story-node\" aria-hidden=\"true\">\u003c/span>\u003cdiv class=\"story-date\" aria-hidden=\"true\">\u003cspan>2018\u003c/span>\u003csmall>The\u003cbr>beginning\u003c/small>\u003c/div>\u003carticle class=\"story-card\">\u003cdiv class=\"story-card-copy\">\u003ctime datetime=\"2018\">2018\u003c/time>\u003ch3>\u003cbutton data-story-chapter=\"2018\">A Spark of an Idea\u003c/button>\u003c/h3>\u003cp>It began with a simple question: what if everyday objects could inspire a brighter tomorrow?\u003c/p>\u003c/div>\u003cimg class=\"story-card-image\" data-asset=\"story-idea\" width=\"512\" height=\"512\" alt=\"An architectural drawing of a Renaissance dome on parchment\" loading=\"lazy\">\u003c/article>\u003c/li>\n      \u003cli class=\"story-entry\" id=\"chapter-2020\">\u003cspan class=\"story-node\" aria-hidden=\"true\">\u003c/span>\u003cdiv class=\"story-date\" aria-hidden=\"true\">\u003cspan>2020\u003c/span>\u003csmall>People\u003cbr>&amp; craft\u003c/small>\u003c/div>\u003carticle class=\"story-card\">\u003cdiv class=\"story-card-copy\">\u003ctime datetime=\"2020\">2020\u003c/time>\u003ch3>\u003cbutton data-story-chapter=\"2020\">Curating with Purpose\u003c/button>\u003c/h3>\u003cp>We began partnering with artisans and makers who share our belief in lasting quality and meaningful design.\u003c/p>\u003c/div>\u003cimg class=\"story-card-image\" data-asset=\"story-craft\" width=\"512\" height=\"512\" alt=\"An artisan shaping a ceramic bowl by hand\" loading=\"lazy\">\u003c/article>\u003c/li>\n      \u003cli class=\"story-entry\" id=\"chapter-2022\">\u003cspan class=\"story-node\" aria-hidden=\"true\">\u003c/span>\u003cdiv class=\"story-date\" aria-hidden=\"true\">\u003cspan>2022\u003c/span>\u003csmall>A larger\u003cbr>purpose\u003c/small>\u003c/div>\u003carticle class=\"story-card\">\u003cdiv class=\"story-card-copy\">\u003ctime datetime=\"2022\">2022\u003c/time>\u003ch3>\u003cbutton data-story-chapter=\"2022\">A Growing Community\u003c/button>\u003c/h3>\u003cp>What started as a collection became a community — a global audience of builders, dreamers, and doers.\u003c/p>\u003c/div>\u003cimg class=\"story-card-image\" data-asset=\"story-community\" width=\"512\" height=\"512\" alt=\"A sunlit stone arch opening onto the Tuscan countryside\" loading=\"lazy\">\u003c/article>\u003c/li>\n      \u003cli class=\"story-entry\" id=\"chapter-2024\">\u003cspan class=\"story-node\" aria-hidden=\"true\">\u003c/span>\u003cdiv class=\"story-date\" aria-hidden=\"true\">\u003cspan>2024\u003c/span>\u003csmall>A bolder\u003cbr>chapter\u003c/small>\u003c/div>\u003carticle class=\"story-card\">\u003cdiv class=\"story-card-copy\">\u003ctime datetime=\"2024\">2024\u003c/time>\u003ch3>\u003cbutton data-story-chapter=\"2024\">The Renaissance Edition\u003c/button>\u003c/h3>\u003cp>We unveiled a collection inspired by the timeless spirit of the Renaissance — a celebration of human potential.\u003c/p>\u003c/div>\u003cimg class=\"story-card-image\" data-asset=\"story-edition\" width=\"512\" height=\"512\" alt=\"Olive leaves beside an intricately carved Corinthian capital\" loading=\"lazy\">\u003c/article>\u003c/li>\n      \u003cli class=\"story-entry\" id=\"chapter-2025\">\u003cspan class=\"story-node\" aria-hidden=\"true\">\u003c/span>\u003cdiv class=\"story-date\" aria-hidden=\"true\">\u003cspan>2025\u003c/span>\u003csmall>The\u003cbr>future\u003c/small>\u003c/div>\u003carticle class=\"story-card\">\u003cdiv class=\"story-card-copy\">\u003ctime datetime=\"2025\">2025\u003c/time>\u003ch3>\u003cbutton data-story-chapter=\"2025\">A Brighter Tomorrow\u003c/button>\u003c/h3>\u003cp>We continue to explore what’s next — creating objects that inspire progress, purpose, and a more thoughtful world.\u003c/p>\u003c/div>\u003cdiv class=\"story-card-image story-future-image\" aria-hidden=\"true\">\u003cimg class=\"story-future-sky\" data-asset=\"footer-celestial\" alt=\"\" loading=\"lazy\">\u003cimg class=\"story-future-star\" data-asset=\"footer-compass\" alt=\"\" loading=\"lazy\">\u003c/div>\

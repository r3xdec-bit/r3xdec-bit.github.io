<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spiral Galaxy Particle Vortex — r3xdec 3D</title>
  <script type="importmap">
  { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #030408; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x030408, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(0, 5.4, 8.8);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const COUNT = 18000, ARMS = 4, RADIUS = 7.2;
    const pos = new Float32Array(COUNT * 3);
    const col = new Float32Array(COUNT * 3);
    const scales = new Float32Array(COUNT);
    const cIn = new THREE.Color('#ffbe76'), cOut = new THREE.Color('#3b82f6'), cTip = new THREE.Color('#a855f7');

    for (let i = 0; i < COUNT; i++) {
      const r = Math.pow(Math.random(), 1.65) * RADIUS;
      const arm = (i % ARMS) / ARMS * Math.PI * 2;
      const spin = r * 1.15;
      const scatter = (0.18 + r * 0.14);
      const rx = (Math.random() - 0.5) * scatter * 2;
      const ry = (Math.random() - 0.5) * scatter * 0.65;
      const rz = (Math.random() - 0.5) * scatter * 2;
      pos[i*3] = Math.cos(arm + spin) * r + rx;
      pos[i*3+1] = ry;
      pos[i*3+2] = Math.sin(arm + spin) * r + rz;
      const t = r / RADIUS;
      const c = t < 0.5 ? cIn.clone().lerp(cOut, t * 2) : cOut.clone().lerp(cTip, (t - 0.5) * 2);
      col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
      scales[i] = 0.6 + Math.random() * 1.8;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));

    const uniforms = { uTime: { value: 0 }, uPR: { value: renderer.getPixelRatio() } };
    const mat = new THREE.ShaderMaterial({
      depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true, uniforms,
      vertexShader: `
        attribute float aScale; uniform float uTime, uPR; varying vec3 vColor;
        void main() {
          vColor = color;
          vec3 p = position;
          float r = length(p.xz);
          float ang = uTime * (0.42 / (0.65 + r * 0.25));
          float cs = cos(ang), sn = sin(ang);
          p.xz = mat2(cs, -sn, sn, cs) * p.xz;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = aScale * uPR * 18.0 / -mv.z;
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          if (d > 0.5) discard;
          float glow = pow(1.0 - d * 2.0, 2.2);
          gl_FragColor = vec4(vColor * 1.4, glow);
        }
      `,
    });
    scene.add(new THREE.Points(geo, mat));

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    function animate(ms) {
      uniforms.uTime.value = ms * 0.001;
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>

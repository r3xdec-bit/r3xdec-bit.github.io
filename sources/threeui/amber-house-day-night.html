<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Amber House Day Night</title><style>

:root{color-scheme:dark;--ink:#e2e6ec;--muted:#7d8b9e;--line:#ffffff1d;--amber:#dca96e}*{box-sizing:border-box}.icon{display:grid;place-items:center;width:34px;height:34px;background:#0d172280;border:1px solid #ffffff19;border-radius:50%;transition:background .2s,border-color .2s}.icon:hover{border-color:#8796aa77;background:#182535}.icon[aria-pressed=true]{color:#d8ad77}.icon svg{height:15px;width:15px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}@keyframes loading{from{transform:translateX(-100%)}to{transform:translateX(390%)}}@media(max-width:600px){.icon{width:28px;height:28px}}

.mode-switch{width:auto;min-width:83px;display:flex;gap:8px;justify-content:center;padding:0 13px;font-size:10px;letter-spacing:.04em;border-radius:22px}.sun-icon{display:none}body[data-time=day] .moon-icon{display:none}body[data-time=day] .sun-icon{display:block}
body[data-time=day] .icon{background:#fff7e7c4;border-color:#9d764538;color:#735238}
body[data-time=day] .icon[aria-pressed=true]{color:#9b6425}
body[data-time=day] .icon:hover{background:#fff;border-color:#9d764570}
@media(max-width:600px){.mode-switch{width:28px;min-width:28px;padding:0}.mode-switch span{display:none}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@keyframes qh-panel-corners{from{border-radius:18px}to{border-radius:0}}@keyframes qh-card-corners{from{border-radius:0}to{border-radius:18px}}@keyframes play-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
*{box-sizing:border-box}html,body{margin:0}body{min-height:100svh;display:grid;place-content:center;}body{background:#0b1423;font-family:Arial,sans-serif;color:#ddd}body[data-time=day]{background:#f1ebdf}button{font:inherit;cursor:pointer}</style></head><body><button class="icon mode-switch" id="daytime" aria-label="Golden hour daytime" aria-pressed="false" title="Switch to golden hour · D"><svg viewBox="0 0 24 24" class="moon-icon"><path d="M20.6 13A8.8 8.8 0 0 1 11 3.4 8.8 8.8 0 1 0 20.6 13Z"/></svg><svg viewBox="0 0 24 24" class="sun-icon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg><span id="daytime-label">Night</span></button><script>const $=s=>document.querySelector(s);function setTime(day){document.body.dataset.time=day?'day':'night';$('#daytime').setAttribute('aria-pressed',String(day));$('#daytime').title=day?'Switch to night · D':'Switch to golden hour · D';$('#daytime-label').textContent=day?'Golden':'Night';document.dispatchEvent(new CustomEvent('timechange',{detail:{day}}))}const toggle=()=>setTime(document.body.dataset.time!=='day');$('#daytime').onclick=toggle;addEventListener('keydown',e=>{if(e.key.toLowerCase()==='d')toggle()});setTime(false)</script></body></html>

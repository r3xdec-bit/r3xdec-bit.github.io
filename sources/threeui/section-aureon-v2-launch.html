es/embedded/c613cb5c92f9be35ae64e0721963e6ac06d4bdc89503295d3ddeb6ce5a4b7b47.webp\");--aur-img-2:url(\"https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/embedded/50d5890233ba1b2916a305cc85f19a193ea20882f027ee336f412e4007374cef.webp\");\n--aur-img-3:url(\"https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/embedded/f13e84e300ef4d421294432f3368755500829e8ffa27546f9195cebfb16c9c6f.webp\");--aur-img-4:url(\"https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/embedded/a4e17101c85c9763e16c11a1a9558a12336d058f005733e375369ac09b08de30.webp\");--aur-img-5:url(\"https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/embedded/16b70216f0efc7d35182932fcfa3a8731f404fcccbcd380f2929e49bf0a7776a.webp\");\n--aur-ctl-bg:#0a162b99;--aur-ctl-line:#a7cfeb52;--aur-ctl-hover:#36eeec1a;--aur-ctl-line-hover:#36eeec99;\n/* caption ink floor: both tiers sit well above 70% luminance on the navy base (≈ 13:1 and 9:1) */\n--label-ink:#d0dde8;--label-ink-dim:#aabdcd;\n/* heading ladder: display / h1 / h2 / h3. Every section headline maps to one tier. */\n--aur-t-display:clamp(56px,6.2vw,104px);--aur-t-1:clamp(44px,5vw,80px);--aur-t-2:clamp(38px,3.9vw,56px);--aur-t-3:clamp(26px,2.3vw,32px)}\nhtml{scroll-padding-top:calc(var(--aur-head) + 24px)}\n/* One caption style. Accent-tier captions (.eyebrow) carry the teal rule; neutral-tier captions are plain label ink. */\n.eyebrow.eyebrow{font-size:var(--aur-cap);letter-spacing:var(--aur-track);line-height:1.45;color:var(--label-ink);gap:16px}\n.eyebrow.eyebrow:after{background:linear-gradient(90deg,#36eeecb3,#36eeec00);width:48px}\n.section-label.section-label{font-size:var(--aur-cap);letter-spacing:var(--aur-track);line-height:1.45}\n.muted.muted,.section-label .muted{font-size:var(--aur-cap);letter-spacing:.16em;color:var(--label-ink-dim)}\n/* One accent rule: every second heading line is the teal accent gradient. It is painted per word (on isfo-ink),\n   because a parent-level background-clip:text loses words while they are transformed mid-reveal. */\n.hero h1 em,.intro h2 span,.chapter-copy h2 em,.possibilities h2 em,.launch-heading h2 em,.tech-heading h2 span,.footer h2 span{color:#36e9e3}\n:is(.hero h1 em,.intro h2 span,.chapter-copy h2 em,.possibilities h2 em,.launch-heading h2 em,.tech-heading h2 span,.footer h2 span) isfo-ink{background:var(--accent-grad);background-size:210% 100%;background-position:calc(var(--light-sweep,1)*100%) 50%;-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em;margin-bottom:-.06em}\n.hero h1,.intro h2,.chapter-copy h2,.modal h2{text-wrap:balance}\n/* Shared control: hairline pill (inset shadow, so focus outlines stay free). Radius system: pill · 14px card · 0 for rules. */\n.menu-toggle,.motion-toggle{box-shadow:inset 0 0 0 1px var(--aur-ctl-line);background:var(--aur-ctl-bg);border:0;border-radius:999px;transition:background .25s,box-shadow .25s,color .25s}\n.menu-toggle:hover,.motion-toggle:hover{background:var(--aur-ctl-hover);box-shadow:inset 0 0 0 1px var(--aur-ctl-line-hover)}\n.menu-toggle:focus-visible,.motion-toggle:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}\n\n/* ===================== UI1 · header: one height (64px), blurred bar once scrolled ===================== */\n.site-header{position:fixed;height:var(--aur-head);border-bottom-color:var(--line)}\n.site-header:before{content:'';position:absolute;inset:0;background:linear-gradient(#050b20ee,#050b20d4);-webkit-backdrop-filter:blur(14px) saturate(1.25);backdrop-filter:blur(14px) saturate(1.25);opacity:0;transition:opacity .35s;pointer-events:none}\n.site-header:after{content:'';position:absolute;left:0;right:0;top:calc(100% + 1px);height:26px;background:linear-gradient(#050b20a6,#050b2000);opacity:0;transition:opacity .35s;pointer-events:none}\nhtml.aur-scrolled .site-header:before,html.aur-scrolled .site-header:after{opacity:1}\n.header-inner{position:relative}\n.brand{gap:12px;font-size:19px;letter-spacing:.04em}\n.brand-dot,.aur-mark{display:inline-block;width:32px;height:32px;flex:none;border-radius:0;background:var(--aur-mark) 50% 50%/contain no-repeat;box-shadow:none;filter:drop-shadow(0 0 8px #36eeec2e)}\n\n.header-actions{gap:10px}\n.menu-toggle{width:auto;height:44px;padding:0 17px 0 21px;display:inline-flex;align-items:center;gap:12px;font-size:14px;color:var(--ink)}\n.menu-toggle:hover{transform:none}\n.menu-toggle aur-label:before{content:'Menu'}\n.menu-toggle[aria-expanded=true] aur-label:before{content:'Close'}\n.aur-burger{display:grid;gap:4px;width:16px}\n.menu-toggle .aur-burger span{width:16px;height:1.5px;border-radius:1px;background:currentColor}\n.menu-toggle[aria-expanded=true] .aur-burger span:first-child{transform:translateY(5.5px) rotate(45deg)}\n.menu-toggle[aria-expanded=true] .aur-burger span:last-child{transform:translateY(-5.5px) rotate(-45deg)}\n.menu-toggle[aria-expanded=true]{box-shadow:inset 0 0 0 1px var(--aur-ctl-line-hover)}\n/* pause control: rounded pause bars / play triangle, tooltip from its own aria-label, visible paused state */\n.motion-toggle{position:relative;inset:auto;z-index:auto;width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:#e4eff5;-webkit-backdrop-filter:none;backdrop-filter:none}\n.motion-toggle svg{width:14px;height:14px;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex:none}\n.motion-toggle:after{content:attr(aria-label);position:absolute;top:calc(100% + 10px);right:0;padding:7px 12px;border-radius:999px;background:#0b1830f2;box-shadow:inset 0 0 0 1px var(--aur-ctl-line);font-size:12px;letter-spacing:.01em;line-height:1.2;color:#e3edf4;white-space:nowrap;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .25s var(--aur-ease);pointer-events:none}\n.motion-toggle:hover:after,.motion-toggle:focus-visible:after{opacity:1;transform:none}\n.motion-toggle[aria-pressed=true]{width:auto;padding:0 17px 0 16px;gap:9px;color:#c9fffa;background:#36eeec1f;box-shadow:inset 0 0 0 1px #36eeecb3}\n.motion-toggle[aria-pressed=true]:after{display:none}\n.motion-toggle[aria-pressed=true] svg{fill:currentColor;stroke-width:1.6}\n.motion-toggle[aria-pressed=true] span{display:inline;font-size:13px;letter-spacing:.01em;white-space:nowrap}\n/* reading progress: 2px line on the header's bottom edge with a bright head */\n.reading-progress{top:calc(var(--aur-head) - 1px);height:2px;margin-top:-1px;background:linear-gradient(90deg,#36eeec2e,#36eeec);box-shadow:none}\n.load-status{font-size:12px;letter-spacing:.18em}\n.webgl-stage{clip-path:inset(var(--aur-head) 0 0)}\n\n/* ===================== UI1 · full-screen menu ===================== */\n.menu-overlay{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.8fr);grid-template-rows:minmax(0,1fr) auto;column-gap:clamp(40px,6vw,104px);row-gap:0;align-items:center;padding:calc(var(--aur-head) + 28px) 6.8% 24px;background:radial-gradient(80% 70% at 78% 45%,#0d2b3a66,transparent 70%),#060e23f7;justify-content:stretch}\n.menu-overlay[hidden]{display:none}\n.aur-menu-main{display:flex;flex-direction:column;min-width:0}\n.aur-menu-list{display:flex;flex-direction:column;gap:2px;min-width:0}\n.menu-overlay .aur-menu-list a{display:flex;align-items:center;gap:0;width:fit-content;max-width:100%;padding:9px 0;font-size:clamp(32px,3.7vw,54px);line-height:1.08;letter-spacing:-.055em;color:#eef4f88c;border-radius:8px;transition:color .3s}\n.menu-overlay .aur-menu-list a small{flex:none;width:58px;font-size:12px;letter-spacing:.14em;color:var(--label-ink-dim);font-variant-numeric:tabular-nums;transition:color .3s}\n.aur-menu-list aur-t{position:relative;white-space:nowrap}\n.aur-menu-list aur-t:after{content:'';position:absolute;left:0;right:0;bottom:-.04em;height:2px;border-radius:2px;background:linear-gradient(90deg,#36eeec,#36eeec40);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--aur-ease)}\n.aur-menu-list svg{flex:none;width:.4em;height:.4em;margin-left:.4em;stroke:var(--cyan);stroke-width:1.6;opacity:0;transform:translate(-6px,6px);transition:opacity .35s,transform .45s var(--aur-ease)}\n.menu-overlay .aur-menu-list a.is-on{color:#fff}\n.aur-menu-list a.is-on small{color:var(--cyan)}\n.aur-menu-list a.is-on svg{opacity:1;transform:none}\n.aur-menu-list a:hover aur-t:after,.aur-menu-list a:focus-visible aur-t:after{transform:scaleX(1)}\n.aur-menu-list a[aria-current=location] small:after{content:'';display:inline-block;width:5px;height:5px;margin-left:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px #36eeecaa;vertical-align:.12em}\n.menu-overlay .aur-menu-list a:focus-visible{outline:2px solid var(--cyan);outline-offset:5px}\n\n\n\n\n\n.aur-menu-esc{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--label-ink-dim)}\n.aur-menu-esc kbd{font:12px DM,Arial,sans-serif;letter-spacing:.06em;padding:5px 11px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--aur-ctl-line);color:var(--label-ink)}\n.aur-menu-preview{position:relative;min-width:0;align-self:center}\n.aur-menu-art{position:relative;aspect-ratio:1.29;max-height:calc(100svh - var(--aur-head) - 340px);width:100%;border-radius:var(--radius-md);overflow:hidden;background:#071428;isolation:isolate}\n.aur-menu-art:after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,#7ff3ea80,#a7cfeb1f 40%,#e8b24a40);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}\n.aur-menu-art i{background:50% 50%/cover no-repeat}\n.aur-menu-art i{position:absolute;inset:0;opacity:0;transform:scale(1.035);transition:opacity .5s ease,transform 1.1s var(--aur-ease)}\n.aur-menu-art i:nth-child(1){background-image:var(--aur-img-0)}.aur-menu-art i:nth-child(2){background-image:var(--aur-img-1)}.aur-menu-art i:nth-child(3){background-image:var(--aur-img-2)}\n.aur-menu-art i:nth-child(4){background-image:var(--aur-img-3)}.aur-menu-art i:nth-child(5){background-image:var(--aur-img-4)}.aur-menu-art i:nth-child(6){background-image:var(--aur-img-5)}\n.aur-menu-art i.is-on{opacity:1;transform:none;animation:aur-drift 16s ease-in-out infinite alternate}\n@keyframes aur-drift{from{transform:scale(1)}to{transform:scale(1.07) translate(-1.4%,-1%)}}\n.motion-paused .aur-menu-art i{animation-play-state:paused}\n.aur-menu-cap{margin-top:22px}\n.menu-overlay .aur-menu-cap p{margin:0;letter-spacing:0;color:inherit}\n\n\n\n\n.menu-overlay .aur-menu-title{margin-top:14px;font-size:28px;letter-spacing:-.04em;line-height:1.15;color:#f2f7fa}\n.menu-overlay .aur-menu-desc{margin-top:10px;font-size:15px;line-height:1.6;color:#b9c9d7}\n.aur-menu-cap.is-swap{animation:aur-swap .45s var(--aur-ease)}\n@keyframes aur-swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n\n\n\n.aur-menu-foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:18px;margin-top:20px;border-top:1px solid var(--line)}\n.menu-overlay .aur-menu-foot p{margin:0;font-size:12px;letter-spacing:.18em;color:var(--label-ink)}\n.menu-overlay .aur-menu-foot a{font-size:13px;letter-spacing:0;color:var(--label-ink);display:inline-flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #36eeec55}\n.menu-overlay .aur-menu-foot a:hover{color:var(--cyan)}\n\n/* ===================== UI2 · hero copy + callout ===================== */\n.hero-copy{top:24%}\n.hero h1{font-size:var(--aur-t-display);letter-spacing:-.056em;margin-top:40px}\n.hero-description{color:#d6e0ea;font-size:18px;letter-spacing:.005em;max-width:540px}\n.hero-cta>.shader-cta{margin-left:calc(22 * var(--u))}\n/* one callout on a dark plate; its leader is measured at runtime from the hero mesh (aur-ui-a script), so it follows any re-framing */\n\n\n\n\n\n\n/* hero dock: scroll scrubber + chapter chips stay alive through the whole hero scroll, then yield to the intro */\n.hero-bottom{display:none}\n.aur-dock{position:absolute;left:0;right:0;bottom:0;height:104px;z-index:5;border-top:1px solid var(--line);background:linear-gradient(0deg,#050b20e0,#050b2073 70%,#050b2000);opacity:var(--aur-dock-o,1)}\n.aur-dock .shell{display:flex;align-items:center;justify-content:space-between;gap:24px;height:100%;padding:0 28px}\n.aur-dock-scroll{display:flex;align-items:center;gap:20px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--label-ink);white-space:nowrap;transition:color .25s}\n.aur-dock-scroll:hover{color:#fff}\n\n\n\n/* chapter chips (hero dock + journey nav): one pill family, 44px targets on touch */\n.journey-nav{display:flex;gap:2px;padding:4px;border:0;border-radius:999px;box-shadow:inset 0 0 0 1px var(--aur-ctl-line);background:#08132bb8;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}\n.journey-nav button{position:relative;height:42px;padding:0 19px;display:flex;align-items:center;gap:10px;border:0;border-radius:999px;font-size:13px;letter-spacing:.005em;color:#d3dfe9;white-space:nowrap;transition:background .25s,color .25s,box-shadow .25s}\n.journey-nav button span{margin:0;font-size:12px;letter-spacing:.08em;color:#86d3cf;font-variant-numeric:tabular-nums}\n\n\n.journey-nav button:hover{background:#ffffff12;color:#fff}\n.journey-nav button:hover span{color:var(--cyan)}\n.journey-nav button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}\n.journey-nav button[aria-current=true]{background:#36eeec1f;box-shadow:inset 0 0 0 1px #36eeec80;color:#fff}\n.journey-nav button[aria-current=true] span{color:var(--cyan)}\n/* the chapter pill is also the journey progress: the active chip fills as its chapter unfolds */\n.journey-nav button:after{content:'';position:absolute;left:19px;right:19px;bottom:6px;height:2px;border-radius:2px;background:linear-gradient(90deg,#36eeec66,#36eeec);transform:scaleX(0);transform-origin:left;opacity:0;transition:opacity .3s}\n.journey-nav button[aria-current=true]:after{opacity:1;transform:scaleX(var(--aur-cp,0))}\n\n/* ===================== UI3 · intro ===================== */\n.intro{align-items:flex-end;padding:40px 20px 30px;overflow-x:clip}\n.intro .reveal{position:relative}\n.intro .reveal:before{content:'';position:absolute;left:50%;top:44%;width:min(1260px,150%);height:170%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,#050b20f5 0%,#050b20e0 40%,#050b2085 68%,#050b2000 100%);z-index:-1;pointer-events:none}\n\n\n\n.intro h2{font-size:var(--aur-t-1)}\n.intro .intro-note{margin-top:24px;font-size:18px;line-height:1.65;color:#d6e0ea}\n/* three chapter previews: the intro's own job (what is coming), not a copy of the chip nav */\n\n\n\n\n\n\n\n\n\n\n\n\n\n/* ===================== UI4 · journey chapters ===================== */\n.journey-top{top:calc(var(--aur-head) + 22px);padding-bottom:0;border-bottom:0;font-size:var(--aur-cap);letter-spacing:var(--aur-track);color:var(--label-ink)}\n.journey-top .current-chapter,.section-progress{display:none}\n.chapter-copy{width:34%;max-width:470px}\n.chapter-panel[data-chapter=\"1\"] .chapter-copy{width:34%}\n\n\n.chapter-copy h2{font-size:var(--aur-t-2)}\n.chapter-copy p{color:#c2d0dd;max-width:400px}\n/* chapter head: a deliberate numeral + a chapter-specific micro-diagram in the band under the rail */\n\n\n\n\n\n\n\n.feature-list{max-width:410px;margin:26px 0}\n.feature-list li{display:flex;align-items:center;gap:14px;padding:11px 0;font-size:15px;letter-spacing:.005em;color:#c2cfdb}\n.feature-list li:before{display:none}\n.feature-list li b{font-weight:700;letter-spacing:-.005em;color:#f4f8fb}\n\n\n.text-link{font-size:14px;gap:22px;padding:0 0 8px;border-bottom:1px solid #3feada80;transition:color .25s,border-color .25s}\n.text-link span{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px #36eeec66;font-size:13px;transition:transform .35s var(--aur-ease),background .25s}\n.text-link:hover{border-color:var(--cyan)}\n.text-link:hover span{transform:translate(2px,-2px);background:#36eeec1a}\n.journey-bottom{bottom:30px}\n.interaction-hint{font-size:var(--aur-cap);letter-spacing:var(--aur-track);text-transform:uppercase;color:var(--label-ink);gap:14px}\n.interaction-hint:before{font-size:16px;color:#b4d9df}\n/* journey → technology seam: the fixed 3D fades into the next section instead of being cut by its top edge */\n.journey:after{content:'';position:absolute;left:0;right:0;bottom:0;height:160px;background:linear-gradient(#080f2500,#080f25d9 70%,#080f25);z-index:5;pointer-events:none}\n.webgl-failed .journey:after{display:none}\n\n/* ===================== UI4 · detail modal ===================== */\n.modal{padding:0;max-width:830px;width:calc(100vw - 32px);border:0;border-radius:var(--radius-md);overflow:hidden;background:radial-gradient(110% 90% at 100% 0%,#14384a 0%,#0a1a2e 48%,#071224 100%);box-shadow:0 40px 120px -24px #000d}\n.modal[open]{display:grid;grid-template-columns:300px minmax(0,1fr)}\n.modal:after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,#7ff3eaa6,#a7cfeb26 38%,#a7cfeb14 62%,#e8b24a73);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}\n.aur-modal-art{position:relative;display:flex;flex-direction:column;min-width:0}\n.aur-modal-img{flex:1;min-height:250px;background:50% 46%/138% auto no-repeat;-webkit-mask-image:radial-gradient(58% 66% at 44% 46%,#000 42%,#0000 100%);mask-image:radial-gradient(58% 66% at 44% 46%,#000 42%,#0000 100%)}\n.modal[data-topic=infrastructure] .aur-modal-img{background-image:var(--aur-img-4)}\n.modal[data-topic=applications] .aur-modal-img{background-image:var(--aur-img-1)}\n.modal[data-topic=security] .aur-modal-img{background-image:var(--aur-img-5)}\n.aur-modal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 12px 14px 24px;border-top:1px solid var(--line)}\n.modal .aur-modal-tag{display:grid;gap:4px;margin:0;font-size:12px;line-height:1.3;letter-spacing:.16em;text-transform:uppercase;color:#dcebf2}\n.aur-modal-tag b{font-weight:400;color:var(--cyan)}\n.aur-modal-nav{display:flex;gap:6px}\n.aur-mnav{display:grid;place-items:center;width:40px;height:40px;border-radius:999px;color:#dfeaf1;box-shadow:inset 0 0 0 1px var(--aur-ctl-line);background:#0a162b99;transition:background .25s,box-shadow .25s}\n.aur-mnav svg{width:15px;height:15px;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}\n.aur-mnav:hover{background:var(--aur-ctl-hover);box-shadow:inset 0 0 0 1px var(--aur-ctl-line-hover)}\n.aur-mnav:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}\n.aur-modal-body{padding:46px 48px 40px 36px;min-width:0}\n\n.modal h2{font-size:var(--aur-t-3);line-height:1.12;margin:18px 0 14px}\n.modal #modal-description{font-size:15px;line-height:1.75;color:#bfcedb}\n\n\n\n\n\n.modal .close{top:14px;right:14px;z-index:2;width:44px;height:44px;border-radius:999px;display:grid;place-items:center;font-size:0;color:#dfeaf1;box-shadow:inset 0 0 0 1px var(--aur-ctl-line);background:#0a162bb3;transition:background .25s,box-shadow .25s,transform .35s var(--aur-ease)}\n.modal .close svg{width:16px;height:16px;stroke-width:1.6}\n.modal .close:hover{background:var(--aur-ctl-hover);box-shadow:inset 0 0 0 1px var(--aur-ctl-line-hover);transform:rotate(90deg)}\n.modal .close:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}\n/* the modal reuses the shader pill (same component as the hero/launch CTA, smaller) */\n.modal .shader-cta{--u:.34px;display:inline-block;margin:32px 0 0 calc(22 * var(--u))}\n.modal::backdrop{background:#010619d1;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}\n\n/* ===================== mid widths ===================== */\n\n@media(min-width:701px) and (max-width:1100px){.hero-description{font-size:16px;max-width:min(400px,38vw)}}\n@media(max-width:1100px){.interaction-hint{font-size:var(--aur-cap)}}\n\n\n\n/* ===================== UI10 · mobile ≤700px ===================== */\n@media(max-width:700px){\n:root{--aur-head:56px;--aur-t-display:clamp(42px,11.4vw,60px);--aur-t-1:clamp(34px,9.8vw,48px);--aur-t-2:clamp(32px,9.4vw,44px);--aur-t-3:28px}\n.eyebrow.eyebrow{letter-spacing:.15em;gap:12px}.eyebrow.eyebrow:after{width:28px}\n.section-label.section-label{flex-wrap:wrap;gap:8px 18px}.section-label>span{white-space:nowrap}\n.header-inner{padding:0 6px 0 12px}\n.brand{font-size:17px;gap:10px}.brand-dot{width:26px;height:26px}\n.header-actions{gap:6px}\n.menu-toggle{height:44px;padding:0 15px 0 17px;gap:10px;font-size:14px}\n.motion-toggle{width:44px;height:44px;top:auto;right:auto;bottom:auto}\n.motion-toggle:after{display:none}\n.motion-toggle[aria-pressed=true]{width:44px;padding:0}\n.motion-toggle[aria-pressed=true] span{display:none}\n.hero-copy{top:calc(var(--aur-head) + 26px)}\n.hero h1{margin-top:16px;letter-spacing:-.05em}\n.hero-description{font-size:15px;line-height:1.55;margin-top:12px}\n.hero-cta{margin-top:16px}\n.aur-dock{height:122px}\n.aur-dock .shell{flex-direction:column;justify-content:center;gap:12px;padding:0 8px}\n.aur-dock-scroll{font-size:12px;letter-spacing:.16em;gap:14px}\n\n.journey-nav{max-width:100%;padding:3px;width:max-content;margin:0 auto}\n.journey-nav button{height:44px;padding:0 10px;gap:6px;font-size:12.5px}\n.journey-nav button span{font-size:12px}\n.journey-nav button:after{left:11px;right:11px;bottom:5px}\n.intro{padding:36px 20px 24px}\n\n\n.intro .intro-note{font-size:15px;margin-top:18px}\n.intro .intro-note br{display:none}\n\n\n\n\n.journey-top{display:none}\n.chapter-copy,.chapter-panel[data-chapter=\"1\"] .chapter-copy{top:calc(var(--aur-head) + 30px);width:86%;max-width:none}\n\n\n.chapter-copy h2 em{display:block}.chapter-copy h2 em:before{content:none}\n.chapter-copy p:not(.eyebrow){display:none}\n.feature-list{display:block;margin:14px 0 0;max-width:none}\n.feature-list li{padding:5px 0;font-size:14px;gap:11px;border-top:0}\n\n.text-link{font-size:13px;margin-top:12px}\n.text-link span{width:24px;height:24px}\n.journey-bottom{bottom:24px}\n.interaction-hint{justify-content:center;margin-top:24px;font-size:var(--aur-cap);letter-spacing:.16em}\n\n.menu-overlay{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;align-items:start;padding:calc(var(--aur-head) + 22px) 7% 22px}\n.aur-menu-list{padding-top:4px}\n.menu-overlay .aur-menu-list a{font-size:clamp(26px,7.6vw,34px);padding:6px 0}\n.menu-overlay .aur-menu-list a small{width:44px}\n.aur-menu-list aur-t{white-space:normal}\n.aur-menu-list svg{display:none}\n\n.aur-menu-esc{display:none}\n.aur-menu-preview{display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;align-items:center;align-self:end;margin-top:18px}\n.aur-menu-art{width:118px;max-height:none}\n\n.aur-menu-cap{margin-top:0}\n\n\n.menu-overlay .aur-menu-title{margin-top:6px;font-size:19px}\n.menu-overlay .aur-menu-desc{margin-top:4px;font-size:13px;line-height:1.5}\n.aur-menu-foot{flex-wrap:wrap;gap:10px 20px}\n.menu-overlay .aur-menu-foot p{letter-spacing:.14em}\n.modal[open]{grid-template-columns:1fr;max-height:calc(100svh - 32px);overflow-x:hidden;overflow-y:auto}\n.aur-modal-img{min-height:170px;flex:none;height:170px;background-size:auto 150%;-webkit-mask-image:linear-gradient(0deg,#0000,#000 38%);mask-image:linear-gradient(0deg,#0000,#000 38%)}\n.aur-modal-bar{padding:8px 8px 8px 20px}\n.aur-mnav{width:44px;height:44px}\n.aur-modal-body{padding:22px 22px 28px}\n.modal #modal-description{font-size:14px;line-height:1.7}\n\n\n\n.modal .shader-cta{--u:.34px;margin-top:24px}\n.load-status{font-size:12px}\n}\n@media(max-width:360px){.journey-nav button{padding:0 8px;font-size:12px}.brand{font-size:16px}}\n/* static (no-WebGL) preview: the 3D clock never reveals chapters 2-3, so show their headings outright */\n.webgl-failed .chapter-copy isfo-ink{opacity:1;transform:none}.webgl-failed .chapter-copy isfo-word{clip-path:none}\n.webgl-failed .aur-dock{opacity:1}\n\n@media(prefers-reduced-motion:reduce){.aur-menu-art i.is-on{animation:none}.aur-menu-art i,.aur-menu-list a,.aur-menu-list svg{transition:none}}\n\n/* ===================================================================================================================\n   ROUND 3 — one gutter (98px grid), teal eyebrows, 12/13/14px floors, live section label, hero stage caption,\n   intro cards, one-tier chapter heads, modal recomposition, visible hover/focus language (lift + teal hairline).\n   =================================================================================================================== */\n:root{--aur-eyebrow:#78e9e2;--aur-gut:calc(6.8vw - 2.35vw - 1px);--label-ink:#d6e2ec;--label-ink-dim:#b3c5d4}\n.eyebrow.eyebrow{color:var(--aur-eyebrow);font-size:13px;letter-spacing:.16em}\n.hero h1{font-size:clamp(52px,5.4vw,96px)}\n.hero-description{font-size:20px;line-height:1.55;color:#dde6ee;max-width:600px;text-wrap:wrap}\n/* one shared gutter: brand, hero copy, dock content and section copy all start at the 98px grid (6.8%) */\n.site-header .header-inner,.aur-dock .shell{padding-left:var(--aur-gut);padding-right:var(--aur-gut)}\n.site-header:before{background:linear-gradient(#050b20f7,#050b20ee)}\n.site-header:after{height:30px;background:linear-gradient(#050b20cc,#050b2000)}\n.brand{gap:13px}\n.brand-dot,.aur-mark{width:38px;height:38px}\n/* live section label replaces the repeated tagline */\n\n\n\n\n/* header controls: visible label on pause, a primary pill, and one hover/focus language */\n.motion-toggle{width:auto;padding:0 17px 0 16px;gap:9px}\n.motion-toggle span{display:inline;font-size:13px;letter-spacing:.01em;white-space:nowrap}\n.motion-toggle:after{display:none}\n\n\n\n\n\n.menu-toggle:hover,.motion-toggle:hover{transform:translateY(-1px)}\n/* one progress device per context: header line (page) without a head dot; dock rail (hero) starts at zero */\n.reading-progress{height:2px;background:linear-gradient(90deg,#36eeec33,#36eeec)}\n\n\n\n.aur-dock-scroll{font-size:13px;letter-spacing:.16em;color:#dbe6ef}\n.journey-nav button{font-size:14px;color:#dbe6ef}\n.journey-nav button span{font-size:12px}\n.journey-nav button:hover{background:#36eeec14;box-shadow:inset 0 0 0 1px #36eeec66;color:#fff}\n/* hero: copy leaves fast (never parks at 30% grey), secondary path, brighter callout */\n.hero-copy{opacity:clamp(0,calc(var(--hero-copy-opacity,1)*2.4 - 1.4),1)}\n.hero-cta{gap:30px}\n.aur-hero-alt{display:inline-flex;align-items:center;gap:10px;font-size:15px;color:#dde6ee;padding:6px 0;border-bottom:1px solid #36eeec66;pointer-events:auto;transition:color .25s,border-color .25s}\n.aur-hero-alt svg{width:14px;height:14px;stroke:var(--cyan);stroke-width:1.7;transition:transform .35s var(--aur-ease)}\n.aur-hero-alt:hover{color:#fff;border-color:var(--cyan)}\n.aur-hero-alt:hover svg{transform:translate(2px,-2px)}\n\n\n/* hero stage caption: a quiet narration of the assembly while the copy is gone (desktop left half, mobile top band) */\n\n\n.aur-dock{transition:opacity .25s}.aur-dock.is-yield{opacity:0;pointer-events:none}\n\n\n\n\n\n\n\n/* ===================== round 3 · intro ===================== */\n.intro{padding:40px 6.8% 34px;background:none}\n.intro .reveal{width:100%}\n.intro .reveal:before{top:54%;width:min(1240px,100%);height:150%;background:radial-gradient(closest-side,#050b20f2 0%,#050b20d6 46%,#050b2073 72%,#050b2000 100%)}\n\n\n\n\n\n\n\n/* a different rhythm: a quiet first line, the accent line carries the size */\n.intro h2{font-size:var(--aur-t-1);line-height:1.04}\n.intro h2>isfo-word{font-size:.62em;color:#e3ebf2}\n/* the intro reads at full ink whenever it is visible: the block fades in later and faster, words never sit grey */\n.hero-sequence + .intro .reveal{opacity:clamp(0,calc(var(--intro-opacity,0)*1.8 - .4),1)}\n.intro isfo-ink{opacity:1}\n.intro .intro-note{margin:22px auto 0;max-width:620px;font-size:18px;color:#dde6ee}\n/* chapter entry cards */\n\n\n\n\n\n\n\n\n\n\n\n\n/* ===================== round 3 · journey: one hierarchy ===================== */\n.journey-top{display:none}\n\n\n\n\n\n.chapter-copy h2{margin-top:0}\n.chapter-panel[data-chapter=\"1\"] .chapter-copy h2 em{display:inline}\n.chapter-copy p{font-size:16px;color:#cdd9e4}\n\n\n.feature-list li{font-size:15px;color:#d0dbe5}\n.journey-bottom{justify-content:center}\n.interaction-hint{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:13px;letter-spacing:.02em;text-transform:none;color:#d6e2ec;gap:12px}\n.interaction-hint:before{content:'';width:18px;height:28px;border-radius:999px;box-shadow:inset 0 0 0 1.5px #a7cfeb99;background:radial-gradient(circle at 50% 30%,var(--cyan) 0 2px,transparent 2.5px)}\n\n\n/* ===================== round 3 · modal ===================== */\n.aur-modal-img{margin:24px 8px 0 24px;background-position:50% 50%;background-size:122% auto;-webkit-mask-image:radial-gradient(64% 60% at 50% 50%,#000 60%,#0000 100%);mask-image:radial-gradient(64% 60% at 50% 50%,#000 60%,#0000 100%)}\n\n\n\n\n\n\n\n\n\n\n\n/* ===================== round 3 · menu ===================== */\n.menu-overlay{column-gap:clamp(36px,4.4vw,72px);padding-top:calc(var(--aur-head) + 20px)}\n.menu-overlay .aur-menu-list a{display:grid;grid-template-columns:58px auto auto;grid-template-rows:auto auto;align-items:center;padding:7px 0;font-size:clamp(30px,3.3vw,48px);color:#eef4f8b3;transition:color .3s,transform .4s var(--aur-ease)}\n.menu-overlay .aur-menu-list a small{grid-row:1;font-size:13px}\n.aur-menu-list aur-t{grid-row:1}\n.aur-menu-list svg{grid-row:1}\n\n.menu-overlay .aur-menu-list a:hover,.menu-overlay .aur-menu-list a:focus-visible{transform:translateX(6px)}\n\n\n\n.menu-overlay .aur-menu-foot{margin-top:14px}\n\n/* ===================== round 3 · mid widths ===================== */\n\n\n@media cpath class=\"cta-pen-body\" d=\"M106.1 77.4a3.8 3.8 0 0 0-15.1-15.1L70.3 82.9a7.6 7.6 0 0 0-1.9 3.2l-5 16.5a1.9 1.9 0 0 0 2.4 2.4l16.5-5a7.6 7.6 0 0 0 3.2-1.9z\"/>\n          \u003cpath class=\"cta-pen-body\" d=\"M85.1 68.4l7.6 7.6\"/>\n        \u003c/g>\u003c/g>\n      \u003c/svg>\n    \u003c/span>\n  \u003c/a>\u003ca class=\"aur-hero-alt\" href=\"#technology\" aria-label=\"Read the architecture\">\u003cspan class=\"aur-alt-l\">Read the architecture\u003c/span>\u003cspan class=\"aur-alt-s\">Architecture\u003c/span>\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M7 17 17 7M8 7h9v9\"/>\u003c/svg>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"hero-bottom\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"aur-dock\">\u003cdiv class=\"shell\">\u003ca href=\"#intro\" class=\"aur-dock-scroll\">Scroll\u003csvg viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003cpath d=\"M8 3v10M4 9l4 4 4-4\"/>\u003c/svg>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/div>\n\u003csection class=\"intro\" id=\"intro\">\u003cdiv class=\"reveal\">\u003cdiv class=\"aur-intro-top\">\u003ch2>Independent parts.\u003cbr>Shared \u003cspan>momentum.\u003c/span>\u003c/h2>\u003cdiv class=\"aur-intro-r\">\u003cp class=\"intro-note\">Each layer stands on its own and makes the others stronger. Scroll to watch them come apart and fit back together.\u003c/p>\u003ca class=\"aur-dock-scroll aur-intro-scroll\" href=\"#journey\">Scroll\u003csvg viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003cpath d=\"M8 3v10M4 9l4 4 4-4\"/>\u003c/svg>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"journey\" id=\"journey\" aria-label=\"Three chapters of the AUREON ecosystem\">\u003cdiv class=\"journey-pin\">\u003cdiv class=\"journey-top\">\u003cspan>THE AUREON SYSTEM / IN MOTION\u003c/span>\u003cspan class=\"current-chapter\">01 — INFRASTRUCTURE\u003c/span>\u003c/div>\n\u003carticle class=\"chapter-panel active\" data-chapter=\"0\">\u003cdiv class=\"chapter-copy\">\u003cp class=\"aur-ch-name\">Infrastructure\u003c/p>\u003ch2>A stronger\u003cem>starting point.\u003c/em>\u003c/h2>\u003cp>Bring people, networks, and data together on a foundation built for connection.\u003c/p>\u003cul class=\"feature-list\">\u003cli>\u003cb>Open protocols.\u003c/b> Shared rules.\u003c/li>\u003cli>\u003cb>Networks\u003c/b> that work together\u003c/li>\u003cli>\u003cb>A foundation\u003c/b> you can build on\u003c/li>\u003c/ul>\u003cbutton class=\"text-link\" data-detail=\"infrastructure\">Explore infrastructure\u003cspan>↗\u003c/span>\u003c/button>\u003c/div>\u003c/article>\n\u003carticle class=\"chapter-panel\" data-chapter=\"1\" inert>\u003cdiv class=\"chapter-copy\">\u003cp class=\"aur-ch-name\">Applications\u003c/p>\u003ch2>Ideas made \u003cem>useful.\u003c/em>\u003c/h2>\u003cp>Turn digital assets and connected processes into experiences people can use.\u003c/p>\u003cul class=\"feature-list\">\u003cli>\u003cb>Create\u003c/b> meaningful digital assets\u003c/li>\u003cli>\u003cb>Connect\u003c/b> the way you work\u003c/li>\u003cli>\u003cb>Build\u003c/b> for real people\u003c/li>\u003c/ul>\u003cbutton class=\"text-link\" data-detail=\"applications\">Explore applications\u003cspan>↗\u003c/span>\u003c/button>\u003c/div>\u003c/article>\n\u003carticle class=\"chapter-panel\" data-chapter=\"2\" inert>\u003cdiv class=\"chapter-copy\">\u003cp class=\"aur-ch-name\">Security\u003c/p>\u003ch2>Trust starts\u003cem>at the core.\u003c/em>\u003c/h2>\u003cp>Make security part of every decision, from the first connection to the final interaction.\u003c/p>\u003cul class=\"feature-list\">\u003cli>\u003cb>Smart contract\u003c/b> security\u003c/li>\u003cli>\u003cb>Clear\u003c/b> permissions and access\u003c/li>\u003cli>\u003cb>Protection\u003c/b> across the system\u003c/li>\u003c/ul>\u003cbutton class=\"text-link\" data-detail=\"security\">Explore security\u003cspan>↗\u003c/span>\u003c/button>\u003c/div>\u003c/article>\n\u003cdiv class=\"section-progress\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003c/div>\u003cdiv class=\"journey-bottom\">\u003cnav class=\"journey-nav\" aria-label=\"Ecosystem chapters\">\u003cbutton data-jump=\"0\" aria-current=\"true\">\u003cspan>01\u003c/span>Infrastructure\u003c/button>\u003cbutton data-jump=\"1\" aria-current=\"false\">\u003cspan>02\u003c/span>Applications\u003c/button>\u003cbutton data-jump=\"2\" aria-current=\"false\">\u003cspan>03\u003c/span>Security\u003c/button>\u003c/nav>\u003cspan class=\"interaction-hint\">Scroll to unfold\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"technology\" id=\"technology\">\u003cdiv class=\"section-label\">\u003cspan>THE ARCHITECTURE\u003c/span>\u003c/div>\u003cdiv class=\"tech-grid\">\u003cdiv class=\"tech-heading reveal\">\u003ch2>\u003cem>Five\u003c/em> layers.\u003cbr>One direction.\u003c/h2>\u003cp>AUREON brings the building blocks of blockchain into a clear, connected architecture.\u003c/p>\u003cdiv class=\"aur-stack\" data-active=\"1\" aria-hidden=\"true\">\u003csvg class=\"aur-defs\" aria-hidden=\"true\" focusable=\"false\">\u003cdefs>\u003clinearGradient id=\"aur-slab-on\" x1=\".5\" y1=\"0\" x2=\".5\" y2=\"1\">\u003cstop offset=\"0\" stop-color=\"#2a8783\"/>\u003cstop offset=\".45\" stop-color=\"#14505a\"/>\u003cstop offset=\"1\" stop-color=\"#0b2a3a\"/>\u003c/linearGradient>\u003cradialGradient id=\"aur-slab-glow\">\u003cstop offset=\"0\" stop-color=\"#36eeec\" stop-opacity=\".26\"/>\u003cstop offset=\".55\" stop-color=\"#36eeec\" stop-opacity=\".07\"/>\u003cstop offset=\"1\" stop-color=\"#36eeec\" stop-opacity=\"0\"/>\u003c/radialGradient>\u003c/defs>\u003c/svg>\u003cdiv class=\"aur-stack-rail\">\u003c/div>\u003cdiv class=\"aur-slab is-above\" style=\"--i:0\">\u003csvg viewBox=\"0 0 300 190\" aria-hidden=\"true\">\u003cellipse class=\"s-glow\" cx=\"150\" cy=\"142\" rx=\"150\" ry=\"62\"/>\u003cpolygon class=\"s-l\" points=\"6,89 150,172 150,183 6,100\"/>\u003cpolygon class=\"s-r\" points=\"150,172 294,89 294,100 150,183\"/>\u003cp 190\" aria-hidden=\"true\">\u003cellipse class=\"s-glow\" cx=\"150\" cy=\"142\" rx=\"150\" ry=\"62\"/>\u003cpolygon class=\"s-l\" points=\"6,89 150,172 150,183 6,100\"/>\u003cpolygon class=\"s-r\" points=\"150,172 294,89 294,100 150,183\"/>\u003cpolygon class=\"s-top\" points=\"150,6 294,89 150,172 6,89\"/>\u003cpolygon class=\"s-top-on\" points=\"150,6 294,89 150,172 6,89\"/>\u003cpolygon class=\"s-inner\" points=\"150,16 276.7,89 150,162 23.3,89\"/>\u003cpolygon class=\"p-tile\" points=\"150,29.2 253.7,89 230.6,102.3 127,42.5\"/>\u003cpolygon class=\"p-tile\" points=\"115.4,49.2 167.3,79 138.5,95.6 86.6,65.8\"/>\u003cpolygon class=\"p-tile p-tile-hot\" points=\"178.8,85.7 219.1,108.9 150,148.8 109.7,125.5\"/>\u003cpolygon class=\"p-tile\" points=\"75.1,72.4 127,102.3 98.2,118.9 46.3,89\"/>\u003cpath class=\"s-bevel\" d=\"M6 89 L150 6 L294 89\"/>\u003cpath class=\"s-edge\" d=\"M6 89 L150 172 L294 89\"/>\u003ccircle class=\"s-pin\" cx=\"150\" cy=\"160\" r=\"2.6\"/>\u003c/svg>\u003cspan class=\"aur-slab-label\">\u003cb>05\u003c/b>Services\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"tech-accordion reveal\">\u003cdiv class=\"tech-row\">\u003ch3>\u003cbutton aria-expanded=\"false\" aria-controls=\"layer-protocol\">\u003cspan>01\u003c/span>\u003cstrong>Protocol layer\u003csmall class=\"aur-teaser\">Common rules every participant can rely on.\u003c/small>\u003c/strong>\u003ci>+\u003c/i>\u003c/button>\u003c/h3>\u003cdiv class=\"aur-panel\" id=\"layer-protocol\" hidden>\u003cp>Shared rules give independent participants a common starting point. Open protocols make connection possible.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"tech-row\">\u003ch3>\u003cbutton aria-expanded=\"true\" aria-controls=\"layer-application\">\u003cspan>02\u003c/span>\u003cstrong>Application layer\u003csmall class=\"aur-teaser\">Where assets, workflows and people meet.\u003c/small>\u003c/strong>\u003ci>+\u003c/i>\u003c/button>\u003c/h3>\u003cdiv class=\"aur-panel\" id=\"layer-application\">\u003cp>The place where systems become useful. Create digital assets, connect workflows, and shape experiences around the people who use them.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"tech-row\">\u003ch3>\u003cbutton aria-expanded=\"false\" aria-controls=\"layer-network\">\u003cspan>03\u003c/span>\u003cstrong>Network layer\u003csmall class=\"aur-teaser\">Participants and information, linked with purpose.\u003c/small>\u003c/strong>\u003ci>+\u003c/i>\u003c/button>\u003c/h3>\u003cdiv class=\"aur-panel\" id=\"layer-network\" hidden>\u003cp>Link participants and information across a distributed network, giving every connection a role in the wider system.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"tech-row\">\u003ch3>\u003cbutton aria-expanded=\"false\" aria-controls=\"layer-infrastructure\">\u003cspan>04\u003c/span>\u003cstrong>Infrastructure layer\u003csmall class=\"aur-teaser\">The nodes, data and services beneath it all.\u003c/small>\u003c/strong>\u003ci>+\u003c/i>\u003c/button>\u003c/h3>\u003cdiv class=\"aur-panel\" id=\"layer-infrastructure\" hidden>\u003cp>Organize the nodes, data, and services beneath your applications. Start with a foundation that leaves room for your next idea.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"tech-row\">\u003ch3>\u003cbutton aria-expanded=\"false\" aria-controls=\"layer-services\">\u003cspan>05\u003c/span>\u003cstrong>Services & components\u003csmall class=\"aur-teaser\">Modular tools that fit the way you work.\u003c/small>\u003c/strong>\u003ci>+\u003c/i>\u003c/button>\u003c/h3>\u003cdiv class=\"aur-panel\" id=\"layer-services\" hidden>\u003cp>Bring the right pieces together. Modular tools and services connect blockchain capabilities to the way your team works.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"possibilities\" id=\"possibilities\" aria-labelledby=\"possibilities-title\">\n  \u003cdiv class=\"section-label\">\u003cspan>WHAT YOU CAN BUILD\u003c/span>\u003c/div>\n  \u003cdiv class=\"possibilities-heading\">\u003ch2 id=\"possibilities-title\">Your vision.\u003cbr>\u003cem>In motion.\u003c/em>\u003c/h2>\u003cp>Start with what you want to create.\u003cbr>See how the right layers bring it closer.\u003c/p>\u003c/div>\n  \u003cdiv class=\"possibility-grid\">\n    \u003cfigure class=\"system-figure\" data-mode=\"0\" aria-label=\"Three connected layers: infrastructure, applications and security\">\n      \n      \n      \u003cdiv class=\"system-object\" aria-hidden=\"true\">\u003cdiv class=\"system-assembly\">\n        \u003cdiv class=\"circuit-plane plane-foundation\">\u003csvg viewBox=\"0 0 280 280\">\u003cpath d=\"M25 72h59l34 34h48l32-32h54M26 214h54l35-35h47l35 35h55M72 25v59l34 34v48l-32 32v54M214 26v54l-35 35v47l35 35v55\"/>\u003cpath class=\"signal-path\" d=\"M26 214h54l35-35h47l35 35h55\"/>\u003ccircle cx=\"28\" cy=\"72\" r=\"5\"/>\u003ccircle cx=\"250\" cy=\"74\" r=\"5\"/>\u003ccircle cx=\"72\" cy=\"26\" r=\"5\"/>\u003ccircle cx=\"214\" cy=\"250\" r=\"5\"/>\u003c/svg>\u003ci class=\"aur-cast aur-cast-app\">\u003c/i>\u003ci class=\"plane-corner a\">\u003c/i>\u003ci class=\"plane-corner b\">\u003c/i>\u003c/div>\n        \u003cdiv class=\"circuit-plane plane-application\">\u003csvg viewBox=\"0 0 280 280\">\u003cpath d=\"M23 110h67l22 22h56l22-22h67M23 168h67l22-22h56l22 22h67M110 23v67l22 22v56l-22 22v67M168 23v67l-22 22v56l22 22v67\"/>\u003cpath class=\"signal-path\" d=\"M23 110h67l22 22h56l22-22h67\"/>\u003c/svg>\u003ci class=\"aur-cast aur-cast-glass\">\u003c/i>\u003ci class=\"aur-cast aur-cast-chip\">\u003c/i>\u003cdiv class=\"core-housing\">\u003csvg viewBox=\"0 0 60 60\">\u003cpath d=\"M30 11 49 45H11Z\"/>\u003cpath d=\"M30 22 39 38H21Z\"/>\u003c/svg>\u003c/div>\u003c/div>\n        \u003cdiv class=\"circuit-plane plane-security\">\u003csvg viewBox=\"0 0 280 280\">\u003cpath d=\"M36 92V36h56M188 36h56v56M244 188v56h-56M92 244H36v-56\"/>\u003crect x=\"83\" y=\"83\" width=\"114\" height=\"114\" rx=\"22\"/>\u003cpath class=\"signal-path\" d=\"M36 92V36h56M188 36h56v56M244 188v56h-56M92 244H36v-56\"/>\u003c/svg>\u003cspan class=\"aur-refract\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 280 280\">\u003cpath d=\"M23 110h67l22 22h56l22-22h67M23 168h67l22-22h56l22 22h67M110 23v67l22 22v56l-22 22v67M168 23v67l-22 22v56l22 22v67\"/>\u003c/svg>\u003c/span>\u003c/div>\n      \u003c/div>\u003c/div>\n      \u003cspan class=\"aur-plane-label\" data-plane=\"security\" aria-hidden=\"true\">Security\u003c/span>\u003cspan class=\"aur-plane-label\" data-plane=\"application\" aria-hidden=\"true\">Applications\u003c/span>\u003cspan class=\"aur-plane-label\" data-plane=\"foundation\" aria-hidden=\"true\">Infrastructure\u003c/span>\n      \n    \u003c/figure>\n    \u003cdiv class=\"possibility-explorer\">\n      \u003cdiv class=\"possibility-tabs\" role=\"tablist\" aria-label=\"Explore a use case\" aria-orientation=\"vertical\">\n        \u003cbutton role=\"tab\" id=\"case-tab-0\" aria-controls=\"case-panel-0\" aria-selected=\"true\" tabindex=\"0\" data-case=\"0\">\u003cspan>01\u003c/span>Digital assets\u003ci>↗\u003c/i>\u003c/button>\n        \u003cbutton role=\"tab\" id=\"case-tab-1\" aria-controls=\"case-panel-1\" aria-selected=\"false\" tabindex=\"-1\" data-case=\"1\">\u003cspan>02\u003c/span>Connected operations\u003ci>↗\u003c/i>\u003c/button>\n        \u003cbutton role=\"tab\" id=\"case-tab-2\" aria-controls=\"case-panel-2\" aria-selected=\"false\" tabindex=\"-1\" data-case=\"2\">\u003cspan>03\u003c/span>Trusted experiences\u003ci>↗\u003c/i>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"case-panel\" id=\"case-panel-0\" role=\"tabpanel\" aria-labelledby=\"case-tab-0\" tabindex=\"0\">\u003ch3>Value that moves.\u003cbr>Ownership that connects.\u003c/h3>\u003cp>Create digital assets with a clear purpose. Bring ownership, identity, and exchange into an experience that makes sense to people.\u003c/p>\u003cbutton class=\"text-link\" data-detail=\"applications\">How assets move\u003cspan>↗\u003c/span>\u003c/button>\u003c/div>\n      \u003cdiv class=\"case-panel\" id=\"case-panel-1\" role=\"tabpanel\" aria-labelledby=\"case-tab-1\" tabindex=\"0\" hidden>\u003ch3>One clearer view.\u003cbr>One connected flow.\u003c/h3>\u003cp>Bring teams, information, and processes into the same picture. Build connections that support the way your organization actually works.\u003c/p>\u003cbutton class=\"text-link\" data-detail=\"infrastructure\">How operations connect\u003cspan>↗\u003c/span>\u003c/button>\u003c/div>\n      \u003cdiv class=\"case-panel\" id=\"case-panel-2\" role=\"tabpanel\" aria-labelledby=\"case-tab-2\" tabindex=\"0\" hidden>\u003ch3>Clear access.\u003cbr>Stronger confidence.\u003c/h3>\u003cp>Consider identity, permissions, and protection from the start. Give people a clear experience, with security woven through each layer.\u003c/p>\u003cbutton class=\"text-link\" data-detail=\"security\">How trust is built\u003cspan>↗\u003c/span>\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\u003csection class=\"launch-path\" id=\"launch\" aria-labelledby=\"launch-title\">\n  \u003cdiv class=\"section-label\">\u003cspan>THE PATH FORWARD\u003c/span>\u003c/div>\n  \u003cdiv class=\"launch-heading\">\u003ch2 id=\"launch-title\">Start here. Go further.\u003c/h2>\u003cp>A strong idea deserves a thoughtful first step.\u003cbr>Find your purpose. Bring the right pieces together.\u003c/p>\u003c/div>\n  \u003col class=\"launch-steps\">\n    \u003cli>\u003cspan class=\"step-number\">01 / DISCOVER\u003c/span>\u003ch3>Find what matters.\u003c/h3>\u003cp>Start with a real need and the people behind it.\u003c/p>\u003c/li>\n    \u003cli>\u003cspan class=\"step-number\">02 / CONNECT\u003c/span>\u003ch3>Give it a foundation.\u003c/h3>\u003cp>Connect infrastructure, applications and security around one purpose.\u003c/p>\u003c/li>\n    \u003cli>\u003cspan class=\"step-number\">03 / CREATE\u003c/span>\u003ch3>Make room to grow.\u003c/h3>\u003cp>Build, learn and refine. Let each version shape the next.\u003c/p>\u003c/li>\n  \u003c/ol>\n  \u003cdiv class=\"launch-action\">\u003cdiv class=\"aur-cta-copy\">\u003cp class=\"aur-cta-line\">Build your next idea, \u003cspan>one layer at a time.\u003c/span>\u003c/p>\u003ca class=\"launch-note\" href=\"#technology\">Explore the AUREON architecture \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003ca class=\"shader-cta\" href=\"#connect\" aria-label=\"Take the first step\">\n    \u003cspan class=\"cta-halo\" aria-hidden=\"true\">\u003c/span>\n    \u003cspan class=\"cta-face\" aria-hidden=\"true\">\u003ccanvas>\u003c/canvas>\u003c/span>\n    \u003cspan class=\"cta-knob-fallback\" aria-hidden=\"true\">\u003c/span>\n    \u003cspan class=\"cta-label\" aria-hidden=\"true\">Take the first step\u003c/span>\n    \u003cspan class=\"cta-knob\" aria-hidden=\"true\">\n      \u003cspan class=\"cta-glow\">\u003c/span>\n      \u003csvg class=\"cta-pen\" viewBox=\"0 0 176 176\">\n        \u003cpath class=\"cta-scribble\" d=\"M63 108q5-5 10 0t10 0t10 0\"/>\n        \u003cg class=\"cta-pen-move\">\u003cg class=\"cta-pen-wiggle\">\n          \u003cpath class=\"cta-pen-body\" d=\"M106.1 77.4a3.8 3.8 0 0 0-15.1-15.1L70.3 82.9a7.6 7.6 0 0 0-1.9 3.2l-5 16.5a1.9 1.9 0 0 0 2.4 2.4l16.5-5a7.6 7.6 0 0 0 3.2-1.9z\"/>\n          \u003cpath class=\"cta-pen-body\" d=\"M85.1 68.4l7.6 7.6\"/>\n        \u003c/g>\u003c/g>\n      \u003c/svg>\n    \u003c/span>\n  \u003c/a>\u003c/div>\n\u003c/section>\n\n\u003c/main>\u003cfooter class=\"footer\" id=\"connect\">\u003cdiv class=\"footer-top\">\u003cdiv class=\"reveal\">\u003cp class=\"eyebrow\">Keep your next idea close\u003c/p>\u003ch2>Stay curious.\u003cbr>\u003cspan>Think ahead.\u003c/span>\u003c/h2>\u003c/div>\u003cform class=\"newsletter reveal\" id=\"newsletter\" novalidate>\u003cp class=\"aur-news-lead\">Ideas, updates, and a fresh perspective from AUREON.\u003c/p>\u003clabel class=\"aur-field-label\" for=\"email\">Email address\u003c

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rondel One Turntable — r3xdec 3D</title>
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js",
      "three/addons/": "/vendor/three/addons/"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at 50% 45%, #181a20, #08090c 75%); font-family: ui-sans-serif, system-ui, sans-serif; color: #f5f3ee; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .hud {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-radius: 999px;
      background: rgba(12, 14, 20, 0.78); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .lbl { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #a1a8b8; font-family: ui-monospace, monospace; white-space: nowrap; }
    .swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .swatch.active, .swatch:hover { transform: scale(1.2); border-color: #fff; }
  </style>
</head>
<body>
  <div class="hud">
    <span class="lbl">RONDEL ONE · AUDIOPHILE TURNTABLE</span>
    
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(2.6, 2.6, 4.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 25;
    controls.minDistance = 1.5;

    // Studio Lighting
    const ambient = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xfff5ea, 2.5);
    keyLight.position.set(5, 8, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x7090ff, 1.2);
    fillLight.position.set(-6, 3, -4);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 1.6);
    rimLight.position.set(0, 7, -6);
    scene.add(rimLight);

    // Floor shadow/reflection plane
    const floorGeo = new THREE.PlaneGeometry(30, 30);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x07080b,
      roughness: 0.85,
      metalness: 0.15,
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.8;
    floor.receiveShadow = true;
    scene.add(floor);

    const root = new THREE.Group();
    scene.add(root);

    
    const plinthMat = new THREE.MeshStandardMaterial({ color: 0x16181e, roughness: 0.25, metalness: 0.6 });
    const platterMat = new THREE.MeshPhysicalMaterial({ color: 0x3b82f6, roughness: 0.1, transmission: 0.6, thickness: 0.4 });
    const metalMat = new THREE.MeshStandardMaterial({ color: 0xd8dbe2, roughness: 0.2, metalness: 0.95 });
    const vinylMat = new THREE.MeshStandardMaterial({ color: 0x09090b, roughness: 0.4 });

    // Heavy Plinth Base
    const plinth = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.35, 3.0), plinthMat);
    plinth.position.y = -0.2;
    root.add(plinth);

    // Spinning Platter
    const platter = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.12, 48), platterMat);
    platter.position.set(-0.35, 0.08, 0);
    root.add(platter);

    // Vinyl Record on Platter
    const record = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 0.02, 48), vinylMat);
    record.position.set(-0.35, 0.15, 0);
    root.add(record);

    // Center Spindle
    const spindle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.15, 16), metalMat);
    spindle.position.set(-0.35, 0.2, 0);
    root.add(spindle);

    // Tonearm Base & Arm
    const armBase = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.22, 24), metalMat);
    armBase.position.set(1.2, 0.1, -0.8);
    root.add(armBase);

    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.8, 16), metalMat);
    arm.rotation.z = Math.PI / 2;
    arm.rotation.y = -Math.PI / 4;
    arm.position.set(0.6, 0.24, -0.2);
    root.add(arm);

    // Cartridge & Headshell
    const headshell = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.22), metalMat);
    headshell.position.set(0.05, 0.18, 0.45);
    root.add(headshell);
  

    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Subtle idle breathing motion
      root.rotation.y += 0.005;
      root.position.y = Math.sin(time * 1.2) * 0.04;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
